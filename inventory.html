  <script>
  /* Apply saved portal theme before paint (tmPrefs cookie key "th") to avoid FOUC. */
  (function () {
    try {
      var m = document.cookie.match(/(?:^|;\s*)tmPrefs=([^;]*)/);
      if (!m) return;
      var o = JSON.parse(decodeURIComponent(m[1]));
      var t = o.th || o['terramine.portal.theme'];
      if (t === 'coal') t = 'mine';
      if (t === 'dusk' || t === 'mine' || t === 'day') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  </script>
    <script>
  (function () {
    try {
      if (sessionStorage.getItem('tmPortalAuthed') === '1') {
        document.documentElement.classList.add('tm-expect-auth');
      }
    } catch (e) {}
  })();
  </script>

    html.tm-expect-auth body.auth-pending #portal { visibility: visible; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --gold: #FFD700; --white: #ffffff; --off-white: #f5f5f5; --text-dark: #333333;
      --text-mid: #666666; --text-light: #999999; --red: #f44336; --navy: #0D1B2A;
      --navy2: #111F30; --cyan: #4FC3F7; --border: rgba(255,255,255,0.07);

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; }
    body {

      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Full-viewport background layers (image + frost overlay) */
    .portalbackground,
    .backgroundoverlaycolor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .portalbackground {
      z-index: 0;
      background-image: url('/images/terratown-bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: cover;
    }
    .backgroundoverlaycolor {
      z-index: 1;
      background: rgba(238, 241, 244, 0.7); /* #eef1f4 @ 70% */
    }
    /* Portal chrome / content above the layers (top-nav keeps its own higher z-index later) */
    #login-screen,
    #portal,
    .layout,
    .main,
    .content {
      position: relative;
      z-index: 2;
    }

    body.auth-pending #login-screen, body.auth-pending #portal { visibility: hidden; }
    /* Top nav styles: portal-top-nav.css */

      width: 100%;
      min-width: 0;
    }


    .main { flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; background:transparent; position:relative; -webkit-overflow-scrolling:touch; }

    .login-card { width:100%; max-width:380px; background:var(--navy2, #111F30); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:12px; padding:36px 32px; }

    .input-group { margin-bottom:14px; }
    .input-label { font-size:11px; color:var(--gray, #8899AA); margin-bottom:5px; display:block; letter-spacing:0.5px; }
    .input-field { width:100%; background:var(--navy, #0D1B2A); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:6px; padding:10px 12px; font-size:14px; color:var(--white, #F0F4FF); font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.15s; }
    .input-field:focus { border-color:var(--cyan, #4FC3F7); }
    .input-field::placeholder { color:var(--muted, #556070); }
    .btn-primary { width:100%; padding:11px; background:var(--cyan, #4FC3F7); color:var(--navy, #0D1B2A); border:none; border-radius:6px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1.5px; cursor:pointer; margin-top:4px; transition:opacity 0.15s; }
    .btn-primary:hover { opacity:0.88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-google { width:100%; padding:10px; background:var(--surface, rgba(255,255,255,0.04)); color:var(--white, #F0F4FF); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.15s, background 0.15s; }
    .btn-google:hover { border-color:var(--gray, #8899AA); background:var(--navy3, #16263A); }
    .login-divider { display:flex; align-items:center; gap:12px; margin:20px 0; font-size:11px; color:var(--muted, #556070); }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:var(--border, rgba(255,255,255,0.07)); }

    .login-toggle { text-align:center; font-size:12px; color:var(--muted, #556070); margin-top:16px; }
    .login-toggle a { color:var(--cyan, #4FC3F7); text-decoration:none; cursor:pointer; }

    .mine-toolbar { position:sticky; top:0; z-index:40; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; background:#fff; border-bottom:1px solid #e3e7ee; box-shadow:0 2px 8px rgba(13,27,42,.08); }
    .tool-search {
      font: 500 13px 'DM Sans', sans-serif; color:#0D1B2A; background:#fff;
      border:1px solid #d0d5dc; border-radius:999px; padding:7px 12px; outline:none;
      flex:1; min-width:160px;
    }
    .tool-search:focus { border-color:var(--cyan); }
    .tool-search:disabled { opacity:.55; cursor:not-allowed; }
    .mine-count { margin-left:auto; font-size:12px; color:#64748b; font-weight:600; white-space:nowrap; }
    .inv-status { padding:8px 16px 0; font-size:13px; color:#64748b; min-height:0; }
    .inv-board-wrap { padding:6px 16px 40px; }

    .mine-group { margin-top:14px; }

    .mine-group-head img { width:36px; height:36px; object-fit:contain; }
    .mine-group-head h2 { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; font-weight:400; color:var(--navy); text-transform:uppercase; }
    .mine-group-count { font-size:12px; color:#64748b; font-weight:700; }

    .flip-type-order-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:40px; height:40px; padding:0; flex-shrink:0;
      border:1px solid #cbd5e1; border-radius:10px; background:#fff;
      color:#334155; cursor:pointer;
    }
    .flip-type-order-btn:hover { border-color:#4FC3F7; background:#e8f7fe; color:#0c4a6e; }
    .flip-type-order-btn:disabled { opacity:.55; cursor:not-allowed; }
    .flip-type-order-btn[aria-pressed="true"] { border-color:#4FC3F7; background:#e8f7fe; }
    .group-toggle-btn svg { width:22px; height:22px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    /* icon shows the action (same as the tip): grouped now → single-group icon; one group now → stacked icon */
    .group-toggle-btn .group-toggle-ico-grouped { display:none; }
    .group-toggle-btn[aria-pressed="true"] .group-toggle-ico-merged { display:none; }
    .group-toggle-btn[aria-pressed="true"] .group-toggle-ico-grouped { display:block; }
    .toolbar-follow-tip.is-red { background:#8B1E1E; color:#fff; border-color:rgba(255,255,255,.22); box-shadow:0 12px 28px rgba(6,10,16,.55); }
    /* Ungrouped view: one header bar listing every shown category with its count */
    .mine-group-head.is-all { flex-wrap:wrap; column-gap:18px; row-gap:4px; }
    .mine-group-head-type { display:inline-flex; align-items:center; gap:8px; }
    .mine-group-head-label { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; font-weight:400; color:var(--navy); line-height:1.1; text-transform:uppercase; }

    .inv-grid { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:14px; width:100%; }
    .inv-card {
      width:200px; max-width:100%; flex:0 0 auto;

    .inv-card-title {
      display:flex; align-items:baseline; justify-content:space-between; gap:8px;
      padding:8px 10px; background:#1b2430; color:#fff; min-height:40px;
    }
    .inv-card-name { font-size:13px; font-weight:700; line-height:1.2; flex:1; min-width:0;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .inv-card-rarity { font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;

    .inv-card-rarity.r-common { color:#94a3b8; }
    .inv-card-rarity.r-uncommon { color:#4ade80; }
    .inv-card-rarity.r-rare { color:#60a5fa; }
    .inv-card-rarity.r-epic { color:#c084fc; }
    /* Resource card left-to-right order by rarity (flex order) */
    .inv-card.rarity-common { order: 1; }
    .inv-card.rarity-uncommon { order: 2; }
    .inv-card.rarity-rare { order: 3; }
    .inv-card.rarity-epic { order: 4; }
    .inv-card.rarity-unknown { order: 99; }
    .inv-card-body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 10px 14px; }
    .mine-photo {
      width:72px; height:72px; border-radius:8px; overflow:hidden; flex-shrink:0;
      background:#eef1f4; border:1px dashed #c5ced8;
      display:flex; align-items:center; justify-content:center;
      font-size:9px; letter-spacing:.4px; text-transform:uppercase; color:#8899AA; text-align:center;
    }
    .mine-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .mine-photo.has-img { border-style:solid; border-color:#d0d5dc; background:#fff; }
    .inv-card-meta { font-size:13px; font-weight:700; color:#334155; text-align:center; font-variant-numeric:tabular-nums; }
    /* Item art (Sep 29, 2026): square item image fills the white card body
       edge-to-edge (uncropped, object-fit:contain); quantity overlaid at the
       bottom on a 50% white frosted pill. Items without art keep .mine-photo. */
    .inv-card-body.has-art { padding:0 0 12px; gap:8px; }
    .inv-card-body.has-art .inv-card-meta { padding:0 10px; }
    .inv-art { position:relative; width:100%; aspect-ratio:1 / 1; background:#fff; overflow:hidden; }
    .inv-art picture { display:block; width:100%; height:100%; }
    .inv-art img { display:block; width:100%; height:100%; object-fit:contain; }
    .inv-qty {
      position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
      max-width:calc(100% - 16px); box-sizing:border-box;
      padding:3px 14px; border-radius:999px;
      background:rgba(255,255,255,.5);
      -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
      border:1px solid rgba(255,255,255,.65);
      box-shadow:0 1px 4px rgba(13,27,42,.18);
      font:800 18px/1.25 'DM Sans', sans-serif; color:#0D1B2A;
      font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      text-shadow:0 1px 0 rgba(255,255,255,.7);
      pointer-events:none;
    }
    @media (max-width: 480px) {
      /* two cards per row on phones */
      .inv-grid { gap:12px; }
      .inv-card { width:calc(50% - 6px); }
      .inv-qty { font-size:16px; padding:2px 12px; bottom:6px; }
    }
    .inv-card-meta .muted { color:#64748b; font-weight:600; font-size:11px; }
    .inv-empty { padding:28px 12px; text-align:center; color:#64748b; font-size:14px; }
    .inv-loading { padding:24px; }
    .skeleton { height:120px; border-radius:12px; background:linear-gradient(90deg,#e8ecf1 25%,#f4f6f8 50%,#e8ecf1 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
    @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
    
  
    .toolbar-follow-tip {
      position:fixed; z-index:600; pointer-events:none; display:none;
      background:#0f172a; color:#f8fafc; border:1px solid rgba(255,255,255,.14);
      border-radius:8px; padding:8px 10px; box-shadow:0 12px 28px rgba(6,10,16,.45);
      font-size:13px; line-height:1.35; font-weight:500; text-align:left;
      max-width:min(280px, calc(100vw - 16px));
    }
</style>

  function mergeSeasonalIntoGroups(groups, seasonal) {
    if (!groups || !seasonal) return groups;
    const inv = Array.isArray(groups.inventory) ? groups.inventory.slice() : [];
    const slug = itemSlug(seasonal.name).replace(/-/g, '');
    const sArt = itemImageId(seasonal, 'inventory');
    groups.inventory = inv.filter(function (it) {
      if (it && it._seasonal) return false;
      const s = itemSlug(it && it.name).replace(/-/g, '');
      if (slug && s === slug) return false;
      // Speculative users.* pumpkin / jack-o-lantern entries → replaced by official doc
      if (sArt && it && it._src && String(it._src).indexOf('users.') === 0 && itemImageId(it, 'inventory') === sArt) return false;
      return true;
    });
    groups.inventory.push(seasonal);
    return groups;
  }


  // Grouped by category (default) vs. all items in one group — mirrors Mines.
  const INV_UNGROUPED_KEY = 'terramine.inventory.ungrouped';
  const INV_GROUP_TOGGLE_TIPS = {
    grouped: 'Display all items in 1 group',
    ungrouped: 'Re-group all items by their category'
  };
  let inventoryUngrouped = (function () { try { return TMPrefs.getItem(INV_UNGROUPED_KEY) === '1'; } catch (e) { return false; } })();
  function updateInvGroupToggleButton() {
    const btn = $('inv-group-toggle');
    if (!btn) return;
    const tip = inventoryUngrouped ? INV_GROUP_TOGGLE_TIPS.ungrouped : INV_GROUP_TOGGLE_TIPS.grouped;
    btn.setAttribute('aria-pressed', inventoryUngrouped ? 'true' : 'false');
    btn.setAttribute('aria-label', tip);
    btn.setAttribute('data-tip', tip);
    btn.classList.toggle('active', inventoryUngrouped);
  }
  function toggleInventoryGrouping() {
    inventoryUngrouped = !inventoryUngrouped;
    try { TMPrefs.setItem(INV_UNGROUPED_KEY, inventoryUngrouped ? '1' : '0'); } catch (e) {}
    updateInvGroupToggleButton();
    if (loadedUid) renderFromFilters();
  }

  function matchesSearch(item, q) {
    if (!q) return true;
    return String(item.name || '').toLowerCase().indexOf(q) >= 0;
  }

  function metaLine(item) {
    const parts = [];
    if (item.count != null) parts.push(fmtNum(item.count));
    if (item.value != null) {
      parts.push(item.count != null
        ? ('· value ' + fmtNum(item.value))
        : fmtNum(item.value));
    }
    return parts.join(' ');
  }

  function renderCard(item, opts) {
    opts = opts || {};
    const art = document.createElement('article');
    art.className = 'inv-card';
    art.dataset.name = item.name || '';
    if (opts.orderByRarity) {
      const rk = normalizeRarity(item.rarity);
      art.classList.add(RARITY_RANK.hasOwnProperty(rk) ? ('rarity-' + rk) : 'rarity-unknown');
    }

    const title = document.createElement('div');
    title.className = 'inv-card-title';
    const nameEl = document.createElement('div');
    nameEl.className = 'inv-card-name';
    const fallbackName = item.name || 'Untitled';
    // Resource groups: map mine type + rarity → display name; inventory unchanged.
    const mappedName = (opts.mineKey && opts.mineKey !== 'inventory')
      ? resourceDisplayName(opts.mineKey, item.rarity, fallbackName)
      : fallbackName;
    nameEl.textContent = mappedName;
    title.appendChild(nameEl);
    if (item.rarity) {
      const r = document.createElement('span');
      const rk = normalizeRarity(item.rarity);
      r.className = 'inv-card-rarity' + (RARITY_RANK.hasOwnProperty(rk) ? (' r-' + rk) : '');
      r.textContent = item.rarity;
      title.appendChild(r);
    }

    const body = document.createElement('div');
    body.className = 'inv-card-body';
    const artId = itemImageId(item, opts.mineKey);
    if (artId) {
      renderArtBody(body, item, artId, mappedName);
      art.append(title, body);
      return art;
    }
    renderLegacyBody(body, item);
    art.append(title, body);
    return art;
  }

  /** Full-width item art + quantity overlay. Falls back to the item's own
   *  image URL, then to the legacy 72px icon body, if the art fails to load. */
  function renderArtBody(body, item, artId, label) {
    body.classList.add('has-art');
    const wrap = document.createElement('div');
    wrap.className = 'inv-art';
    wrap.dataset.art = artId;
    const pic = document.createElement('picture');
    const sizes = '(max-width: 480px) 50vw, 200px';
    const src = document.createElement('source');
    src.type = 'image/webp';
    src.srcset = 'images/items/' + artId + '-240.webp 240w, images/items/' + artId + '.webp 480w';
    src.sizes = sizes;
    const img = document.createElement('img');
    img.alt = label || '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.width = 240;
    img.height = 240;
    img.sizes = sizes;
    img.srcset = 'images/items/' + artId + '-240.png 240w, images/items/' + artId + '.png 480w';
    img.src = 'images/items/' + artId + '-240.png';
    let triedOwn = false;
    img.addEventListener('error', () => {
      if (!triedOwn && item.image) {
        triedOwn = true;
        wrap.dataset.art = 'own';
        if (src.parentNode) src.remove();
        img.removeAttribute('srcset');
        img.removeAttribute('sizes');
        img.src = item.image;
        return;
      }
      body.classList.remove('has-art');
      body.innerHTML = '';
      renderLegacyBody(body, Object.assign({}, item, { image: '' }));
    });
    pic.append(src, img);
    wrap.appendChild(pic);
    if (item.count != null) {
      const q = document.createElement('div');
      q.className = 'inv-qty';
      q.textContent = fmtNum(item.count);
      q.setAttribute('aria-label', 'Quantity ' + fmtNum(item.count));
      wrap.appendChild(q);
    }
    body.appendChild(wrap);
    // Other info (value) stays below the art; the count now lives in the overlay.
    let line = '';
    if (item.count == null) line = metaLine(item) || '—';
    else if (item.value != null) line = 'value ' + fmtNum(item.value);
    if (line) {
      const meta = document.createElement('div');
      meta.className = 'inv-card-meta';
      meta.textContent = line;
      body.appendChild(meta);
    }
  }

  /** Previous card body: 72px icon (item image URL or "No image") + meta line. */
  function renderLegacyBody(body, item) {
    const photo = document.createElement('div');
    photo.className = 'mine-photo';
    if (item.image) {
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = item.image;
      img.addEventListener('error', () => {
        photo.classList.remove('has-img');
        photo.textContent = 'No image';
      });
      photo.classList.add('has-img');
      photo.appendChild(img);
    } else {
      photo.textContent = 'No image';
    }
    const meta = document.createElement('div');
    meta.className = 'inv-card-meta';
    const line = metaLine(item);
    meta.textContent = line || '—';
    body.append(photo, meta);
  }

  function renderFromFilters() {
    const q = ($('filter-search').value || '').trim().toLowerCase();
    const board = $('inv-board');
    board.innerHTML = '';
    let matchTotal = 0;
    let shownGroups = 0;

    // Precompute filtered lists per group (same search as before).
    const filteredByKey = {};
    GROUPS.forEach(g => {
      filteredByKey[g.key] = (groupData[g.key] || []).filter(it => matchesSearch(it, q));
    });

    if (inventoryUngrouped) {
      // One group: single header listing each category that has matches + all cards.
      const counts = {};
      const flat = [];
      GROUPS.forEach(g => {
        const filtered = filteredByKey[g.key] || [];
        if (!filtered.length) return;
        counts[g.key] = filtered.length;
        matchTotal += filtered.length;
        filtered.forEach(it => flat.push({ item: it, group: g }));
      });
      if (flat.length) {
        shownGroups = 1;
        const sec = document.createElement('section');
        sec.className = 'mine-group all-types';
        sec.dataset.group = 'all';
        const head = document.createElement('div');
        head.className = 'mine-group-head is-all';
        head.setAttribute('role', 'heading');
        head.setAttribute('aria-level', '2');
        GROUPS.forEach(g => {
          const n = counts[g.key] || 0;
          if (!n) return;
          const part = document.createElement('span');
          part.className = 'mine-group-head-type';
          part.dataset.type = g.key;
          const img = document.createElement('img');
          img.src = g.icon;
          img.alt = '';
          img.width = 36;
          img.height = 36;
          const label = document.createElement('span');
          label.className = 'mine-group-head-label';
          // Short labels for the combined bar (Inventory / Rock / Coal / Gold / Diamond)
          label.textContent = ({ inventory: 'Inventory', rock: 'Rock', coal: 'Coal', gold: 'Gold', diamond: 'Diamond' })[g.key] || g.title;
          const c = document.createElement('span');
          c.className = 'mine-group-count';
          c.textContent = String(n);
          part.append(img, label, c);
          head.appendChild(part);
        });
        const grid = document.createElement('div');
        grid.className = 'inv-grid';
        flat.forEach(function (row) {
          grid.appendChild(renderCard(row.item, { orderByRarity: !!row.group.sortByRarity, mineKey: row.group.key }));
        });
        sec.append(head, grid);
        board.appendChild(sec);
      }
    } else {
      GROUPS.forEach(g => {
        const filtered = filteredByKey[g.key] || [];
        if (!filtered.length) return;
        shownGroups++;
        matchTotal += filtered.length;

        const sec = document.createElement('section');
        sec.className = 'mine-group';
        sec.dataset.group = g.key;
        const head = document.createElement('div');
        head.className = 'mine-group-head';
        const img = document.createElement('img');
        img.src = g.icon;
        img.alt = '';
        img.width = 36;
        img.height = 36;
        const h = document.createElement('h2');
        h.textContent = g.title;
        const c = document.createElement('span');
        c.className = 'mine-group-count';
        c.textContent = String(filtered.length);
        head.append(img, h, c);
        const grid = document.createElement('div');
        grid.className = 'inv-grid';
        filtered.forEach(it => grid.appendChild(renderCard(it, { orderByRarity: !!g.sortByRarity, mineKey: g.key })));
        sec.append(head, grid);
        board.appendChild(sec);
      });
    }

    if (!shownGroups) {
      board.innerHTML = '<div class="inv-empty">' +
        (q ? 'No items match your search.' : 'No inventory or mine resources found.') +
        '</div>';
    }

    const totalAll = GROUPS.reduce((n, g) => n + ((groupData[g.key] || []).length), 0);
    if (q) {
      $('match-count').textContent = matchTotal + (matchTotal === 1 ? ' match' : ' matches');
    } else if (totalAll) {
      $('match-count').textContent = totalAll + (totalAll === 1 ? ' item' : ' items');
    } else {
      $('match-count').textContent = '';
    }
  }

    let loggedRawUsersDoc = false;
  async function loadPortal(user) {
    setToolbar(false);
    setStatus('Loading inventory…');
    $('inv-board').innerHTML = '<div class="inv-loading"><div class="skeleton"></div></div>';
    $('match-count').textContent = '';
    try {
      const uSnap = await db.collection('users').doc(user.uid).get();
      const ud = uSnap.data() || {};
      // One log per page load: the raw users/{uid} doc data exactly as returned.
      if (!loggedRawUsersDoc) { loggedRawUsersDoc = true; console.log('[inventory] users doc data:', uSnap.data()); }
      const nick = ud.nickname || user.displayName || user.email?.split('@')[0] || 'Miner';
      $('nav-nickname').textContent = nick;
      $('sb-tb').textContent = fmtTBBalance(ud.tbBalance || 0);
      $('sb-usd').textContent = fmtUSDBalance(ud.usdEarnings || 0);
      const avatarUrl = ud.avatarUrl || ud.avatarURL || user.photoURL || '';
      if (typeof avatarUrl === 'string' && avatarUrl.startsWith('https://')) {
        $('nav-avatar').innerHTML = '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(nick) + '">';
      } else {
        $('nav-avatar').textContent = initials(nick);
      }

      groupData = buildGroupsFromUser(ud);
      // Official seasonal item (config/seasonalEvent + seasonalInventory/{uid}{eventId})
      try {
        const seasonal = await fetchSeasonalInventoryItem(user.uid);
        if (seasonal) mergeSeasonalIntoGroups(groupData, seasonal);
      } catch (seasonErr) {
        try { console.warn('[inventory] seasonal merge failed:', seasonErr); } catch (_) {}
      }
      loadedUid = user.uid;
      logInventorySources('[inventory]', user.uid, ud, groupData);
      // ?debugInventory=1: also list your own users/{uid}/inventory, /items and
      // /collectibles subcollections (read-only; only with that URL flag) to
      // find where the app keeps an item that does not show here.
      if (/[?&]debugInventory=1(&|$)/.test(location.search)) {
        ['inventory', 'items', 'collectibles'].forEach(name => {
          const path = 'users/' + user.uid + '/' + name;
          db.collection('users').doc(user.uid).collection(name).limit(50).get()
            .then(snap => console.info('[inventory] debug: ' + path + ': ' + snap.size + ' doc(s)'
              + (snap.size ? ' — ' + snap.docs.map(d => d.id + ' {' + Object.keys(d.data() || {}).join(',') + '}').join('; ') : '')))
            .catch(err => console.info('[inventory] debug: ' + path + ' not readable (' + ((err && (err.code || err.message)) || err) + ')'));
        });
      }

      // Log observed shapes once (no secrets) for scaffolding diagnostics
      try {
        const shapeNote = GROUPS.map(g => {
          const raw = ud[g.field];
          const t = raw == null ? 'null' : (Array.isArray(raw) ? 'array[' + raw.length + ']' : typeof raw);
          return g.field + '=' + t;
        }).join(', ');
        console.info('[inventory] users/' + user.uid + ' fields: ' + shapeNote);
      } catch (_) {}

      const total = GROUPS.reduce((n, g) => n + ((groupData[g.key] || []).length), 0);
      setStatus(total ? '' : 'No inventory items yet.');
      setToolbar(true);
      renderFromFilters();
    } catch (e) {
      console.error('Inventory load error:', e);
      setStatus('Could not load inventory. ' + (e && e.message ? e.message : ''));
      $('inv-board').innerHTML = '<div class="inv-empty">Error loading inventory.</div>';
      setToolbar(true);
    }
  }

  
  function syncStickyFilterOffset() {
    const main = $('portal-main');
    const nav = document.querySelector('#portal-main .top-nav') || document.querySelector('.top-nav');
    const bar = document.querySelector('#portal-main .mine-toolbar');
    if (!main || !bar) return;
    let top = 0;
    if (nav) {
      const mr = main.getBoundingClientRect();
      const nr = nav.getBoundingClientRect();
      top = Math.max(0, Math.min(nr.bottom, mr.bottom) - mr.top);
      if (nr.bottom <= mr.top) top = 0;
    }
    bar.style.top = Math.round(top) + 'px';
  }
  (function bindStickyFilterOffset() {
    const main = $('portal-main');
    if (!main || main.dataset.stickyFilterBound === '1') return;
    main.dataset.stickyFilterBound = '1';
    main.addEventListener('scroll', syncStickyFilterOffset, { passive: true });
    window.addEventListener('resize', syncStickyFilterOffset);
    syncStickyFilterOffset();
  })();

  auth.onAuthStateChanged(user => {
    if (!authResolved) {
      document.body.classList.remove('auth-pending');
      authResolved = true;
    }
    if (user) {
      try { sessionStorage.setItem('tmPortalAuthed', '1'); } catch (e) {}
      document.body.classList.remove('auth-pending');

      $('login-screen').style.display = 'none';
      $('portal').style.display = 'flex';
      loadPortal(user);
    } else {

      try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
      document.documentElement.classList.remove('tm-expect-auth');
      document.body.classList.remove('auth-pending');
      loadedUid = null;
      groupData = {};
      $('portal').style.display = 'none';
      $('login-screen').style.display = 'flex';
    }
  });

  $('btn-google-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-email-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    const email = $('input-email').value.trim();
    const pass = $('input-password').value;
    try { await auth.signInWithEmailAndPassword(email, pass); }
    catch (e) {
      $('login-error').textContent = (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
        ? 'Incorrect email or password.' : e.message;
    }
  });
  $('btn-reset').addEventListener('click', async () => {
    const email = $('input-email').value.trim();
    if (!email) { $('login-error').textContent = 'Enter your email first.'; return; }
    try { await auth.sendPasswordResetEmail(email); $('login-error').style.color = '#66BB6A'; $('login-error').textContent = 'Reset email sent!'; }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-signout').addEventListener('click', () => {
    try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
    document.documentElement.classList.remove('tm-expect-auth');
    auth.signOut();
  });

  (function initAccountMenu() {
    var toggle = document.getElementById('nav-account-toggle');
    var dropdown = document.getElementById('nav-account-dropdown');
    var wrap = document.querySelector('.nav-account');
    if (!toggle || !dropdown) return;
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var willOpen = dropdown.hasAttribute('hidden');
      if (willOpen) dropdown.removeAttribute('hidden');
      else dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!wrap || wrap.contains(e.target)) return;
      dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();

  (function restoreSavedSearch() {   // last search (tmPrefs cookie)
    try {
      const q = TMPrefs.get('terramine.inventory.search', '');
      if (typeof q === 'string' && q) $('filter-search').value = q;
    } catch (e) {}
  })();
  $('filter-search').addEventListener('input', () => {
    try { TMPrefs.set('terramine.inventory.search', $('filter-search').value || ''); } catch (e) {}
    if (loadedUid) renderFromFilters();
  });

  updateInvGroupToggleButton();
  (function bindInvGroupToggle() {
    const btn = $('inv-group-toggle');
    if (!btn || btn.dataset.invGroupBound === '1') return;
    btn.dataset.invGroupBound = '1';
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      toggleInventoryGrouping();
    });
  })();

  (function bindInvGroupFollowTip() {
    var DELAY = 200;
    var tipEl = null, tipTimer = null, tipHide = null, tipTarget = null, tipX = 0, tipY = 0, touchAt = 0;
    function ensureTip() {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.className = 'toolbar-follow-tip';
        tipEl.setAttribute('role', 'tooltip');
        document.body.appendChild(tipEl);
      }
      return tipEl;
    }
    function placeTip(x, y) {
      var tip = ensureTip();
      var gap = 14, edge = 8;
      tip.style.visibility = 'hidden';
      tip.style.display = 'block';
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + gap, top = y + gap;
      if (left + w > window.innerWidth - edge) left = x - gap - w;
      if (top + h > window.innerHeight - edge) top = y - gap - h;
      if (left < edge) left = edge;
      if (top < edge) top = edge;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.visibility = 'visible';
    }
    function dismiss() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      if (tipHide) { clearTimeout(tipHide); tipHide = null; }
      tipTarget = null;
      if (tipEl) tipEl.style.display = 'none';
    }
    var btn = $('inv-group-toggle');
    if (!btn || btn.dataset.invGroupTipBound === '1') return;
    btn.dataset.invGroupTipBound = '1';
    btn.addEventListener('touchstart', function () { touchAt = Date.now(); }, { passive: true });
    btn.addEventListener('mouseenter', function (e) {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      if (tipHide) { clearTimeout(tipHide); tipHide = null; }
      var fromTap = Date.now() - touchAt < 1000;
      tipTarget = btn;
      tipX = e.clientX; tipY = e.clientY;
      var tip = ensureTip();
      tip.textContent = (btn.getAttribute('data-tip') || '').trim();
      tip.classList.toggle('is-red', btn.dataset.tipVariant === 'red');
      tip.style.display = 'none';
      tipTimer = setTimeout(function () {
        tipTimer = null;
        if (tipTarget !== btn || !btn.isConnected) return;
        placeTip(tipX, tipY);
        if (fromTap) tipHide = setTimeout(function () { if (tipTarget === btn) dismiss(); }, 1500);
      }, DELAY);
    });
    btn.addEventListener('mousemove', function (e) {
      if (tipTarget !== btn) return;
      tipX = e.clientX; tipY = e.clientY;
      if (tipEl && tipEl.style.display === 'block' && !tipTimer) placeTip(tipX, tipY);
    });
    btn.addEventListener('mouseleave', function () {
      if (tipTarget === btn) dismiss();
    });
  })();


  (function bindNavPillFollowTips() {
    var DELAY = 320;
    var tipEl = null, tipTimer = null, tipTarget = null, tipX = 0, tipY = 0;
    function ensureTip() {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.className = 'toolbar-follow-tip';
        tipEl.setAttribute('role', 'tooltip');
        document.body.appendChild(tipEl);
      }
      return tipEl;
    }
    function placeTip(x, y) {
      var tip = ensureTip();
      var gap = 14, edge = 8;
      tip.style.visibility = 'hidden';
      tip.style.display = 'block';
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + gap, top = y + gap;
      if (left + w > window.innerWidth - edge) left = x - gap - w;
      if (top + h > window.innerHeight - edge) top = y - gap - h;
      if (left < edge) left = edge;
      if (top < edge) top = edge;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.visibility = 'visible';
    }
    function hideTip() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipTarget = null;
      if (tipEl) tipEl.style.display = 'none';
    }
    function bindPill(el) {
      if (!el || el.dataset.navPillTipBound === '1') return;
      el.dataset.navPillTipBound = '1';
      el.addEventListener('mouseenter', function (e) {
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
        tipTarget = el;
        tipX = e.clientX; tipY = e.clientY;
        var tip = ensureTip();
        tip.textContent = (el.getAttribute('data-tip') || '').trim();
        tip.style.display = 'none';
        tipTimer = setTimeout(function () {
          tipTimer = null;
          if (tipTarget !== el || !el.isConnected) return;
          placeTip(tipX, tipY);
        }, DELAY);
      });
      el.addEventListener('mousemove', function (e) {
        if (tipTarget !== el) return;
        tipX = e.clientX; tipY = e.clientY;
        if (tipEl && tipEl.style.display === 'block' && !tipTimer) placeTip(tipX, tipY);
      });
      el.addEventListener('mouseleave', function () {
        if (tipTarget === el) hideTip();
      });
      el.addEventListener('blur', function () {
        if (tipTarget === el) hideTip();
      });
    }
    function ready(fn) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
      else fn();
    }
    ready(function () {
      bindPill(document.querySelector('.nav-pill-usd'));
      bindPill(document.querySelector('.nav-pill-tb'));
    });
  })();
