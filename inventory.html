  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #e8d5b7; --brown-dark: #5C3317; --brown: #8B4513; --brown-mid: #8B7355;
      --gold: #FFD700; --white: #ffffff; --off-white: #f5f5f5; --text-dark: #333333;
      --text-mid: #666666; --text-light: #999999; --red: #f44336; --navy: #0D1B2A;
      --navy2: #111F30; --cyan: #4FC3F7; --border: rgba(255,255,255,0.07);
      --navy3: #16263A;
      --muted: #556070;
      --gray: #8899AA;
      --surface: rgba(255,255,255,0.04);
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; }
    body {
      position: relative;
      background-color: #0D1B2A; /* fallback while layers load */
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Full-viewport background layers (image + frost overlay) */
    .portalbackground,
    .backgroundoverlaycolor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .portalbackground {
      z-index: 0;
      background-image: url('/images/terratown-bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: cover;
    }
    .backgroundoverlaycolor {
      z-index: 1;
      background: rgba(238, 241, 244, 0.7); /* #eef1f4 @ 70% */
    }
    /* Portal chrome / content above the layers (top-nav keeps its own higher z-index later) */
    #login-screen,
    #portal,
    .layout,
    .main,
    .content {
      position: relative;
      z-index: 2;
    }

    body.auth-pending #login-screen, body.auth-pending #portal { visibility: hidden; }
        /* ═══════════════════════════════════════════
       TOP NAV (portal shell — no left sidebar)
    ═══════════════════════════════════════════ */
    .top-nav {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 5px 20px;
      height: 100px;
      box-sizing: border-box;
      background: rgba(13,27,42,0.97);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
      line-height: 0;
    }
    .nav-logo img {
      display: block;
      width: 90px;
      height: auto;
    }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      font-size: 18px;
      font-weight: 500;
      color: #8899AA;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-links a.active {

      background: rgba(79,195,247,0.12);
    }
    .nav-right {

      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .nav-account {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-account-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 4px 6px 4px 4px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .nav-account-link:hover { background: rgba(255,255,255,0.06); }
    .nav-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--navy3, #16263A);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size:18px;
      font-weight: 700;
      color: var(--cyan);
      overflow: hidden;
      flex-shrink: 0;
    }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-nickname {
      font-size: 18px;
      color: #8899AA;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-account-toggle {
      background: none;
      border: none;
      color: #8899AA;
      cursor: pointer;
      padding: 6px 4px;
      font-size: 11px;
      line-height: 1;
      border-radius: 4px;
    }
    .nav-account-toggle:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-account-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 140px;
      background: #111F30;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 200;
    }
    .nav-account-dropdown[hidden] { display: none !important; }
    .nav-signout {
      display: block;
      width: 100%;
      text-align: left;
      font-size: 18px;
      color: #8899AA;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .nav-signout:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 10px 0 8px;
      background: #0D1B2A;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      white-space: nowrap;
    }
    .nav-pill-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .nav-pill-usd-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: rgba(245,158,11,0.18);
      color: #F59E0B;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;

    .nav-pill-tb .nav-pill-value { color: #4FC3F7; }

    .layout { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; width:100%; }
    .layout > .content {
      width: 100%;
      min-width: 0;
    }

    @media (max-width: 900px) {

      .nav-links a { padding: 6px 10px; font-size: 15px; }
    }
    @media (max-width: 700px) {

      .nav-pill { padding: 0 8px 0 6px; }
      .nav-pill-value { font-size: 15px; }

    .main { flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; background:transparent; position:relative; -webkit-overflow-scrolling:touch; }
    #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:transparent; padding:24px; }
    .login-card { width:100%; max-width:380px; background:var(--navy2, #111F30); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:12px; padding:36px 32px; }

    .btn-primary:hover { opacity:0.88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-google { width:100%; padding:10px; background:var(--surface, rgba(255,255,255,0.04)); color:var(--white, #F0F4FF); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.15s, background 0.15s; }
    .btn-google:hover { border-color:var(--gray, #8899AA); background:var(--navy3, #16263A); }
    .login-divider { display:flex; align-items:center; gap:12px; margin:20px 0; font-size:11px; color:var(--muted, #556070); }

    .login-toggle { text-align:center; font-size:12px; color:var(--muted, #556070); margin-top:16px; }
    .login-toggle a { color:var(--cyan, #4FC3F7); text-decoration:none; cursor:pointer; }

    .mine-toolbar { position:sticky; top:0; z-index:40; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; background:#fff; border-bottom:1px solid #e3e7ee; box-shadow:0 2px 8px rgba(13,27,42,.08); }
    .tool-search {
      font: 500 13px 'DM Sans', sans-serif; color:#0D1B2A; background:#fff;
      border:1px solid #d0d5dc; border-radius:999px; padding:7px 12px; outline:none;
      flex:1; min-width:160px;
    }
    .tool-search:focus { border-color:var(--cyan); }
    .tool-search:disabled { opacity:.55; cursor:not-allowed; }
    .mine-count { margin-left:auto; font-size:12px; color:#64748b; font-weight:600; white-space:nowrap; }
    .inv-status { padding:8px 16px 0; font-size:13px; color:#64748b; min-height:0; }
    .inv-board-wrap { padding:6px 16px 40px; }

    .mine-group { margin-top:14px; }
    .mine-group-head { display:flex; align-items:center; gap:10px; margin:8px 2px 10px; }
    .mine-group-head img { width:36px; height:36px; object-fit:contain; }
    .mine-group-head h2 { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; font-weight:400; color:var(--navy); text-transform:uppercase; }
    .mine-group-count { font-size:12px; color:#64748b; font-weight:700; }

    .inv-grid { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:14px; width:100%; }
    .inv-card {
      width:200px; max-width:100%; flex:0 0 auto;
      background:#fff; border:1px solid #e3e7ee; border-radius:12px;
      box-shadow:0 6px 16px rgba(13,27,42,.08); overflow:hidden; color:#0D1B2A;
    }
    .inv-card-title {
      display:flex; align-items:baseline; justify-content:space-between; gap:8px;
      padding:8px 10px; background:#1b2430; color:#fff; min-height:40px;
    }
    .inv-card-name { font-size:13px; font-weight:700; line-height:1.2; flex:1; min-width:0;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .inv-card-rarity { font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
      color:#c5ced8; white-space:nowrap; flex-shrink:0; }
    .inv-card-rarity.r-common { color:#94a3b8; }
    .inv-card-rarity.r-uncommon { color:#4ade80; }
    .inv-card-rarity.r-rare { color:#60a5fa; }
    .inv-card-rarity.r-epic { color:#c084fc; }
    /* Resource card left-to-right order by rarity (flex order) */
    .inv-card.rarity-common { order: 1; }
    .inv-card.rarity-uncommon { order: 2; }
    .inv-card.rarity-rare { order: 3; }
    .inv-card.rarity-epic { order: 4; }
    .inv-card.rarity-unknown { order: 99; }
    .inv-card-body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 10px 14px; }
    .mine-photo {
      width:72px; height:72px; border-radius:8px; overflow:hidden; flex-shrink:0;
      background:#eef1f4; border:1px dashed #c5ced8;
      display:flex; align-items:center; justify-content:center;
      font-size:9px; letter-spacing:.4px; text-transform:uppercase; color:#8899AA; text-align:center;
    }
    .mine-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .mine-photo.has-img { border-style:solid; border-color:#d0d5dc; background:#fff; }
    .inv-card-meta { font-size:13px; font-weight:700; color:#334155; text-align:center; font-variant-numeric:tabular-nums; }
    .inv-card-meta .muted { color:#64748b; font-weight:600; font-size:11px; }
    .inv-empty { padding:28px 12px; text-align:center; color:#64748b; font-size:14px; }
    .inv-loading { padding:24px; }
    .skeleton { height:120px; border-radius:12px; background:linear-gradient(90deg,#e8ecf1 25%,#f4f6f8 50%,#e8ecf1 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
    @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
    
  
    .toolbar-follow-tip {
      position:fixed; z-index:600; pointer-events:none; display:none;
      background:#0f172a; color:#f8fafc; border:1px solid rgba(255,255,255,.14);

      font-size:13px; line-height:1.35; font-weight:500; text-align:left;
      max-width:min(280px, calc(100vw - 16px));
    }
</style>
</head>

    coal: { common: 'Coal Dust', uncommon: 'Lignite', rare: 'Anthracite', epic: 'Diamond Coal' },
    gold: { common: 'Gold Flakes', uncommon: 'Gold Nugget', rare: 'Gold Bar', epic: 'Gold Ingot' },
    diamond: { common: 'Diamond Chip', uncommon: 'Raw Diamond', rare: 'Cut Diamond', epic: 'Flawless Diamond' }
  };

  function resourceDisplayName(mineKey, rarity, fallback) {
    const byMine = RESOURCE_DISPLAY_NAMES[mineKey];
    if (!byMine) return fallback;
    const rk = normalizeRarity(rarity);
    if (rk && Object.prototype.hasOwnProperty.call(byMine, rk)) return byMine[rk];
    return fallback;
  }

  let loadedUid = null;
  let groupData = {}; // key -> parsed items[]

  function fmtTBBalance(n) {
    const x = Number(n);
    if (!isFinite(x)) return '0';
    return Math.round(x).toLocaleString('en-US');
  }
  function fmtUSDBalance(n) {
    const v = parseFloat(n) || 0;
    return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtNum(n) {
    if (n == null || n === '') return '';
    const x = Number(n);
    if (!isFinite(x)) return String(n);
    if (Math.abs(x) >= 1000000) return (x / 1000000).toFixed(1) + 'M';
    if (Math.abs(x) >= 1000) return (x / 1000).toFixed(1) + 'K';
    return Number.isInteger(x) ? x.toLocaleString() : String(x);
  }
  function fmtUSD(n) { return '$' + (parseFloat(n) || 0).toFixed(2); }
  function initials(name) { if (!name) return '?'; return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function setStatus(msg) { $('inv-status').textContent = msg || ''; }
  function setToolbar(on) {
    const el = $('filter-search');
    if (el) el.disabled = !on;
  }

  function pickFirst(obj, keys) {
    if (!obj || typeof obj !== 'object') return undefined;
    for (const k of keys) {
      if (obj[k] != null && obj[k] !== '') return obj[k];
    }
    return undefined;
  }
  function asString(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    return '';
  }
  function asNum(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number' && isFinite(v)) return v;
    if (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v))) return Number(v);
    return null;
  }
  function asUrl(v) {
    const s = asString(v);
    if (!s) return '';
    if (/^https?:\/\//i.test(s) || s.startsWith('/') || s.startsWith('data:')) return s;
    return '';
  }
  function normalizeRarity(v) {
    const s = asString(v).toLowerCase();
    if (!s) return '';
    if (RARITY_RANK.hasOwnProperty(s)) return s;
    if (s.indexOf('epic') >= 0) return 'epic';
    if (s.indexOf('rare') >= 0) return 'rare';
    if (s.indexOf('uncommon') >= 0) return 'uncommon';
    if (s.indexOf('common') >= 0) return 'common';
    return s;
  }
  function rarityRank(r) {
    const k = normalizeRarity(r);
    return RARITY_RANK.hasOwnProperty(k) ? RARITY_RANK[k] : 99;
  }

  /** Coerce Firestore field (array | map | nested) into a flat list of raw entries. */
  function toRawList(raw) {
    if (raw == null) return [];
    if (Array.isArray(raw)) return raw;
    if (typeof raw !== 'object') return [raw];
    if (Array.isArray(raw.items)) return raw.items;
    if (Array.isArray(raw.list)) return raw.list;
    if (Array.isArray(raw.resources)) return raw.resources;
    if (Array.isArray(raw.entries)) return raw.entries;
    return Object.keys(raw).map(k => {
      const v = raw[k];
      if (v != null && typeof v === 'object' && !Array.isArray(v)) {
        return Object.assign({ id: k }, v);
      }
      return { id: k, name: k, count: v };
    });
  }

  function parseItem(raw, idx) {
    if (raw == null) return null;
    if (typeof raw === 'string' || typeof raw === 'number') {
      return { name: String(raw), rarity: '', image: '', value: null, count: null, _raw: raw };
    }
    if (typeof raw !== 'object') return null;
    const name = asString(pickFirst(raw, [
      'name', 'title', 'displayName', 'itemName', 'label', 'resourceName', 'resource', 'type', 'id'
    ])) || ('Item ' + (idx + 1));
    let rarity = normalizeRarity(pickFirst(raw, [
      'rarity', 'tier', 'quality', 'grade', 'rarityTier', 'rarityLevel'
    ]));
    // Map form { common: N, ... }: keys are rarity tiers with no rarity field.
    // Fall back to name / map key when it is itself a known rarity.
    if (!rarity) {
      const fromName = normalizeRarity(name);
      if (RARITY_RANK.hasOwnProperty(fromName)) {
        rarity = fromName;
      } else {
        const fromKey = normalizeRarity(asString(pickFirst(raw, ['id', 'key'])));
        if (RARITY_RANK.hasOwnProperty(fromKey)) rarity = fromKey;
      }
    }
    const image = asUrl(pickFirst(raw, [
      'image', 'imageUrl', 'imageURL', 'img', 'photo', 'photoUrl', 'photoURL',
      'icon', 'iconUrl', 'iconURL', 'url', 'thumbnail', 'thumb', 'assetUrl', 'assetURL'
    ]));
    const value = asNum(pickFirst(raw, [
      'value', 'tbValue', 'tb', 'price', 'worth', 'sellValue', 'terraBucks'
    ]));
    const count = asNum(pickFirst(raw, [
      'count', 'qty', 'quantity', 'amount', 'owned', 'stack', 'stacks', 'total'
    ]));
    return { name, rarity, image, value, count, _raw: raw };
  }

  function parseGroupField(raw) {
    const list = toRawList(raw);
    const out = [];
    list.forEach((entry, i) => {
      const item = parseItem(entry, i);
      if (item && item.name) out.push(item);
    });
    return out;
  }

  function sortResourceItems(items) {
    return items.slice().sort((a, b) => {
      const ra = rarityRank(a.rarity);
      const rb = rarityRank(b.rarity);
      if (ra !== rb) return ra - rb;
      return String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' });
    });
  }

  function buildGroupsFromUser(ud) {
    const result = {};
    GROUPS.forEach(g => {
      let items = parseGroupField(ud[g.field]);
      if (g.sortByRarity) items = sortResourceItems(items);
      // inventory: keep insertion / forEach order from parseGroupField
      result[g.key] = items;
    });
    return result;
  }

  function matchesSearch(item, q) {
    if (!q) return true;
    return String(item.name || '').toLowerCase().indexOf(q) >= 0;
  }

  function metaLine(item) {
    const parts = [];
    if (item.count != null) parts.push(fmtNum(item.count));
    if (item.value != null) {
      parts.push(item.count != null
        ? ('· value ' + fmtNum(item.value))
        : fmtNum(item.value));
    }
    return parts.join(' ');
  }

  function renderCard(item, opts) {
    opts = opts || {};
    const art = document.createElement('article');
    art.className = 'inv-card';
    art.dataset.name = item.name || '';
    if (opts.orderByRarity) {
      const rk = normalizeRarity(item.rarity);
      art.classList.add(RARITY_RANK.hasOwnProperty(rk) ? ('rarity-' + rk) : 'rarity-unknown');
    }

    const title = document.createElement('div');
    title.className = 'inv-card-title';
    const nameEl = document.createElement('div');
    nameEl.className = 'inv-card-name';
    const fallbackName = item.name || 'Untitled';
    // Resource groups: map mine type + rarity → display name; inventory unchanged.
    const mappedName = (opts.mineKey && opts.mineKey !== 'inventory')
      ? resourceDisplayName(opts.mineKey, item.rarity, fallbackName)
      : fallbackName;
    nameEl.textContent = mappedName;
    title.appendChild(nameEl);
    if (item.rarity) {
      const r = document.createElement('span');
      const rk = normalizeRarity(item.rarity);
      r.className = 'inv-card-rarity' + (RARITY_RANK.hasOwnProperty(rk) ? (' r-' + rk) : '');
      r.textContent = item.rarity;
      title.appendChild(r);
    }

    const body = document.createElement('div');
    body.className = 'inv-card-body';
    const photo = document.createElement('div');
    photo.className = 'mine-photo';
    if (item.image) {
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = item.image;
      img.addEventListener('error', () => {
        photo.classList.remove('has-img');
        photo.textContent = 'No image';
      });
      photo.classList.add('has-img');
      photo.appendChild(img);
    } else {
      photo.textContent = 'No image';
    }
    const meta = document.createElement('div');
    meta.className = 'inv-card-meta';
    const line = metaLine(item);
    meta.textContent = line || '—';
    body.append(photo, meta);
    art.append(title, body);
    return art;
  }

  function renderFromFilters() {
    const q = ($('filter-search').value || '').trim().toLowerCase();
    const board = $('inv-board');
    board.innerHTML = '';
    let matchTotal = 0;
    let shownGroups = 0;

    GROUPS.forEach(g => {
      const all = groupData[g.key] || [];
      const filtered = all.filter(it => matchesSearch(it, q));
      if (!filtered.length) return;
      shownGroups++;
      matchTotal += filtered.length;

      const sec = document.createElement('section');
      sec.className = 'mine-group';
      sec.dataset.group = g.key;
      const head = document.createElement('div');
      head.className = 'mine-group-head';
      const img = document.createElement('img');
      img.src = g.icon;
      img.alt = '';
      img.width = 36;
      img.height = 36;
      const h = document.createElement('h2');
      h.textContent = g.title;
      const c = document.createElement('span');
      c.className = 'mine-group-count';
      c.textContent = String(filtered.length);
      head.append(img, h, c);
      const grid = document.createElement('div');
      grid.className = 'inv-grid';
      filtered.forEach(it => grid.appendChild(renderCard(it, { orderByRarity: !!g.sortByRarity, mineKey: g.key })));
      sec.append(head, grid);
      board.appendChild(sec);
    });

    if (!shownGroups) {
      board.innerHTML = '<div class="inv-empty">' +
        (q ? 'No items match your search.' : 'No inventory or mine resources found.') +
        '</div>';
    }

    const totalAll = GROUPS.reduce((n, g) => n + ((groupData[g.key] || []).length), 0);
    if (q) {
      $('match-count').textContent = matchTotal + (matchTotal === 1 ? ' match' : ' matches');
    } else if (totalAll) {
      $('match-count').textContent = totalAll + (totalAll === 1 ? ' item' : ' items');
    } else {
      $('match-count').textContent = '';
    }
  }

  async function loadPortal(user) {
    setToolbar(false);
    setStatus('Loading inventory…');
    $('inv-board').innerHTML = '<div class="inv-loading"><div class="skeleton"></div></div>';
    $('match-count').textContent = '';
    try {
      const uSnap = await db.collection('users').doc(user.uid).get();
      const ud = uSnap.data() || {};
      const nick = ud.nickname || user.displayName || user.email?.split('@')[0] || 'Miner';
      $('nav-nickname').textContent = nick;
      $('sb-tb').textContent = fmtTBBalance(ud.tbBalance || 0);
      $('sb-usd').textContent = fmtUSDBalance(ud.usdEarnings || 0);
      const avatarUrl = ud.avatarUrl || ud.avatarURL || user.photoURL || '';
      if (typeof avatarUrl === 'string' && avatarUrl.startsWith('https://')) {
        $('nav-avatar').innerHTML = '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(nick) + '">';
      } else {
        $('nav-avatar').textContent = initials(nick);
      }

      groupData = buildGroupsFromUser(ud);
      loadedUid = user.uid;

      // Log observed shapes once (no secrets) for scaffolding diagnostics
      try {
        const shapeNote = GROUPS.map(g => {
          const raw = ud[g.field];
          const t = raw == null ? 'null' : (Array.isArray(raw) ? 'array[' + raw.length + ']' : typeof raw);
          return g.field + '=' + t;
        }).join(', ');
        console.info('[inventory] users/' + user.uid + ' fields: ' + shapeNote);
      } catch (_) {}

      const total = GROUPS.reduce((n, g) => n + ((groupData[g.key] || []).length), 0);
      setStatus(total ? '' : 'No inventory items yet.');
      setToolbar(true);
      renderFromFilters();
    } catch (e) {
      console.error('Inventory load error:', e);
      setStatus('Could not load inventory. ' + (e && e.message ? e.message : ''));
      $('inv-board').innerHTML = '<div class="inv-empty">Error loading inventory.</div>';
      setToolbar(true);
    }
  }

  
  function syncStickyFilterOffset() {
    const main = $('portal-main');
    const nav = document.querySelector('#portal-main .top-nav') || document.querySelector('.top-nav');
    const bar = document.querySelector('#portal-main .mine-toolbar');
    if (!main || !bar) return;
    let top = 0;
    if (nav) {
      const mr = main.getBoundingClientRect();
      const nr = nav.getBoundingClientRect();
      top = Math.max(0, Math.min(nr.bottom, mr.bottom) - mr.top);
      if (nr.bottom <= mr.top) top = 0;
    }
    bar.style.top = Math.round(top) + 'px';
  }
  (function bindStickyFilterOffset() {
    const main = $('portal-main');
    if (!main || main.dataset.stickyFilterBound === '1') return;
    main.dataset.stickyFilterBound = '1';
    main.addEventListener('scroll', syncStickyFilterOffset, { passive: true });
    window.addEventListener('resize', syncStickyFilterOffset);
    syncStickyFilterOffset();
  })();

  auth.onAuthStateChanged(user => {
    if (!authResolved) {
      document.body.classList.remove('auth-pending');
      authResolved = true;
    }
    if (user) {
      try { sessionStorage.setItem('tmPortalAuthed', '1'); } catch (e) {}
      document.body.classList.remove('auth-pending');

      $('login-screen').style.display = 'none';
      $('portal').style.display = 'flex';
      loadPortal(user);
    } else {

      try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
      document.documentElement.classList.remove('tm-expect-auth');
      document.body.classList.remove('auth-pending');
      loadedUid = null;
      groupData = {};
      $('portal').style.display = 'none';
      $('login-screen').style.display = 'flex';
    }
  });

  $('btn-google-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-email-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    const email = $('input-email').value.trim();
    const pass = $('input-password').value;
    try { await auth.signInWithEmailAndPassword(email, pass); }
    catch (e) {
      $('login-error').textContent = (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
        ? 'Incorrect email or password.' : e.message;
    }
  });
  $('btn-reset').addEventListener('click', async () => {
    const email = $('input-email').value.trim();
    if (!email) { $('login-error').textContent = 'Enter your email first.'; return; }
    try { await auth.sendPasswordResetEmail(email); $('login-error').style.color = '#66BB6A'; $('login-error').textContent = 'Reset email sent!'; }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-signout').addEventListener('click', () => {
    try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
    document.documentElement.classList.remove('tm-expect-auth');
    auth.signOut();
  });

  (function initAccountMenu() {
    var toggle = document.getElementById('nav-account-toggle');
    var dropdown = document.getElementById('nav-account-dropdown');
    var wrap = document.querySelector('.nav-account');
    if (!toggle || !dropdown) return;
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var willOpen = dropdown.hasAttribute('hidden');
      if (willOpen) dropdown.removeAttribute('hidden');
      else dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!wrap || wrap.contains(e.target)) return;
      dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();

  $('filter-search').addEventListener('input', () => { if (loadedUid) renderFromFilters(); });

  (function bindNavPillFollowTips() {
    var DELAY = 320;
    var tipEl = null, tipTimer = null, tipTarget = null, tipX = 0, tipY = 0;
    function ensureTip() {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.className = 'toolbar-follow-tip';
        tipEl.setAttribute('role', 'tooltip');
        document.body.appendChild(tipEl);
      }
      return tipEl;
    }
    function placeTip(x, y) {
      var tip = ensureTip();
      var gap = 14, edge = 8;
      tip.style.visibility = 'hidden';
      tip.style.display = 'block';
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + gap, top = y + gap;
      if (left + w > window.innerWidth - edge) left = x - gap - w;
      if (top + h > window.innerHeight - edge) top = y - gap - h;
      if (left < edge) left = edge;
      if (top < edge) top = edge;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.visibility = 'visible';
    }
    function hideTip() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipTarget = null;
      if (tipEl) tipEl.style.display = 'none';
    }
    function bindPill(el) {
      if (!el || el.dataset.navPillTipBound === '1') return;
      el.dataset.navPillTipBound = '1';
      el.addEventListener('mouseenter', function (e) {
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
        tipTarget = el;
        tipX = e.clientX; tipY = e.clientY;
        var tip = ensureTip();
        tip.textContent = (el.getAttribute('data-tip') || '').trim();
        tip.style.display = 'none';
        tipTimer = setTimeout(function () {
          tipTimer = null;
          if (tipTarget !== el || !el.isConnected) return;
          placeTip(tipX, tipY);
        }, DELAY);
      });
      el.addEventListener('mousemove', function (e) {
        if (tipTarget !== el) return;
        tipX = e.clientX; tipY = e.clientY;
        if (tipEl && tipEl.style.display === 'block' && !tipTimer) placeTip(tipX, tipY);
      });
      el.addEventListener('mouseleave', function () {
        if (tipTarget === el) hideTip();
      });
      el.addEventListener('blur', function () {
        if (tipTarget === el) hideTip();
      });
    }
    function ready(fn) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
      else fn();
    }
    ready(function () {
      bindPill(document.querySelector('.nav-pill-usd'));
      bindPill(document.querySelector('.nav-pill-tb'));
    });
  })();

</script>
