<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraMine Redemptions</title>
<link rel="icon" type="image/png" href="/logo.png?v=2" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a07;
    --surface: #1a1208;
    --surface2: #241a0d;
    --gold: #c8922a;
    --gold-light: #f0b84a;
    --amber: #e07b20;
    --text: #f0e6d0;
    --text-muted: #8a7560;
    --green: #4caf6e;
    --red: #e05050;
    --blue: #4a9fd4;
    --border: rgba(200,146,42,0.15);
    --purple: #9b7fe8;
    --orange: #e07b20;
    --teal: #3fb8a8;
    --paypal: #0070BA;
    --tango: #F5821F;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; }

  /* Header */
  .header {
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:20px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
  }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-icon { font-size:28px; }
  .logo-text { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--gold-light); letter-spacing:-0.5px; }
  .logo-sub { font-size:10px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; margin-top:1px; }
  .header-right { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .admin-email { font-size:11px; color:var(--text-muted); }
  .nav-btn {
    background:var(--surface2);
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:6px;
    font-family:'DM Mono',monospace;
    font-size:11px;
    text-decoration:none;
    cursor:pointer;
    transition:color 0.2s,border-color 0.2s;
    display:inline-block;
  }
  .nav-btn:hover { color:var(--text); border-color:var(--gold); }
  .logout-btn { background:transparent; color:var(--text-muted); border:1px solid var(--border); padding:8px 14px; border-radius:6px; font-family:'DM Mono',monospace; font-size:11px; cursor:pointer; transition:color 0.2s,border-color 0.2s; }
  .logout-btn:hover { color:var(--red); border-color:var(--red); }

  /* Layout */
  .main { padding:32px; max-width:1500px; margin:0 auto; }

  /* Status filter tabs */
  .period-tabs { display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; }
  .period-tab {
    background:var(--surface2);
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:8px 18px;
    border-radius:20px;
    font-family:'DM Mono',monospace;
    font-size:12px;
    cursor:pointer;
    transition:all 0.15s;
  }
  .period-tab:hover { border-color:var(--gold); color:var(--text); }
  .period-tab.active { background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:500; }
  .period-tab .count { opacity:0.7; margin-left:4px; }

  /* Method filter tabs — separates PayPal from Tango within whichever
     status tab is active (added Sept 11, 2026, Scott). Same shape as
     .period-tab, but the active color matches each method's own brand
     color instead of gold, so it reads as a distinct second axis rather
     than a second status filter. */
  .method-tabs { display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; }
  .method-tab {
    background:var(--surface2);
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:6px 16px;
    border-radius:20px;
    font-family:'DM Mono',monospace;
    font-size:11px;
    cursor:pointer;
    transition:all 0.15s;
  }
  .method-tab:hover { border-color:var(--gold); color:var(--text); }
  .method-tab .count { opacity:0.7; margin-left:4px; }
  .method-tab.active { color:#fff; font-weight:500; }
  .method-tab.active[data-method="all"] { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .method-tab.active[data-method="paypal"] { background:var(--paypal); border-color:var(--paypal); }
  .method-tab.active[data-method="tango"] { background:var(--tango); border-color:var(--tango); }

  /* Search */
  .search-input {
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 14px;
    color:var(--text);
    font-family:'DM Mono',monospace;
    font-size:12px;
    outline:none;
    width:300px;
    transition:border-color 0.15s;
  }
  .search-input::placeholder { color:var(--text-muted); }
  .search-input:focus { border-color:var(--gold); }

  /* Table */
  .table-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .table-header {
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    font-family:'Syne',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--gold-light);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .table-header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .table-count { font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace; font-weight:400; white-space:nowrap; }
  /* ✅ Sept 11, 2026 — Hillary reported the right side of the table (Status
     column's action buttons especially) getting cut off on a narrower
     window. Root cause: this div already had overflow-x:auto, but the
     <table> below was pinned to width:100% — capping it at the container's
     width instead of letting it grow to its natural (wider) content width,
     so the browser had nothing to scroll to and just squeezed/clipped the
     nowrap columns instead. min-width:100% (not width:100%) lets the table
     still fill the container on wide screens but grow past it when 7
     columns of nowrap content + buttons actually need more room — that's
     what makes overflow-x:auto below actually kick in. Scrollbar styled
     explicitly (rather than relying on the OS default, which can be an
     easy-to-miss overlay/auto-hide bar) so the fact that it scrolls is
     obvious at a glance. */
  .table-scroll {
    overflow-x:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--gold) var(--surface2);
  }
  .table-scroll::-webkit-scrollbar { height:10px; }
  .table-scroll::-webkit-scrollbar-track { background:var(--surface2); }
  .table-scroll::-webkit-scrollbar-thumb { background:var(--gold); border-radius:5px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background:var(--gold-light); }
  table { min-width:100%; border-collapse:collapse; font-size:12px; }
  thead th {
    padding:10px 16px;
    text-align:left;
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    border-bottom:1px solid var(--border);
    background:var(--surface2);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th.no-sort { cursor:default; }
  thead th:hover:not(.no-sort) { color:var(--gold-light); }
  thead th.sorted { color:var(--gold); }
  tbody tr { border-bottom:1px solid rgba(200,146,42,0.06); transition:background 0.15s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:var(--surface2); }
  tbody td { padding:11px 16px; color:var(--text); vertical-align:top; white-space:nowrap; }
  .td-muted { color:var(--text-muted); }
  .td-gold { color:var(--gold-light); font-weight:500; }
  .td-green { color:var(--green); }
  .td-red { color:var(--red); }
  /* Oct 16, 2026 (Scott): referral code made much larger so it can be read at a glance. */
  .ref-code { font-size:15px; font-weight:700; color:var(--text); letter-spacing:0.8px; }
  .ref-code-row { display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap; }
  .ref-count { font-size:10px; white-space:nowrap; }
  .ref-count.rc-zero { color:var(--text-muted); opacity:0.55; }
  .ref-count.rc-low { color:var(--text-muted); }
  .ref-count.rc-mid { color:var(--amber); }
  .ref-count.rc-high { color:var(--red); font-weight:600; }
  .ref-count-copy { background:none; border:none; color:inherit; opacity:0.55; cursor:pointer; font-size:10px; padding:0; line-height:1; }
  .ref-count-copy:hover { opacity:1; }
  .copy-cell { display:flex; align-items:center; gap:6px; }
  .copy-id-btn {
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    font-size:12px;
    padding:2px 4px;
    line-height:1;
    opacity:0.7;
    transition:opacity 0.15s;
  }
  .copy-id-btn:hover { opacity:1; color:var(--gold-light); }
  .net-amount { color:var(--gold-light); font-weight:600; }
  .fee-note { color:var(--text-muted); font-size:10px; }

  .badge {
    display:inline-block;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:20px;
  }
  .badge-red { background:rgba(224,80,80,0.15); color:var(--red); }
  .badge-green { background:rgba(76,175,110,0.15); color:var(--green); }
  .badge-amber { background:rgba(224,123,32,0.15); color:var(--amber); }
  .badge-blue { background:rgba(74,159,212,0.15); color:var(--blue); }
  .badge-muted { background:rgba(138,117,96,0.1); color:var(--text-muted); }
  .badge-purple { background:rgba(155,127,232,0.15); color:var(--purple); }
  .badge-teal { background:rgba(63,184,168,0.15); color:var(--teal); }
  .badge-paypal { background:rgba(0,112,186,0.15); color:var(--paypal); }
  .badge-tango { background:rgba(245,130,31,0.15); color:var(--tango); }
  .email-hint { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .flag-note { font-size:10px; color:var(--purple); margin-top:4px; max-width:220px; white-space:normal; }
  .info-note { font-size:10px; color:var(--teal); margin-top:4px; max-width:220px; white-space:normal; }

  .action-btn {
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    padding:5px 10px;
    border-radius:6px;
    font-family:'DM Mono',monospace;
    font-size:10px;
    cursor:pointer;
    margin-right:6px;
    margin-top:4px;
    transition:all 0.15s;
  }
  .action-btn.paid { border-color:var(--green); color:var(--green); }
  .action-btn.paid:hover { background:rgba(76,175,110,0.15); }
  .action-btn.reject { border-color:var(--red); color:var(--red); }
  .action-btn.reject:hover { background:rgba(224,80,80,0.15); }
  .action-btn.info { border-color:var(--teal); color:var(--teal); }
  .action-btn.info:hover { background:rgba(63,184,168,0.15); }
  .action-btn.reopen { border-color:var(--blue); color:var(--blue); }
  .action-btn.reopen:hover { background:rgba(74,159,212,0.15); }
  .action-btn.flag { border-color:var(--purple); color:var(--purple); }
  .action-btn.flag:hover { background:rgba(155,127,232,0.15); }
  .processed-note { font-size:10px; color:var(--text-muted); margin-top:4px; max-width:220px; white-space:normal; }

  .fraud-check { margin:6px 0; }
  .fraud-check label { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); cursor:pointer; user-select:none; }
  .fraud-check input[type="checkbox"] { accent-color:var(--gold); width:13px; height:13px; cursor:pointer; }
  .fraud-check.checked label { color:var(--green); }
  .fraud-check.stale label { color:var(--amber); }
  .tbp-check { margin:6px 0; }
  .tbp-check label { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); cursor:pointer; user-select:none; }
  .tbp-check input[type="checkbox"] { accent-color:var(--gold); width:13px; height:13px; cursor:pointer; }
  .tbp-check.checked label { color:var(--green); font-weight:600; }
  .fraud-check-note { font-size:9px; color:var(--text-muted); margin-top:2px; margin-left:19px; }
  .fraud-check-note.stale-note { color:var(--amber); }

  .empty-row td { padding:32px; text-align:center; color:var(--text-muted); font-size:12px; }

  /* Login overlay */
  #loginOverlay { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; }
  .login-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:360px; text-align:center; }
  .login-icon { font-size:36px; margin-bottom:16px; }
  .login-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--gold-light); margin-bottom:4px; }
  .login-sub { font-size:11px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; margin-bottom:32px; }
  .login-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 16px; color:var(--text); font-family:'DM Mono',monospace; font-size:13px; margin-bottom:12px; outline:none; }
  .login-btn { width:100%; background:var(--gold); color:var(--bg); border:none; border-radius:8px; padding:14px; font-family:'DM Mono',monospace; font-size:13px; font-weight:500; cursor:pointer; }
  #loginError { color:var(--red); font-size:12px; margin-top:12px; display:none; }

  /* Reject-reason modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:800; display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; width:420px; }
  .modal-title { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:var(--gold-light); margin-bottom:6px; }
  .modal-sub { font-size:11px; color:var(--text-muted); margin-bottom:18px; }
  .modal-textarea { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; min-height:80px; resize:vertical; outline:none; margin-bottom:16px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
  .modal-btn { padding:10px 18px; border-radius:8px; font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text-muted); transition:all 0.15s; }
  .modal-btn:hover { color:var(--text); border-color:var(--gold); }
  .modal-btn.danger { background:var(--red); border-color:var(--red); color:#fff; }
  .modal-btn.danger:hover { opacity:0.85; }
  #modalError { color:var(--red); font-size:11px; margin-top:8px; display:none; }

  /* Toast */
  .toast { position:fixed; bottom:28px; right:28px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 20px; font-size:13px; color:var(--text); z-index:900; display:none; animation:slideUp 0.25s ease; }
  .toast.show { display:block; }
  .toast.success { border-color:var(--green); color:var(--green); }
  .toast.error { border-color:var(--red); color:var(--red); }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="logo-icon">💸</span>
    <div>
      <div class="logo-text">TerraMine</div>
      <div class="logo-sub">Redemptions</div>
    </div>
  </div>
  <div class="header-right">
    <span class="admin-email" id="adminEmail"></span>
    <a href="/admin/" class="nav-btn">⛏️ Main</a>
    <a href="/admin/admin-users.html" class="nav-btn">👥 Users</a>
    <a href="/admin/admin-properties.html" class="nav-btn">🏔 Properties</a>
    <a href="/admin/admin-finance.html" class="nav-btn">💰 Finance</a>
    <a href="/admin/admin-moderation.html" class="nav-btn">🛡 Moderation</a>
    <a href="/admin/admin-vpn-flags.html" class="nav-btn">🌐 VPN Flags</a>
    <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<div class="main">

  <div class="period-tabs" id="statusTabs">
    <button class="period-tab" data-tab="needsAttention" onclick="setTab('needsAttention', this)">Needs Attention <span class="count" id="count-needsAttention">0</span></button>
    <button class="period-tab" data-tab="needsInfo" onclick="setTab('needsInfo', this)">💬 Needs Info <span class="count" id="count-needsInfo">0</span></button>
    <button class="period-tab" data-tab="flagged" onclick="setTab('flagged', this)">🚩 Flagged <span class="count" id="count-flagged">0</span></button>
    <button class="period-tab" data-tab="paid" onclick="setTab('paid', this)">Paid <span class="count" id="count-paid">0</span></button>
    <button class="period-tab" data-tab="rejected" onclick="setTab('rejected', this)">Rejected <span class="count" id="count-rejected">0</span></button>
    <button class="period-tab" data-tab="failed" onclick="setTab('failed', this)">Failed <span class="count" id="count-failed">0</span></button>
    <button class="period-tab" data-tab="all" onclick="setTab('all', this)">All <span class="count" id="count-all">0</span></button>
  </div>

  <div class="method-tabs" id="methodTabs">
    <button class="method-tab active" data-method="all" onclick="setMethodTab('all', this)">All Methods <span class="count" id="mcount-all">0</span></button>
    <button class="method-tab" data-method="paypal" onclick="setMethodTab('paypal', this)">🅿️ PayPal <span class="count" id="mcount-paypal">0</span></button>
    <button class="method-tab" data-method="tango" onclick="setMethodTab('tango', this)">🎁 Tango <span class="count" id="mcount-tango">0</span></button>
  </div>

  <div class="table-card">
    <div class="table-header">
      <span>Redemption Requests</span>
      <div class="table-header-right">
        <button class="nav-btn" id="paypalCsvBtn" title="Download a PayPal mass-pay CSV of every PENDING PayPal request whose To Be Paid box is ticked (ignores the tab/search filters)" onclick="downloadPaypalMassPayCsv()">📥 PayPal CSV</button>
        <button class="nav-btn" id="paypalPaidBtn" style="display:none;" title="Marks every request from your last downloaded PayPal CSV as Paid. Only use after PayPal accepted the file." onclick="markCsvBatchPaid('paypal')">✅ Mark last CSV as Paid</button>
        <button class="nav-btn" id="tangoCsvBtn" style="display:none;" title="Download a Tango bulk-send CSV of every PENDING Tango request whose To Be Paid box is ticked (ignores the tab/search filters)" onclick="downloadTangoCsv()">📥 Tango CSV</button>
        <button class="nav-btn" id="tangoPaidBtn" style="display:none;" title="Marks every request from your last downloaded Tango CSV as Paid. Only use after Tango accepted the order." onclick="markCsvBatchPaid('tango')">✅ Mark last Tango CSV as Paid</button>
        <input type="text" id="searchInput" class="search-input" placeholder="Search amount, date, email, referral code, or method…" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')serverSearch()">
        <span class="table-count" id="tableCount">— requests</span>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('nickname')">Username ↕</th>
            <th onclick="sortBy('payoutMethod')">Method ↕</th>
            <th onclick="sortBy('paypalEmail')">Email ↕</th>
            <th onclick="sortBy('amountUsd')">Amount Requested ↕</th>
            <th class="no-sort">Net Payout</th>
            <th onclick="sortBy('requestedAt')">Date Requested ↕</th>
            <th class="no-sort">Status</th>
          </tr>
        </thead>
        <tbody id="reqTableBody">
          <tr class="empty-row"><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Reject-reason modal -->
<div class="modal-overlay" id="rejectModal">
  <div class="modal-card">
    <div class="modal-title">Reject Redemption</div>
    <div class="modal-sub" id="rejectModalSub">—</div>
    <textarea class="modal-textarea" id="rejectReason" placeholder="Reason (required — shown in the audit log, not to the player)"></textarea>
    <div id="modalError"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeRejectModal()">Cancel</button>
      <button class="modal-btn danger" id="confirmRejectBtn" onclick="confirmReject()">Reject &amp; Refund</button>
    </div>
  </div>
</div>

<!-- Needs-Info note modal -->
<div class="modal-overlay" id="needsInfoModal">
  <div class="modal-card">
    <div class="modal-title">Mark as Needs Info</div>
    <div class="modal-sub" id="needsInfoModalSub">—</div>
    <textarea class="modal-textarea" id="needsInfoNote" placeholder="Note (required — internal only, never shown to the player)"></textarea>
    <div id="needsInfoModalError"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeNeedsInfoModal()">Cancel</button>
      <button class="modal-btn danger" style="background:var(--teal);border-color:var(--teal);" onclick="confirmNeedsInfo()">Mark Needs Info</button>
    </div>
  </div>
</div>

<!-- Login overlay -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-icon">💸</div>
    <div class="login-title">TerraMine Redemptions</div>
    <div class="login-sub">Admin access required</div>
    <input id="loginEmail" type="email" class="login-input" placeholder="Email" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <input id="loginPass" type="password" class="login-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div id="loginError"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import {
    getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, orderBy, where, limit, documentId, getCountFromServer
  } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

  const firebaseConfig = {
    apiKey: "AIzaSyC9jTXIb-HR9qvYueh8cBIs5EFenNPkX4Y",
    authDomain: "terramine-5cda5.firebaseapp.com",
    projectId: "terramine-5cda5",
    storageBucket: "terramine-5cda5.firebasestorage.app",
    messagingSenderId: "183143680304",
    appId: "1:183143680304:web:16bcd69f0c33d690e8e0f5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const functions = getFunctions(app);
  const adminUpdateWithdrawalStatus = httpsCallable(functions, 'adminUpdateWithdrawalStatus');

  // ── State ──────────────────────────────────────────────────────────────
  let allRequests = [];       // every withdrawalRequests doc, joined with nickname + referralCode
  let currentTab = 'needsAttention';
  let currentMethod = 'all';  // 'all' | 'paypal' | 'tango' — added Sept 11, 2026, second filter
                               // axis alongside currentTab, so PayPal and Tango requests can be
                               // viewed separately within whatever status tab is active.
  let sortKey = 'requestedAt';
  let sortDir = -1;           // newest first by default
  let searchQuery = '';       // lowercased, matched against amount/date/email/referralCode
  const nicknameCache = new Map();     // userId -> nickname, avoids refetching for repeat requesters
  const referralCodeCache = new Map(); // userId -> referralCode, fetched alongside nickname (same doc read)
  // Oct 16, 2026 (Scott): users.referralCount only goes up when a referral's reward is processed, so it
  // under-counts (TM-GGKK8 showed 36, but 55 people had signed up with the code). This is the TOTAL who
  // signed up with the requester's code: count of users whose referredByCode == their referralCode.
  // One cheap aggregate read per requester with an OPEN request; cached for the session.
  const referralSignupCache = new Map(); // userId -> total signed up under their code (or null if unknown)
  const referralCountCache = new Map(); // userId -> referralCount, fetched alongside nickname (same doc read,
                                         // zero extra Firestore cost) — added Sept 9, 2026 so a redemption's
                                         // referral count is visible at a glance without running
                                         // checkReferralFraud.ts on every single request. 0-4 referrals is
                                         // rendered muted (almost certainly fine to check off without digging
                                         // further); higher counts escalate to amber/red as a "this one's
                                         // worth actually running the script on" visual cue. These thresholds
                                         // are just a scanning aid, not a fraud verdict — see
                                         // checkReferralFraud.ts for the real triage logic.

  // Account-level fraud-check memory — added Sept 12, 2026 (Scott: "so we
  // don't keep checking the same accounts flagged as safe"). Previously
  // fraudChecked/fraudCheckedAt/fraudCheckedBy lived ONLY on the
  // withdrawalRequests doc, so every new redemption from a repeat
  // requester started unchecked again even if that account was already
  // vetted clean last time. Now toggleFraudCheck() also stamps
  // users/{userId} with the same fields plus a referralCount snapshot at
  // check time, and a new request from an already-vetted account inherits
  // that state automatically — UNLESS referralCount has grown a lot since
  // (see FRAUD_RECHECK_REFERRAL_GROWTH below), since an account that looked
  // clean at 5 referrals isn't the same account at 40. Fetched alongside
  // nickname/referralCode/referralCount below — same doc read, zero extra
  // Firestore cost.
  const accountFraudCheckedAtCache = new Map();
  const accountFraudCheckedByCache = new Map();
  const accountFraudCheckedRefCountCache = new Map();
  // If referralCount has grown by at least this much since the account was
  // last cleared, treat the old clearance as stale rather than silently
  // trusting it — surfaced as an amber "recommend re-checking" note instead
  // of a blind green checkmark.
  const FRAUD_RECHECK_REFERRAL_GROWTH = 5;
  // ✅ Oct 5, 2026 (Scott: "make the referral fraud check sustain for 30
  // days"): an account-level clearance carries over to that account's new
  // redemptions for this many days, then asks for a fresh check.
  const FRAUD_CHECK_VALID_DAYS = 30;

  // ── Auth ───────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      document.getElementById('adminEmail').textContent = user.email;
      loadAll();
    } else {
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('adminEmail').textContent = '';
    }
  });

  window.doLogout = async () => {
    await signOut(auth);
    location.reload();
  };

  window.doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      errEl.textContent = 'Sign-in failed. Check email and password.';
      errEl.style.display = 'block';
    }
  };

  // ── Load ───────────────────────────────────────────────────────────────
  // ✅ Oct 21, 2026 (Scott: redemptions page takes a long time to load).
  // Old behavior: every load downloaded EVERY withdrawalRequests doc ever
  // (paid/rejected/failed included), did one getDoc per distinct requester,
  // and every action (approve/reject/flag...) ran that whole thing again.
  // New behavior:
  //   1. Load only what needs action (pending / approved_unpaid / needs_info
  //      plus anything flagged) — small and bounded by the open queue.
  //   2. Paid / Rejected / Failed / All load on demand when that tab is
  //      opened, newest HISTORY_LIMIT only.
  //   3. Tab counts come from server-side count aggregates, not downloaded docs.
  //   4. Requester info is fetched in batches of 30 users per query, in
  //      parallel; the table paints first, then fills in. Failed lookups are
  //      still retried once and never cached (Oct 17 behavior preserved).
  const HISTORY_LIMIT = 100;
  const ALL_TAB_LIMIT = 200;
  const HISTORY_TABS = ['paid', 'rejected', 'failed', 'all'];
  const rawActive = new Map();     // id -> raw doc: open queue + flagged
  const rawHistory = new Map();    // id -> raw doc: history tabs loaded so far
  const rawSearchHits = new Map(); // id -> raw doc: server-side email search hits
  const lookupFailedIds = new Set();
  let enrichPromise = Promise.resolve();
  let loadSeq = 0;
  const toRaw = (d) => ({ id: d.id, ...d.data() });

  function cacheUser(uid, udata) {
    nicknameCache.set(uid, (udata && udata.nickname) || uid.substring(0, 8));
    referralCodeCache.set(uid, (udata && udata.referralCode) || null);
    referralCountCache.set(uid, (udata && udata.referralCount) || 0);
    accountFraudCheckedAtCache.set(uid, (udata && udata.referralFraudCheckedAt) || null);
    accountFraudCheckedByCache.set(uid, (udata && udata.referralFraudCheckedBy) || null);
    accountFraudCheckedRefCountCache.set(uid, (udata && udata.referralFraudCheckedAtReferralCount) ?? null);
  }

  // Batched user lookup: documentId() 'in' takes up to 30 ids per query
  // (admin may list users — see firestore.rules). A failed batch is retried
  // once; if it still fails the users are NOT cached and are marked failed so
  // rows show the warning instead of a fake "0 referrals".
  async function enrichUsers(rawList) {
    const need = [...new Set(rawList.map(r => r.userId).filter(Boolean))].filter(u => !nicknameCache.has(u));
    const chunks = [];
    for (let i = 0; i < need.length; i += 30) chunks.push(need.slice(i, i + 30));
    await Promise.all(chunks.map(async (chunk) => {
      const run = () => getDocs(query(collection(db, 'users'), where(documentId(), 'in', chunk)));
      try {
        let snap;
        try { snap = await run(); }
        catch (firstErr) { await new Promise(res => setTimeout(res, 400)); snap = await run(); }
        const seen = new Set();
        snap.forEach(sn => { cacheUser(sn.id, sn.data()); seen.add(sn.id); lookupFailedIds.delete(sn.id); });
        chunk.forEach(u => { if (!seen.has(u)) { cacheUser(u, null); lookupFailedIds.delete(u); } });
      } catch (e) {
        console.warn('user lookup batch failed', e);
        chunk.forEach(u => lookupFailedIds.add(u));
      }
    }));

    // Total sign-ups under each OPEN requester's code (aggregate count queries, in parallel).
    const openUserIds = [...new Set(rawList.filter(r => r.status === 'pending' || r.status === 'approved_unpaid').map(r => r.userId).filter(Boolean))];
    await Promise.all(openUserIds.map(async (uid) => {
      if (referralSignupCache.has(uid)) return;
      const code = referralCodeCache.get(uid);
      if (!code) { if (nicknameCache.has(uid)) referralSignupCache.set(uid, null); return; }
      try {
        const c = await getCountFromServer(query(collection(db, 'users'), where('referredByCode', '==', code)));
        referralSignupCache.set(uid, c.data().count);
      } catch (e) {
        console.warn('signup count failed for', uid, e);
        referralSignupCache.set(uid, null);
      }
    }));
  }

  function joinRaw(r) {
    return {
      ...r,
      referralSignups: referralSignupCache.get(r.userId) ?? null,
      lookupFailed: lookupFailedIds.has(r.userId) || !nicknameCache.has(r.userId),
      nickname: nicknameCache.get(r.userId) || (r.userId ? r.userId.substring(0, 8) : '—'),
      referralCode: referralCodeCache.get(r.userId) || null,
      referralCount: referralCountCache.get(r.userId) ?? 0,
      accountFraudCheckedAt: accountFraudCheckedAtCache.get(r.userId) || null,
      accountFraudCheckedBy: accountFraudCheckedByCache.get(r.userId) || null,
      accountFraudCheckedAtReferralCount: accountFraudCheckedRefCountCache.get(r.userId) ?? null,
      // Older requests predate the Sept 4, 2026 Tango rollout and have no
      // payoutMethod field at all — same default the Cloud Function itself
      // uses when the field is omitted, so a pre-Tango request is treated
      // as PayPal here too, not as an "unknown" third bucket.
      payoutMethod: r.payoutMethod || 'paypal',
    };
  }

  // Rebuild the working list from whatever has been loaded so far. Active
  // docs win over stale history copies of the same id.
  function rebuildAll() {
    const merged = new Map([...rawHistory, ...rawSearchHits, ...rawActive]);
    allRequests = [...merged.values()].map(joinRaw);
  }

  async function fetchActive() {
    const col = collection(db, 'withdrawalRequests');
    const [open, flagged] = await Promise.all([
      getDocs(query(col, where('status', 'in', ['pending', 'approved_unpaid', 'needs_info']))),
      getDocs(query(col, where('flaggedForReview', '==', true))),
    ]);
    rawActive.clear();
    open.docs.forEach(d => rawActive.set(d.id, toRaw(d)));
    flagged.docs.forEach(d => rawActive.set(d.id, toRaw(d)));
  }

  async function fetchHistory(tab) {
    const col = collection(db, 'withdrawalRequests');
    let snap;
    if (tab === 'all') {
      snap = await getDocs(query(col, orderBy('requestedAt', 'desc'), limit(ALL_TAB_LIMIT)));
    } else {
      try {
        snap = await getDocs(query(col, where('status', '==', tab), orderBy('requestedAt', 'desc'), limit(HISTORY_LIMIT)));
      } catch (e) {
        // Needs a composite index (status ASC, requestedAt DESC). Until it is
        // created, fall back to the unordered (slower) per-status fetch so the
        // tab still works. The console error carries a one-click create link.
        console.warn('History query needs composite index (status, requestedAt) — falling back:', e);
        snap = await getDocs(query(col, where('status', '==', tab)));
      }
    }
    snap.docs.forEach(d => rawHistory.set(d.id, toRaw(d)));
  }

  async function refreshCounts() {
    const col = collection(db, 'withdrawalRequests');
    const count = (q) => getCountFromServer(q).then(s => s.data().count).catch(() => null);
    const set = (id, v) => { if (v !== null) document.getElementById(id).textContent = v; };
    const [na, ni, fl, pd, rj, fd, all] = await Promise.all([
      count(query(col, where('status', 'in', ['pending', 'approved_unpaid']))),
      count(query(col, where('status', '==', 'needs_info'))),
      count(query(col, where('flaggedForReview', '==', true))),
      count(query(col, where('status', '==', 'paid'))),
      count(query(col, where('status', '==', 'rejected'))),
      count(query(col, where('status', '==', 'failed'))),
      count(col),
    ]);
    set('count-needsAttention', na); set('count-needsInfo', ni); set('count-flagged', fl);
    set('count-paid', pd); set('count-rejected', rj); set('count-failed', fd); set('count-all', all);
  }

  async function loadAll() {
    const seq = ++loadSeq;
    if (!allRequests.length) {
      document.getElementById('reqTableBody').innerHTML = '<tr class="empty-row"><td colspan="7">Loading…</td></tr>';
    }
    refreshCounts(); // fire and forget — fills the tab badges as they arrive

    await fetchActive();
    if (HISTORY_TABS.includes(currentTab)) await fetchHistory(currentTab);
    if (seq !== loadSeq) return; // a newer load superseded this one

    // Paint immediately with whatever user info is already cached…
    rebuildAll();
    render();
    refreshPaypalPaidBtn();

    // …then fill in nicknames / referral info in batches and repaint.
    const loaded = [...rawActive.values(), ...rawHistory.values(), ...rawSearchHits.values()];
    enrichPromise = enrichUsers(loaded).then(() => {
      if (seq !== loadSeq) return;
      rebuildAll();
      render();
      refreshPaypalPaidBtn();
    });
    await enrichPromise;
  }

  window.setTab = async (tab, btnEl) => {
    currentTab = tab;
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    render();
    // History tabs (Paid / Rejected / Failed / All) load on demand, fresh
    // each time the tab is opened, newest-first and capped.
    if (HISTORY_TABS.includes(tab)) {
      document.getElementById('tableCount').textContent = 'Loading…';
      try {
        await fetchHistory(tab);
        rebuildAll();
        render();
        await enrichUsers([...rawHistory.values()]);
        if (currentTab === tab) { rebuildAll(); render(); }
      } catch (e) {
        console.error('History load failed', e);
        showToast('Could not load ' + tab + ' requests: ' + (e.message || e), 'error');
      }
    }
  };

  // Method tab — orthogonal to the status tab above. Switching status tabs
  // does NOT reset this, so "Needs Attention" + "Tango" stays selected while
  // paging through statuses, matching how an admin actually works a batch
  // (pick your payout method for the morning, then work every status within it).
  window.setMethodTab = (method, btnEl) => {
    currentMethod = method;
    document.querySelectorAll('.method-tab').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    render();
    updateCsvButtons();
  };

  // ── Search ─────────────────────────────────────────────────────────────
  window.onSearchInput = () => {
    searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render();
  };

  // Enter in the search box with an email address also searches ALL history
  // server-side by PayPal email (exact match, as typed and lowercased) — the
  // normal search only covers requests already loaded. Fast way to see every
  // request sharing one PayPal address.
  window.serverSearch = async () => {
    const raw = document.getElementById('searchInput').value.trim();
    if (!raw.includes('@')) return;
    const col = collection(db, 'withdrawalRequests');
    const variants = [...new Set([raw, raw.toLowerCase()])];
    const snaps = await Promise.all(variants.map(v => getDocs(query(col, where('paypalEmail', '==', v)))));
    snaps.forEach(sn => sn.docs.forEach(d => rawSearchHits.set(d.id, toRaw(d))));
    rebuildAll();
    await enrichUsers([...rawSearchHits.values()]);
    rebuildAll();
    const allBtn = document.querySelector('.period-tab[data-tab="all"]');
    if (allBtn) { currentTab = 'all'; document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active')); allBtn.classList.add('active'); }
    render();
  };

  function applySearch(list) {
    if (!searchQuery) return list;
    return list.filter(r => {
      const amountUsd = typeof r.amountUsd === 'number' ? r.amountUsd.toFixed(2) : '';
      const netAmountUsd = typeof r.netAmountUsd === 'number' ? r.netAmountUsd.toFixed(2) : amountUsd;
      const dateOnly = r.requestedAt ? new Date(r.requestedAt).toLocaleDateString().toLowerCase() : '';
      const email = (r.paypalEmail || '').toLowerCase();
      const refCode = (r.referralCode || '').toLowerCase();
      const method = (r.payoutMethod || 'paypal').toLowerCase();
      return amountUsd.includes(searchQuery)
        || netAmountUsd.includes(searchQuery)
        || dateOnly.includes(searchQuery)
        || email.includes(searchQuery)
        || refCode.includes(searchQuery)
        || method.includes(searchQuery);
    });
  }

  // ── Sort ───────────────────────────────────────────────────────────────
  window.sortBy = (key) => {
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = key === 'requestedAt' ? -1 : 1; }
    render();
  };

  function filteredForTab() {
    if (currentTab === 'all') return allRequests;
    if (currentTab === 'needsAttention') return allRequests.filter(r => r.status === 'pending' || r.status === 'approved_unpaid');
    if (currentTab === 'needsInfo') return allRequests.filter(r => r.status === 'needs_info');
    if (currentTab === 'flagged') return allRequests.filter(r => r.flaggedForReview);
    return allRequests.filter(r => r.status === currentTab);
  }

  function filteredForMethod(list) {
    if (currentMethod === 'all') return list;
    return list.filter(r => r.payoutMethod === currentMethod);
  }

  // Method-tab counts are scoped to the CURRENT status tab (unlike the status
  // tabs' own counts, which always reflect the full set) — so switching to
  // "Paid" shows how many of the paid requests were PayPal vs. Tango, and
  // switching back to "Needs Attention" updates the same three numbers to
  // reflect what's actually outstanding right now.
  function updateMethodCounts(statusFiltered) {
    document.getElementById('mcount-all').textContent = statusFiltered.length;
    document.getElementById('mcount-paypal').textContent = statusFiltered.filter(r => r.payoutMethod === 'paypal').length;
    document.getElementById('mcount-tango').textContent = statusFiltered.filter(r => r.payoutMethod === 'tango').length;
  }

  function render() {
    const statusFiltered = filteredForTab();
    updateMethodCounts(statusFiltered);
    const filtered = applySearch(filteredForMethod(statusFiltered));
    const sorted = [...filtered].sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'requestedAt') {
        av = av ? new Date(av).getTime() : 0;
        bv = bv ? new Date(bv).getTime() : 0;
      }
      av = av ?? 0; bv = bv ?? 0;
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });

    document.getElementById('tableCount').textContent = sorted.length + ' request' + (sorted.length === 1 ? '' : 's');
    document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));

    const body = document.getElementById('reqTableBody');
    if (!sorted.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="7">No requests in this view.</td></tr>';
      return;
    }

    body.innerHTML = sorted.map(r => {
      const amountUsd = typeof r.amountUsd === 'number' ? r.amountUsd : 0;
      const netAmountUsd = typeof r.netAmountUsd === 'number' ? r.netAmountUsd : amountUsd;
      const feePct = typeof r.tierFeePercent === 'number' ? r.tierFeePercent : 0;
      const dateStr = r.requestedAt ? new Date(r.requestedAt).toLocaleString() : '—';

      const isTango = r.payoutMethod === 'tango';

      return `
        <tr>
          <td class="td-gold">
            ${escHtml(r.nickname)}
            ${renderReferralCodeRow(r)}
          </td>
          <td>${methodBadge(r.payoutMethod)}</td>
          <td>
            <div class="copy-cell">
              <span>${escHtml(r.paypalEmail || '—')}</span>
              ${r.paypalEmail ? `<button class="copy-id-btn" title="Copy email" onclick="copyToClipboard('${escAttr(r.paypalEmail)}', this)">📋</button>` : ''}
            </div>
            <div class="email-hint">${isTango ? 'Tango claim-link recipient' : 'PayPal account email'}</div>
          </td>
          <td>$${amountUsd.toFixed(2)}</td>
          <td>
            <div class="copy-cell">
              <span class="net-amount">$${netAmountUsd.toFixed(2)}</span>
              <button class="copy-id-btn" title="Copy net payout amount for ${isTango ? 'Tango' : 'PayPal'}" onclick="copyToClipboard('${netAmountUsd.toFixed(2)}', this)">📋</button>
            </div>
            ${feePct > 0 ? `<div class="fee-note">${feePct}% fee applied</div>` : ''}
          </td>
          <td class="td-muted">${dateStr}</td>
          <td>${renderStatusCell(r)}</td>
        </tr>
      `;
    }).join('');
  }

  // Referral-count quick-scan badge, added Sept 9, 2026. Thresholds are a
  // visual scanning aid only — "how likely is it worth running
  // checkReferralFraud.ts on this one" — not a fraud verdict.
  function referralCountLevel(count) {
    if (!count) return 'rc-zero';
    if (count < 5) return 'rc-low';
    if (count < 20) return 'rc-mid';
    return 'rc-high';
  }
  function referralCountLabel(count) {
    if (!count) return '0 referrals';
    return `👥 ${count} referral${count === 1 ? '' : 's'}`;
  }
  function renderReferralCodeRow(r) {
    if (r.lookupFailed) {
      return `<div class="ref-code-row"><span class="ref-count rc-high" title="The user record could not be read, so nickname, referral code and referral count are unknown. Reload the page; do not treat this as 0 referrals.">⚠️ lookup failed — reload</span></div>`;
    }
    const count = r.referralCount || 0;
    const signups = (typeof r.referralSignups === 'number') ? r.referralSignups : null;
    const signupBadge = signups === null ? '' :
      ` <span class="ref-count ${referralCountLevel(signups)}" title="Total users who signed up with this code (users.referredByCode). The first number only counts referrals whose reward was processed.">· ${signups} signed up</span>`;
    return `
      <div class="ref-code-row">
        ${r.referralCode ? `<span class="ref-code">${escHtml(r.referralCode)}</span>` : ''}
        <span class="ref-count ${referralCountLevel(Math.max(count, signups || 0))}">${referralCountLabel(count)}</span>${signupBadge}
        ${r.referralCode ? `<button class="ref-count-copy" title="Copy referral code for checkReferralFraud.ts" onclick="copyToClipboard('${escAttr(r.referralCode)}', this)">📋</button>` : ''}
      </div>`;
  }

  // Computes the effective fraud-check display state for a request, folding
  // in account-level memory — see the "✅ Sept 12, 2026" comment above
  // renderStatusCell's fraudCheck block for the three cases this covers.
  function fraudCheckState(r) {
    if (r.fraudChecked) {
      return {
        checked: true,
        cssClass: ' checked',
        label: '✅ Referral fraud checked',
        note: r.fraudCheckedAt ? `${escHtml(r.fraudCheckedBy || '—')} — ${new Date(r.fraudCheckedAt).toLocaleString()}` : '',
        noteClass: '',
      };
    }

    if (r.accountFraudCheckedAt) {
      const checkedAtCount = r.accountFraudCheckedAtReferralCount ?? 0;
      const currentCount = r.referralCount || 0;
      const grown = currentCount - checkedAtCount;
      const stale = grown >= FRAUD_RECHECK_REFERRAL_GROWTH;
      const ageDays = (Date.now() - new Date(r.accountFraudCheckedAt).getTime()) / 86400000;
      const expired = !(ageDays <= FRAUD_CHECK_VALID_DAYS); // also true if the date is unreadable

      if (expired) {
        return {
          checked: false,
          cssClass: ' stale',
          label: 'Referral fraud checked?',
          note: `⏰ Last checked ${Math.floor(ageDays)} days ago by ${escHtml(r.accountFraudCheckedBy || '—')} ` +
                `(${new Date(r.accountFraudCheckedAt).toLocaleDateString()}), over ${FRAUD_CHECK_VALID_DAYS} days — re-check`,
          noteClass: ' stale-note',
        };
      }

      if (!stale) {
        return {
          checked: true,
          cssClass: ' checked',
          label: '✅ Referral fraud checked',
          note: `Carried over — ${escHtml(r.accountFraudCheckedBy || '—')} verified this account ` +
                `${new Date(r.accountFraudCheckedAt).toLocaleString()} at ${checkedAtCount} referrals ` +
                `(good for ${Math.max(0, Math.ceil(FRAUD_CHECK_VALID_DAYS - ageDays))} more days)`,
          noteClass: '',
        };
      }

      return {
        checked: false,
        cssClass: ' stale',
        label: 'Referral fraud checked?',
        note: `⚠️ Checked previously at ${checkedAtCount} referrals (by ${escHtml(r.accountFraudCheckedBy || '—')}) — ` +
              `now at ${currentCount}, recommend re-checking`,
        noteClass: ' stale-note',
      };
    }

    return { checked: false, cssClass: '', label: 'Referral fraud checked?', note: '', noteClass: '' };
  }

  function renderStatusCell(r) {
    const badge = statusBadge(r.status);
    const flagBadge = r.flaggedForReview ? `<span class="badge badge-purple" title="${escAttr(r.flagReason || '')}">🚩 FLAGGED</span>` : '';
    let actions = '';
    let note = '';

    // Fraud-check checkbox — a manual "I looked at this requester's referral
    // history before paying" flag (Sept 9, 2026, Scott). Independent of
    // status: doesn't move money or affect adminUpdateWithdrawalStatus's own
    // validation, it's purely a personal review record so a held/pending
    // request shows whether it's already been vetted. Written directly to
    // Firestore (isAdmin() already grants update on this collection) rather
    // than through the Cloud Function, since nothing here needs server-side
    // validation.
    //
    // ✅ Sept 12, 2026: now also checks account-level memory (see
    // accountFraudCheckedAtCache above) so a repeat requester whose account
    // was already vetted clean doesn't show up unchecked again. Three
    // states: (1) this exact request was explicitly checked — green, as
    // before; (2) not explicitly checked, but the account has a clean prior
    // check and referralCount hasn't grown much since — green, "carried
    // over" note; (3) the account has a prior check but referralCount grew
    // by FRAUD_RECHECK_REFERRAL_GROWTH+ since — amber "stale" warning
    // instead of a blind checkmark, since this isn't really the same
    // account risk profile anymore.
    const fc = fraudCheckState(r);
    const fraudCheck = `
      <div class="fraud-check${fc.cssClass}">
        <label>
          <input type="checkbox" ${fc.checked ? 'checked' : ''} onchange="toggleFraudCheck('${r.id}', this.checked)">
          ${fc.label}
        </label>
        ${fc.note ? `<div class="fraud-check-note${fc.noteClass}">${fc.note}</div>` : ''}
      </div>`;

    // "To Be Paid" checkbox — added Oct 17, 2026 (Scott). This, not the
    // referral fraud check, decides which pending PayPal requests go into the
    // mass-pay CSV. Per-request only (no account-level carry-over).
    const tbpCheck = `
      <div class="tbp-check${r.toBePaid ? ' checked' : ''}">
        <label>
          <input type="checkbox" ${r.toBePaid ? 'checked' : ''} onchange="toggleToBePaid('${r.id}', this.checked)">
          💵 To Be Paid
        </label>
        ${r.toBePaid && r.toBePaidAt ? `<div class="fraud-check-note">${escHtml(r.toBePaidBy || '—')} — ${new Date(r.toBePaidAt).toLocaleString()}</div>` : ''}
      </div>`;

    // Flag toggle — for the "looks fake but not enough evidence to ban"
    // case (Sept 9, 2026, Scott/ossmedia-TM-MCGZ2): approve the redemption
    // but mark the account for a closer look next time. Independent of
    // status like the fraud-check box above, same direct-Firestore-write
    // pattern (isAdmin() already grants update on this collection).
    const flagToggle = `
      <button class="action-btn flag" onclick="toggleFlag('${r.id}','${escAttr(r.nickname)}', ${r.flaggedForReview ? 'true' : 'false'})">
        ${r.flaggedForReview ? 'Unflag' : '🚩 Flag'}
      </button>`;

    if (r.flaggedForReview) {
      const flaggedAtStr = r.flaggedAt ? new Date(r.flaggedAt).toLocaleString() : '';
      note += `<div class="flag-note">${escHtml(r.flagReason || 'Flagged for review')}${flaggedAtStr ? ' — ' + escHtml(flaggedAtStr) : ''}</div>`;
    }

    if (r.status === 'pending') {
      actions = `
        <div>
          <button class="action-btn paid" onclick="approveAndPay('${r.id}','${escAttr(r.nickname)}')">Paid</button>
          <button class="action-btn info" onclick="openNeedsInfoModal('${r.id}','${escAttr(r.nickname)}')">Needs Info</button>
          <button class="action-btn reject" onclick="openRejectModal('${r.id}','${escAttr(r.nickname)}')">Reject</button>
        </div>`;
    } else if (r.status === 'approved_unpaid') {
      actions = `
        <div>
          <button class="action-btn paid" onclick="markPaid('${r.id}','${escAttr(r.nickname)}')">Mark Paid</button>
          <button class="action-btn info" onclick="openNeedsInfoModal('${r.id}','${escAttr(r.nickname)}')">Needs Info</button>
          <button class="action-btn reject" onclick="openRejectModal('${r.id}','${escAttr(r.nickname)}')">Reject</button>
        </div>`;
      note += `<div class="processed-note">Reviewed — pay via ${r.payoutMethod === 'tango' ? 'Tango' : 'PayPal'}, then Mark Paid</div>`;
    } else if (r.status === 'needs_info') {
      actions = `
        <div>
          <button class="action-btn reopen" onclick="reopenRequest('${r.id}','${escAttr(r.nickname)}')">Reopen</button>
          <button class="action-btn reject" onclick="openRejectModal('${r.id}','${escAttr(r.nickname)}')">Reject</button>
        </div>`;
      const infoAtStr = r.infoRequestedAt ? new Date(r.infoRequestedAt).toLocaleString() : '';
      note += `<div class="info-note">Internal note: ${escHtml(r.infoRequestNote || '—')}${infoAtStr ? ' — ' + escHtml(infoAtStr) : ''}</div>`;
    } else if (r.status === 'rejected' && r.rejectionReason) {
      note += `<div class="processed-note">Reason: ${escHtml(r.rejectionReason)}</div>`;
    } else if (r.status === 'failed' && r.rejectionReason) {
      note += `<div class="processed-note">${escHtml(r.rejectionReason)}</div>`;
    }

    return `${badge}${flagBadge ? ' ' + flagBadge : ''}${fraudCheck}${tbpCheck}<div>${flagToggle}</div>${actions}${note}`;
  }

  // Payout-method badge — added Sept 11, 2026, alongside the method tabs, so
  // the method is visible even in the "All Methods" view, not just usable as
  // a filter. Missing/unrecognized values fall back to PayPal, matching the
  // Cloud Function's own default when payoutMethod is omitted.
  function methodBadge(method) {
    if (method === 'tango') return `<span class="badge badge-tango">🎁 TANGO</span>`;
    return `<span class="badge badge-paypal">🅿️ PAYPAL</span>`;
  }

  function statusBadge(status) {
    const map = {
      pending: ['badge-amber', 'PENDING'],
      approved_unpaid: ['badge-blue', 'APPROVED · UNPAID'],
      needs_info: ['badge-teal', 'NEEDS INFO'],
      paid: ['badge-green', 'PAID'],
      rejected: ['badge-red', 'REJECTED'],
      failed: ['badge-red', 'FAILED'],
    };
    const [cls, label] = map[status] || ['badge-muted', (status || 'UNKNOWN').toUpperCase()];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  // ── Actions ────────────────────────────────────────────────────────────
  // Paid (from 'pending'): does the same re-validation "Approve" used to do
  // (amount, PayPal email, account status, $200/30-day cap, 24h cooldown),
  // then immediately marks paid — one click instead of two, since in
  // practice both happen in the same sitting during the morning batch.
  window.approveAndPay = async (requestId, nickname) => {
    const req = allRequests.find(r => r.id === requestId);
    const methodLabel = req?.payoutMethod === 'tango' ? 'Tango gift card' : 'PayPal';
    if (!confirm(`Mark ${nickname}'s redemption as PAID?\n\nThis re-checks the amount, email, account status, $200/30-day cap, and 24h cooldown, then marks it paid in one step. Only do this AFTER you've actually sent the ${methodLabel} payout — if anything's off, it'll tell you why instead of marking paid.`)) return;

    try {
      await adminUpdateWithdrawalStatus({ requestId, newStatus: 'approved_unpaid' });
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to approve request', 'error');
      await loadAll();
      return;
    }

    try {
      await adminUpdateWithdrawalStatus({ requestId, newStatus: 'paid' });
      showToast(`Marked ${nickname}'s redemption as paid`, 'success');
    } catch (e) {
      console.error(e);
      showToast(`Approved, but marking paid failed — use "Mark Paid" below to finish. (${e?.message || 'unknown error'})`, 'error');
    }
    await loadAll();
  };

  // Mark Paid (from 'approved_unpaid'): unchanged — still needed for any
  // request already sitting in the approved-but-unpaid state (e.g. a prior
  // approval, or the fallback above if the second step failed).
  window.markPaid = async (requestId, nickname) => {
    const req = allRequests.find(r => r.id === requestId);
    const methodLabel = req?.payoutMethod === 'tango' ? 'Tango gift card' : 'PayPal';
    if (!confirm(`Mark ${nickname}'s redemption as PAID?\n\nOnly do this after you've actually sent the ${methodLabel} payout.`)) return;
    try {
      await adminUpdateWithdrawalStatus({ requestId, newStatus: 'paid' });
      showToast(`Marked ${nickname}'s redemption as paid`, 'success');
      await loadAll();
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to update status', 'error');
    }
  };

  let pendingRejectId = null;
  window.openRejectModal = (requestId, nickname) => {
    pendingRejectId = requestId;
    document.getElementById('rejectModalSub').textContent = `${nickname} — this refunds the request amount back to their USD earnings.`;
    document.getElementById('rejectReason').value = '';
    document.getElementById('modalError').style.display = 'none';
    document.getElementById('rejectModal').classList.add('open');
  };
  window.closeRejectModal = () => {
    document.getElementById('rejectModal').classList.remove('open');
    pendingRejectId = null;
  };
  window.confirmReject = async () => {
    const reason = document.getElementById('rejectReason').value.trim();
    const errEl = document.getElementById('modalError');
    if (!reason) {
      errEl.textContent = 'A reason is required.';
      errEl.style.display = 'block';
      return;
    }
    try {
      await adminUpdateWithdrawalStatus({ requestId: pendingRejectId, newStatus: 'rejected', reason });
      closeRejectModal();
      showToast('Request rejected and refunded', 'success');
      await loadAll();
    } catch (e) {
      console.error(e);
      errEl.textContent = e?.message || 'Failed to reject request';
      errEl.style.display = 'block';
    }
  };

  // Needs Info: parks a request (from 'pending' or 'approved_unpaid') pending
  // something further from the player. No money moves. The note is internal
  // only — shown in the admin table, never surfaced to the player.
  let pendingNeedsInfoId = null;
  window.openNeedsInfoModal = (requestId, nickname) => {
    pendingNeedsInfoId = requestId;
    document.getElementById('needsInfoModalSub').textContent = `${nickname} — this note is internal only and won't be shown to the player.`;
    document.getElementById('needsInfoNote').value = '';
    document.getElementById('needsInfoModalError').style.display = 'none';
    document.getElementById('needsInfoModal').classList.add('open');
  };
  window.closeNeedsInfoModal = () => {
    document.getElementById('needsInfoModal').classList.remove('open');
    pendingNeedsInfoId = null;
  };
  window.confirmNeedsInfo = async () => {
    const reason = document.getElementById('needsInfoNote').value.trim();
    const errEl = document.getElementById('needsInfoModalError');
    if (!reason) {
      errEl.textContent = 'A note is required.';
      errEl.style.display = 'block';
      return;
    }
    try {
      await adminUpdateWithdrawalStatus({ requestId: pendingNeedsInfoId, newStatus: 'needs_info', reason });
      closeNeedsInfoModal();
      showToast('Marked as needing more info', 'success');
      await loadAll();
    } catch (e) {
      console.error(e);
      errEl.textContent = e?.message || 'Failed to update status';
      errEl.style.display = 'block';
    }
  };

  // Reopen: the only way back from 'needs_info' to 'pending', once whatever
  // was needed from the player has come in.
  window.reopenRequest = async (requestId, nickname) => {
    if (!confirm(`Reopen ${nickname}'s request back to Pending?`)) return;
    try {
      await adminUpdateWithdrawalStatus({ requestId, newStatus: 'pending' });
      showToast(`Reopened ${nickname}'s request`, 'success');
      await loadAll();
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to reopen request', 'error');
    }
  };

  // Fraud-check toggle: writes straight to Firestore (isAdmin() already
  // grants update on withdrawalRequests AND users — see firestore.rules),
  // records who checked it and when. Updates local state + re-renders
  // instead of a full loadAll() so the table doesn't flicker/reset scroll
  // on every click.
  //
  // ✅ Sept 12, 2026: also stamps users/{userId} with the same fields plus
  // a referralCount snapshot, so the NEXT redemption from this account
  // inherits the clean check instead of starting unchecked again (see
  // fraudCheckState() above). Unchecking clears the account-level memory
  // too — an admin unchecking means they no longer trust this account as
  // clean, so a future request shouldn't silently inherit a clearance the
  // admin themselves just revoked.
  window.toggleFraudCheck = async (requestId, checked) => {
    const nowIso = new Date().toISOString();
    const byEmail = auth.currentUser?.email || null;
    const req = allRequests.find(r => r.id === requestId);
    const userId = req?.userId || null;
    const referralCountSnapshot = req?.referralCount ?? 0;
    try {
      const writes = [
        updateDoc(doc(db, 'withdrawalRequests', requestId), {
          fraudChecked: checked,
          fraudCheckedAt: checked ? nowIso : null,
          fraudCheckedBy: checked ? byEmail : null,
        }),
      ];
      if (userId) {
        writes.push(updateDoc(doc(db, 'users', userId), {
          referralFraudCheckedAt: checked ? nowIso : null,
          referralFraudCheckedBy: checked ? byEmail : null,
          referralFraudCheckedAtReferralCount: checked ? referralCountSnapshot : null,
        }));
      }
      await Promise.all(writes);

      if (req) {
        req.fraudChecked = checked;
        req.fraudCheckedAt = checked ? nowIso : null;
        req.fraudCheckedBy = checked ? byEmail : null;
      }
      // Update every other cached request for this same account too, so
      // the carried-over state is visible immediately without a reload if
      // this admin has more than one request from the same user open.
      if (userId) {
        allRequests.forEach(r => {
          if (r.userId !== userId) return;
          r.accountFraudCheckedAt = checked ? nowIso : null;
          r.accountFraudCheckedBy = checked ? byEmail : null;
          r.accountFraudCheckedAtReferralCount = checked ? referralCountSnapshot : null;
        });
      }
      render();
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to update fraud-check flag', 'error');
      await loadAll(); // resync the checkbox to actual Firestore state
    }
  };

  // To Be Paid toggle: writes straight to the request doc (isAdmin() grants
  // update). Per-request only; no users/{uid} write.
  window.toggleToBePaid = async (requestId, checked) => {
    const nowIso = new Date().toISOString();
    const byEmail = auth.currentUser?.email || null;
    const req = allRequests.find(r => r.id === requestId);
    try {
      await updateDoc(doc(db, 'withdrawalRequests', requestId), {
        toBePaid: checked,
        toBePaidAt: checked ? nowIso : null,
        toBePaidBy: checked ? byEmail : null,
      });
      if (req) {
        req.toBePaid = checked;
        req.toBePaidAt = checked ? nowIso : null;
        req.toBePaidBy = checked ? byEmail : null;
      }
      render();
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to update To Be Paid flag', 'error');
      await loadAll();
    }
  };

  // Flag toggle: for a redemption that gets approved despite a fraud check
  // turning up something suspicious but not ban-worthy (Sept 9, 2026) — puts
  // the 🚩 FLAGGED badge and reason on the request so it's not treated as a
  // clean slate later. Same direct-Firestore-write pattern as the fraud-check
  // checkbox above. Unflagging needs no reason; flagging does.
  window.toggleFlag = async (requestId, nickname, currentlyFlagged) => {
    if (currentlyFlagged) {
      if (!confirm(`Remove the flag from ${nickname}'s redemption?`)) return;
      try {
        await updateDoc(doc(db, 'withdrawalRequests', requestId), {
          flaggedForReview: false,
          flagReason: null,
          flaggedAt: null,
        });
        const req = allRequests.find(r => r.id === requestId);
        if (req) { req.flaggedForReview = false; req.flagReason = null; req.flaggedAt = null; }
        render();
      } catch (e) {
        console.error(e);
        showToast(e?.message || 'Failed to unflag request', 'error');
        await loadAll();
      }
      return;
    }

    const reason = prompt(`Flag ${nickname}'s account for review — why? (internal only, never shown to the player)`);
    if (!reason || !reason.trim()) return;
    const nowIso = new Date().toISOString();
    try {
      await updateDoc(doc(db, 'withdrawalRequests', requestId), {
        flaggedForReview: true,
        flagReason: reason.trim(),
        flaggedAt: nowIso,
      });
      const req = allRequests.find(r => r.id === requestId);
      if (req) { req.flaggedForReview = true; req.flagReason = reason.trim(); req.flaggedAt = nowIso; }
      render();
      showToast(`Flagged ${nickname}'s redemption`, 'success');
    } catch (e) {
      console.error(e);
      showToast(e?.message || 'Failed to flag request', 'error');
      await loadAll();
    }
  };

  // ── Utils ──────────────────────────────────────────────────────────────
  // ── PayPal mass-pay CSV ────────────────────────────────────────────────
  // Added Oct 10, 2026 (Scott: PayPal approved mass payouts; Hillary will run
  // this too). Builds the upload file from what's already loaded on the page:
  // PENDING + PayPal + "To Be Paid" ticked (changed Oct 17, 2026 from the
  // referral fraud check). Ignores the current tab,
  // method filter and search box. Amount = NET payout (after fee). Reference
  // ID = the player's referral code. Columns/constants match the test file
  // PayPal accepted. It does NOT change any request's status — mark rows Paid
  // after the upload succeeds so nobody is paid twice.
  const PAYPAL_CSV_HEADER = 'Email/Phone,Amount,Currency code,Reference ID (optional),Note to recipient,Recipient wallet,Social Feed Privacy (optional),Holler URL (deprecated),Logo URL (optional),Purpose (optional)';
  function csvCell(v) {
    const t = String(v ?? '');
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  window.downloadPaypalMassPayCsv = async () => {
    await enrichPromise; // referral codes load in the background
    const pendingPaypal = allRequests.filter(r => r.status === 'pending' && r.payoutMethod === 'paypal');
    const rows = [], skipped = [], batchItems = [];
    let uncheckedCount = 0;
    for (const r of pendingPaypal) {
      if (!r.toBePaid) { uncheckedCount++; continue; }
      const email = (r.paypalEmail || '').trim();
      const code = (r.referralCode || '').trim();
      const net = typeof r.netAmountUsd === 'number' ? r.netAmountUsd : r.amountUsd;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !code || typeof net !== 'number' || !(net > 0)) {
        skipped.push(code || email || r.id);
        continue;
      }
      rows.push({ email, code, net });
      batchItems.push({ id: r.id, code, net });
    }
    if (!rows.length) { showToast('No pending PayPal requests with To Be Paid ticked.', 'error'); return; }

    const seen = new Map();
    rows.forEach(x => seen.set(x.code, (seen.get(x.code) || 0) + 1));
    const dupes = [...seen].filter(([, n]) => n > 1).map(([c]) => c);
    const total = rows.reduce((a, x) => a + Math.round(x.net * 100), 0) / 100;

    const lines = [PAYPAL_CSV_HEADER].concat(rows.map(x =>
      [x.email, x.net.toFixed(2), 'USD', x.code, "Here's your payment", 'PayPal', '', '', '', ''].map(csvCell).join(',')
    ));
    const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const d = new Date();
    const stamp = String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getFullYear()).slice(2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `paypal_${stamp}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);

    try {
      localStorage.setItem(PAYPAL_BATCH_KEY, JSON.stringify({
        createdAt: new Date().toISOString(),
        items: batchItems,
      }));
    } catch (e) { /* storage blocked: the Mark-as-Paid button just won't appear */ }
    refreshPaypalPaidBtn();

    let msg = `Downloaded ${rows.length} payments, $${total.toFixed(2)} total. ${uncheckedCount} pending PayPal left out (To Be Paid not ticked).`;
    if (skipped.length) msg += ` ${skipped.length} skipped (bad email/code/amount): ${skipped.slice(0, 5).join(', ')}.`;
    if (dupes.length) msg += ` Same Reference ID used twice: ${dupes.join(', ')}.`;
    msg += ' Mark them Paid after PayPal accepts the file.';
    console.log(msg);
    showToast(msg, skipped.length || dupes.length ? 'error' : '');
    const t = document.getElementById('toast'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 15000);
  };

  // ── Tango bulk-send CSV ────────────────────────────────────────────────
  // Added Oct 25, 2026. Same rules as the PayPal export: PENDING + Tango +
  // "To Be Paid" ticked, ignores the tab/search filters, amount = NET payout
  // (TerraMine absorbs Tango's fee), and it does NOT change any status — use
  // "Mark last Tango CSV as Paid" after Tango accepts the order.
  // The recipient email is stored in paypalEmail for both methods.
  // Tango has no fixed template; the columns are mapped on upload (Oct 25).
  // Only three columns: First Name = the player's referral code (our
  // reconciliation key; players give us no real name), Email, Amount (net).
  const TANGO_CSV_HEADER = 'First Name,Email,Amount';
  window.downloadTangoCsv = () => {
    const pendingTango = allRequests.filter(r => r.status === 'pending' && r.payoutMethod === 'tango');
    const rows = [], skipped = [], batchItems = [];
    let uncheckedCount = 0;

      }

    const seen = new Map();
    rows.forEach(x => seen.set(x.code, (seen.get(x.code) || 0) + 1));
    const dupes = [...seen].filter(([, n]) => n > 1).map(([c]) => c);
    const total = rows.reduce((a, x) => a + Math.round(x.net * 100), 0) / 100;

    const lines = [TANGO_CSV_HEADER].concat(rows.map(x =>
      [x.code, x.email, x.net.toFixed(2)].map(csvCell).join(',')
    ));
    const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const d = new Date();
    const stamp = String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getFullYear()).slice(2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tango_${stamp}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);

    try {
      localStorage.setItem(TANGO_BATCH_KEY, JSON.stringify({
        createdAt: new Date().toISOString(),
        items: batchItems,
      }));
    } catch (e) { /* storage blocked: the Mark-as-Paid button just won't appear */ }
    refreshPaypalPaidBtn();

    let msg = `Downloaded ${rows.length} Tango rewards, $${total.toFixed(2)} total. ${uncheckedCount} pending Tango left out (To Be Paid not ticked).`;
    if (skipped.length) msg += ` ${skipped.length} skipped (bad email/code/amount): ${skipped.slice(0, 5).join(', ')}.`;
    if (dupes.length) msg += ` Same Reference ID used twice: ${dupes.join(', ')}.`;
    msg += ' Mark them Paid after Tango accepts the order.';
    console.log(msg);
    showToast(msg, skipped.length || dupes.length ? 'error' : '');
    const t = document.getElementById('toast'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 15000);
  };

  // ── Mark last PayPal CSV as Paid ───────────────────────────────────────
  // Added Oct 10, 2026. The CSV button remembers which requests went into the
  // file (this browser only). After PayPal accepts the upload, this does for
  // each one exactly what the row's "Paid" button does: pending ->
  // approved_unpaid (server re-checks amount/email/account/cap/cooldown) ->
  // paid. Anything that fails stays in the batch so it can be retried; rows
  // that are no longer pending (already paid, rejected, etc.) are dropped.
  const PAYPAL_BATCH_KEY = 'paypalCsvBatch';
  const TANGO_BATCH_KEY = 'tangoCsvBatch';   // Oct 25, 2026: same flow for Tango
  const BATCH_KEYS = { paypal: PAYPAL_BATCH_KEY, tango: TANGO_BATCH_KEY };
  function loadPaypalBatch(key = PAYPAL_BATCH_KEY) {
    try { const b = JSON.parse(localStorage.getItem(key) || 'null'); return b && Array.isArray(b.items) && b.items.length ? b : null; }
    catch (e) { return null; }
  }
  function refreshPaypalPaidBtn() {
    // Each "Mark last CSV as Paid" button shows whenever its own batch exists
    // (regardless of the method tab), so a batch is never orphaned.
    for (const m of ['paypal', 'tango']) {
      const btn = document.getElementById(m + 'PaidBtn');
      if (!btn) continue;
      const b = loadPaypalBatch(BATCH_KEYS[m]);
      btn.style.display = b ? '' : 'none';
      if (b) btn.textContent = `✅ Mark last ${m === 'tango' ? 'Tango ' : ''}CSV as Paid (${b.items.length})`;
    }
    updateCsvButtons();
  }
  // Show the CSV download button that matches the method tab: PayPal on
  // All/PayPal, Tango on All/Tango. (Before Oct 25 the PayPal button showed on
  // the Tango tab and silently did nothing because it only exports PayPal.)
  function updateCsvButtons() {
    const pp = document.getElementById('paypalCsvBtn'), tg = document.getElementById('tangoCsvBtn');
    if (pp) pp.style.display = currentMethod === 'tango' ? 'none' : '';
    if (tg) tg.style.display = currentMethod === 'paypal' ? 'none' : '';
  }
  let batchPaying = false;
  window.markCsvBatchPaid = async (method = 'paypal') => {
    if (batchPaying) return;
    const key = BATCH_KEYS[method] || PAYPAL_BATCH_KEY;
    const label = method === 'tango' ? 'Tango' : 'PayPal';
    const b = loadPaypalBatch(key);
    if (!b) { showToast('No CSV batch remembered in this browser.', 'error'); return; }
    const total = b.items.reduce((a, x) => a + Math.round(x.net * 100), 0) / 100;
    if (!confirm(`Mark ${b.items.length} requests ($${total.toFixed(2)} net) from the CSV downloaded ${new Date(b.createdAt).toLocaleString()} as PAID?\n\nOnly do this AFTER ${label} has accepted the ${method === 'tango' ? 'order' : 'upload'}. Each request is re-checked by the server first; any that fail stay in the batch so you can retry.`)) return;

    batchPaying = true;
    const btn = document.getElementById(method + 'PaidBtn');
    btn.disabled = true;
    const byId = new Map(allRequests.map(r => [r.id, r]));
    const remaining = [], failures = [];
    let done = 0, skippedNotPending = 0;
    const queue = [...b.items];
    const worker = async () => {
      while (queue.length) {
        const it = queue.shift();
        const cur = byId.get(it.id);
        const status = cur ? cur.status : null;
        try {
          if (status === 'paid' || status === 'rejected') { skippedNotPending++; continue; }
          if (status === 'pending') await adminUpdateWithdrawalStatus({ requestId: it.id, newStatus: 'approved_unpaid' });
          else if (status !== 'approved_unpaid') throw new Error('status is ' + status);
          await adminUpdateWithdrawalStatus({ requestId: it.id, newStatus: 'paid' });
          done++;
        } catch (e) {
          console.error(it.code, e);
          remaining.push(it);
          failures.push(`${it.code}: ${e?.message || 'failed'}`);
        }
        btn.textContent = `Marking paid… ${done + failures.length + skippedNotPending}/${b.items.length}`;
      }
    };
    await Promise.all([worker(), worker(), worker()]);

    try {
      if (remaining.length) localStorage.setItem(key, JSON.stringify({ createdAt: b.createdAt, items: remaining }));
      else localStorage.removeItem(key);
    } catch (e) {}
    btn.disabled = false;
    batchPaying = false;
    refreshPaypalPaidBtn();
    let msg = `Marked ${done} as paid.`;
    if (skippedNotPending) msg += ` ${skippedNotPending} already paid/rejected (skipped).`;
    if (failures.length) { msg += ` ${failures.length} FAILED and stay in the batch: ${failures.slice(0, 4).join(' | ')}`; console.log(failures.join('\n')); }
    showToast(msg, failures.length ? 'error' : 'success');
    const t = document.getElementById('toast'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 20000);
    await loadAll();
  };

  window.copyToClipboard = async (text, btnEl) => {
    try {
      await navigator.clipboard.writeText(text);
      if (btnEl) {
        const original = btnEl.textContent;
        btnEl.textContent = '✓';
        setTimeout(() => { btnEl.textContent = original; }, 1200);
      }
      showToast('Copied to clipboard', 'success');
    } catch (e) {
      console.error('Clipboard copy failed:', e);
      showToast('Copy failed — see console', 'error');
    }
  };

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  function escHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function escAttr(str) {
    return escHtml(str).replace(/'/g, '&#39;');
  }

  // Default tab on load
  document.querySelector('[data-tab="needsAttention"]').classList.add('active');
</script>

</body>
