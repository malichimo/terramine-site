  <script>
  /* Apply saved portal theme before paint (tmPrefs cookie key "th") to avoid FOUC. */
  (function () {
    try {
      var m = document.cookie.match(/(?:^|;\s*)tmPrefs=([^;]*)/);
      if (!m) return;
      var o = JSON.parse(decodeURIComponent(m[1]));
      var t = o.th || o['terramine.portal.theme'];
      if (t === 'coal') t = 'mine';
      if (t === 'dusk' || t === 'mine' || t === 'day') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  </script>
  <script>
  (function () {
    try {
      if (sessionStorage.getItem('tmPortalAuthed') === '1') {
        document.documentElement.classList.add('tm-expect-auth');
      }
    } catch (e) {}
  })();
  </script>

      max-height: 100dvh;
      overflow: hidden;
    }
    html.tm-expect-auth body.auth-pending #portal { visibility: visible; }
    html.tm-expect-auth body.auth-pending #login-screen { visibility: hidden; display: none !important; }
  </style>

  function latLngBoundsFromSelectPixels(layer, x1, y1, x2, y2) {

    const right = Math.max(x1, x2);

    const mapRect = mapDiv.getBoundingClientRect();

      const lng = sw.lng() + fx * (ne.lng() - sw.lng());
      return new google.maps.LatLng(lat, lng);

    bounds.extend(pxToLatLng(right, bottom));

  // Read-only: some mines' details may still be loading; never show "(no greeting)" over a real one.
  function refreshBulkGreetFromDb(list) {
    if (typeof db === 'undefined' || !db || typeof db.collection !== 'function') return;
    const missing = (list || []).filter(function (m) { return m && m.id != null && !m._details; }).slice(0, 200);
    missing.forEach(function (m) {
      try {
        db.collection('propertyDetails').doc(String(m.id)).get().then(function (snap) {
          if (m._details) return;
          m._details = (snap && snap.exists) ? (snap.data() || {}) : {};
          if (snap) m._detailsExists = !!snap.exists;
          const dlg = $('mine-map-bulk-greet');
          if (!dlg || dlg.hidden || bulkGreetSaving) return;
          const id = bulkGreetIdOf(m);
          if (bulkGreetSelected.some(function (x) { return bulkGreetIdOf(x) === id; })) renderBulkGreetList();
        }).catch(function () {});
      } catch (err) {}
    });
  }
  function openBulkGreetDialog(list) {

    refreshBulkGreetFromDb(bulkGreetSelected);

  async function applyBulkGreet() {
    if (bulkGreetSaving) return;
    const ta = $('mine-map-bulk-greet-input');
    // Same normalization as applyMineMapEdit / applyMineGreetModal: trim, cap at 100 (newlines kept).
    let next = ta ? String(ta.value || '').trim() : '';
    if (next.length > BULK_GREET_MAX) next = next.slice(0, BULK_GREET_MAX);
    const list = bulkGreetSelected.slice();
    const total = list.length;
    if (!total) return;
    if (!next) {
      const sure = window.confirm('The greeting box is empty. Clear the greeting on ' + total + ' mine' + (total === 1 ? '' : 's') + '?');
      if (!sure) {
        if (ta) { try { ta.focus(); } catch (e) {} }
        return;
      }
    }
    setBulkGreetBusy(true);
    setBulkGreetProgress('0 of ' + total + ' done', false);
    let ok = 0;
    const failed = [];
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      const id = m.id;
      try {
        await safeUpdatePropertyDetails(id, { greeting: next }, null, m);
        syncLocalMineGreeting(id, next);
        if (!m._details) m._details = {};
        m._details.greeting = next;
        ok++;
      } catch (err) {
        failed.push(m);
        console.warn('[full-map] bulk greeting failed', id, err);
      }
      setBulkGreetProgress((i + 1) + ' of ' + total + ' done', false);
    }
    const verb = next ? 'updated' : 'cleared';
    if (!failed.length) {
      exitBulkRenameMode();
      showMineMapMsg('Greeting ' + verb + ' on ' + ok + ' mine' + (ok === 1 ? '' : 's') + '.', false);
      return;
    }
    // Keep the dialog (and the typed greeting) open with only the mines that failed, so Apply retries them.
    bulkGreetSelected = failed;
    setBulkGreetBusy(false);
    renderBulkGreetList();
    setBulkGreetProgress((ok ? ('Greeting ' + verb + ' on ' + ok + ' mine' + (ok === 1 ? '' : 's') + '. ') : '')
      + failed.length + ' failed \u2014 still listed; Apply to retry.', true);
  }
  function bindBulkRenameLayerOnce() {
    if (bulkRenameLayerBound) return;
    bulkRenameLayerBound = true;
    const layer = $('mine-map-select-layer');
    const rect = $('mine-map-select-rect');
    if (!layer || !rect) return;
    layer.addEventListener('pointerdown', function (e) {
      if (!bulkRenameMode || e.button !== 0) return;
      e.preventDefault();
      bulkRenameDragging = true;
      const br = layer.getBoundingClientRect();
      bulkRenameStartX = e.clientX - br.left;
      bulkRenameStartY = e.clientY - br.top;
      rect.hidden = false;
      rect.style.left = bulkRenameStartX + 'px';
      rect.style.top = bulkRenameStartY + 'px';
      rect.style.width = '0px';
      rect.style.height = '0px';
      try { layer.setPointerCapture(e.pointerId); } catch (err) {}
    });
    layer.addEventListener('pointermove', function (e) {
      if (!bulkRenameDragging) return;
      const br = layer.getBoundingClientRect();
      const x = e.clientX - br.left;
      const y = e.clientY - br.top;
      const left = Math.min(bulkRenameStartX, x);
      const top = Math.min(bulkRenameStartY, y);
      rect.style.left = left + 'px';
      rect.style.top = top + 'px';
      rect.style.width = Math.abs(x - bulkRenameStartX) + 'px';
      rect.style.height = Math.abs(y - bulkRenameStartY) + 'px';
    });
    function endDrag(e) {
      if (!bulkRenameDragging) return;
      bulkRenameDragging = false;
      const br = layer.getBoundingClientRect();
      const x = e.clientX - br.left;
      const y = e.clientY - br.top;
      const bounds = latLngBoundsFromSelectPixels(layer, bulkRenameStartX, bulkRenameStartY, x, y);
      finishBulkRenameSelection(bounds);
    }
    layer.addEventListener('pointerup', endDrag);
    layer.addEventListener('pointercancel', function () {
      bulkRenameDragging = false;
      clearBulkRenameSelectRect();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const editDlg = $('mine-map-edit');
        if (editDlg && !editDlg.hidden) {
          closeMineMapEdit();
          return;
        }
        if (bulkRenameMode && !bulkGreetSaving) {
          exitBulkRenameMode();
          showMineMapMsg('', true);
        }
      }
    });
  }

  let followTip = null;
  let followTipTimer = null;
  let followTipTarget = null;
  let followTipX = 0;
  let followTipY = 0;
  function dismissFollowTip() {
    if (followTipTimer) { clearTimeout(followTipTimer); followTipTimer = null; }
    followTipTarget = null;
    if (followTip) followTip.style.display = 'none';
  }
  function ensureFollowTip() {
    if (!followTip) {
      followTip = document.createElement('div');
      followTip.className = 'toolbar-follow-tip';
      followTip.setAttribute('role', 'tooltip');
    }
    if (followTip.parentNode !== document.body) document.body.appendChild(followTip);
    return followTip;
  }
  function placeFollowTip(x, y) {
    const tip = ensureFollowTip();
    const gap = 14, edge = 8;
    tip.style.visibility = 'hidden';
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + gap, top = y + gap;
    if (left + w > window.innerWidth - edge) left = x - gap - w;
    if (top + h > window.innerHeight - edge) top = y - gap - h;
    if (left < edge) left = edge;
    if (top < edge) top = edge;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.visibility = 'visible';
  }
  function bindFollowTip(btn) {
    if (!btn || btn.dataset.tipBound === '1') return;
    btn.dataset.tipBound = '1';
    btn.addEventListener('mouseenter', (e) => {
      if (followTipTimer) { clearTimeout(followTipTimer); followTipTimer = null; }
      followTipTarget = btn;
      followTipX = e.clientX;
      followTipY = e.clientY;
      const tip = ensureFollowTip();
      tip.textContent = (btn.getAttribute('data-tip') || '').trim();
      tip.style.display = 'none';
      followTipTimer = setTimeout(() => {
        followTipTimer = null;
        if (followTipTarget !== btn || !btn.isConnected) return;
        placeFollowTip(followTipX, followTipY);
      }, 1000);
    });
    btn.addEventListener('mousemove', (e) => {
      if (followTipTarget !== btn) return;
      followTipX = e.clientX;
      followTipY = e.clientY;
      if (followTip && followTip.style.display === 'block' && !followTipTimer) {
        placeFollowTip(followTipX, followTipY);
      }
    });
    btn.addEventListener('mouseleave', () => {
      if (followTipTarget === btn) dismissFollowTip();
    });
  }

  async function loadAllMinesOntoMap(uid) {
    bindMineMapOnce();
    syncMineMapZoomSlider(getSavedMineMapZoom());
    mineMapBuildingsOn = getSavedMineMapBuildings();
    updateMineMapBuildingsBtn();
    mineMapLabelsOn = getSavedMineMapLabels();
    updateMineMapLabelsBtn();
    updateMineMapLabelsBtn();
    updateMineMapReachBtn();
    mineMapReachReady = false;
    clearMineMapReachLayer();
    showMineMapMsg('Loading map…', false);

    await loadGoogleMapsApi();
    const map = ensureMineMap();
    try { google.maps.event.trigger(map, 'resize'); } catch (e) {}

    const snap = await db.collection('properties').where('ownerId', '==', uid).get();
    const mines = snap.docs.map(d => ({ id: d.id, ...d.data(), _details: {} }));
    allMines = mines;
    const total = mines.length;
    newestMine = null;
    newestMineMs = null;
    didInitialCenter = false;
    clearMineMapAreaOverlays();

    if (!total) {
      updateLoadingOverlay(0, 0);
      mineMapReachReady = true;
      if (mineMapReachOn) drawMineMapReach();
      showMineMapMsg('You have no mines yet.', false);
      return;
    }

    updateLoadingOverlay(0, total);
    $('full-map-loading').hidden = false;

    let loaded = 0;
    for (let i = 0; i < mines.length; i += DETAILS_FETCH) {
      const slice = mines.slice(i, i + DETAILS_FETCH);
      const snaps = await Promise.all(
        slice.map(p => db.collection('propertyDetails').doc(p.id).get().catch(() => null))
      );
      snaps.forEach((s, j) => {
        slice[j]._details = (s && s.exists) ? (s.data() || {}) : {};
        if (s) slice[j]._detailsExists = !!s.exists;
      });
      for (let j = 0; j < slice.length; j++) {
        const mine = slice[j];
        considerNewestMine(mine);
        drawMineIfNeeded(map, mine);
      }
      loaded = Math.min(i + DETAILS_FETCH, total);
      updateLoadingOverlay(loaded, total);

      if (!didInitialCenter && newestMine) {
        if (centerOnMine(newestMine)) didInitialCenter = true;
      }
      // Yield to UI between batches for large inventories
      await new Promise(r => setTimeout(r, 0));
    }

    // Fallback newest: any mine with location if none had createdAt
    if (!newestMine) {
      for (let i = 0; i < mines.length; i++) {
        if (findCorners(mines[i]) || mineMapCenterGps(mines[i])) {
          newestMine = mines[i];
          break;
        }
      }
    }
    if (newestMine) {
      centerOnMine(newestMine);
      const title = $('mine-map-title');
      if (title) {
        title.textContent = 'Map · newest: ';
        const nameEl = document.createElement('span');
        nameEl.className = 'mine-map-title-name';
        nameEl.textContent = titleOf(newestMine) || newestMine.id;
        nameEl.title = 'Recenter the map on this mine';
        nameEl.setAttribute('role', 'button');
        nameEl.tabIndex = 0;
        const target = newestMine;
        const recenter = function (ev) {
          if (ev) { ev.preventDefault(); ev.stopPropagation(); }
          centerOnMine(target);
        };
        nameEl.addEventListener('click', recenter);
        nameEl.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') recenter(ev);
        });
        title.appendChild(nameEl);
      }
    }
    updateLoadingOverlay(total, total);
    const loading = $('full-map-loading');
    if (loading) loading.hidden = true;
    mineMapReachReady = true;
    if (mineMapReachOn) drawMineMapReach();
    showMineMapMsg(
      'Loaded ' + total.toLocaleString('en-US') + ' propert'
        + (total === 1 ? 'y' : 'ies') + '.',
      false
    );
  }

  (function initAccountMenu() {
    var toggle = document.getElementById('nav-account-toggle');
    var dropdown = document.getElementById('nav-account-dropdown');
    var wrap = document.querySelector('.nav-account');
    if (!toggle || !dropdown) return;
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var willOpen = dropdown.hasAttribute('hidden');
      if (willOpen) dropdown.removeAttribute('hidden');
      else dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!wrap || wrap.contains(e.target)) return;
      dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();
</script>
