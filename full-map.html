<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
  <script>
  (function () {
    try {
      if (sessionStorage.getItem('tmPortalAuthed') === '1') {
        document.documentElement.classList.add('tm-expect-auth');
      }
    } catch (e) {}
  })();
  </script>
  <style>
    html.tm-expect-auth #login-screen { display: none !important; }
    html.tm-expect-auth #portal {
      display: flex !important;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    html.tm-expect-auth body.auth-pending #portal { visibility: visible; }
    html.tm-expect-auth body.auth-pending #login-screen { visibility: hidden; display: none !important; }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Map — TerraMine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal-top-nav.css" />
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0D1B2A; --navy2: #111F30; --navy3: #16263A; --cyan: #4FC3F7;
      --white: #F0F4FF; --muted: #556070; --gray: #8899AA; --border: rgba(255,255,255,0.07);
      --red: #EF5350; --green: #66BB6A; --surface: rgba(255,255,255,0.04);
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; }
    body {
      position: relative;
      background-color: #0D1B2A;
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .portalbackground, .backgroundoverlaycolor {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .portalbackground {
      z-index: 0;
      background-image: url('/images/terratown-bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: cover;
    }
    .backgroundoverlaycolor {
      z-index: 1;
      background: rgba(238, 241, 244, 0.7);
    }
    #login-screen, #portal, .layout, .main, .content, .full-map-wrap {
      position: relative; z-index: 2;
    }
    body.auth-pending #login-screen,
    body.auth-pending #portal { visibility: hidden; }


    #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:transparent; padding:24px; }
    .login-card { width:100%; max-width:380px; background:#111F30; border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:36px 32px; }
    .login-logo { margin:0 auto 10px; text-align:center; }
    .login-logo img { display:block; margin:0 auto; height:60px; width:auto; max-width:100%; }
    .login-sub { font-size:13px; color:#556070; margin-bottom:28px; text-align:center; }
    .input-group { margin-bottom:14px; }
    .input-label { font-size:11px; color:#8899AA; margin-bottom:5px; display:block; letter-spacing:0.5px; }
    .input-field { width:100%; background:#0D1B2A; border:1px solid rgba(255,255,255,0.07); border-radius:6px; padding:10px 12px; font-size:14px; color:#F0F4FF; font-family:'DM Sans',sans-serif; outline:none; }
    .input-field:focus { border-color:#4FC3F7; }
    .btn-primary { width:100%; padding:11px; background:#4FC3F7; color:#0D1B2A; border:none; border-radius:6px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1.5px; cursor:pointer; margin-top:4px; }
    .btn-primary:hover { opacity:0.88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-google { width:100%; padding:10px; background:rgba(255,255,255,0.04); color:#F0F4FF; border:1px solid rgba(255,255,255,0.07); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
    .btn-google:hover { border-color:#8899AA; background:#16263A; }
    .login-divider { display:flex; align-items:center; gap:12px; margin:20px 0; font-size:11px; color:#556070; }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.07); }
    .login-error { font-size:12px; color:#EF5350; margin-top:8px; min-height:16px; }
    .login-toggle { text-align:center; font-size:12px; color:#556070; margin-top:16px; }
    .login-toggle a { color:#4FC3F7; text-decoration:none; cursor:pointer; }
    .toolbar-follow-tip {
      position:fixed; z-index:600; pointer-events:none; display:none;
      background:#0f172a; color:#f8fafc; border:1px solid rgba(255,255,255,.14);
      border-radius:8px; padding:8px 10px; box-shadow:0 12px 28px rgba(6,10,16,.45);
      font-size:13px; line-height:1.35; font-weight:500; text-align:left;
      max-width:min(280px, calc(100vw - 16px));
    }

    /* ── Mine GPS minimap overlay ── */
    .mine-map-overlay {
      position:fixed !important; z-index:500;
      display:flex; flex-direction:column;
      background:rgba(13,27,42,0.78);
      box-sizing:border-box;
    }
    .mine-map-overlay[hidden] { display:none !important; }
    .mine-map-panel {
      position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
      margin:15px; background:#eef1f4; color:#fff;
      border:1px solid rgba(255,255,255,.22); border-radius:14px;
      box-shadow:0 12px 28px rgba(6,10,16,.55); overflow:hidden;
    }
    .mine-map-head {
      flex-shrink:0; display:flex; align-items:center; gap:10px;
      padding:12px 52px 12px 16px; background:#133665;
      border-bottom:1px solid rgba(255,255,255,.22);
    }
    .mine-map-type-icon {
      flex-shrink:0; width:26px; height:26px; object-fit:contain; display:block;
    }
    .mine-map-type-icon[hidden] { display:none !important; }
    .mine-map-title {
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:#fff;
      min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
      cursor:pointer;
    }
    .mine-map-title.is-editing {
      cursor:text; outline:2px solid rgba(79,195,247,.65); outline-offset:2px; border-radius:6px;
      background:rgba(15,23,42,.28); white-space:normal; text-overflow:clip; overflow:visible;
    }
    .mine-map-zoom {
      flex-shrink:0; display:flex; align-items:center; gap:6px;
      margin-left:auto; margin-right:2px;
      color:#fff; font:700 12px 'DM Sans',sans-serif; letter-spacing:.3px;
      white-space:nowrap;
    }
    .mine-map-zoom input[type="range"] {
      width:88px; height:18px; margin:0; vertical-align:middle; cursor:pointer;
      accent-color:#4FC3F7;
    }
    .mine-map-radius {
      flex-shrink:0; display:flex; align-items:center; gap:6px;
      color:#fff; font:700 12px 'DM Sans',sans-serif; letter-spacing:.3px;
      white-space:nowrap;
    }
    .mine-map-radius[hidden] { display:none !important; }
    .mine-map-radius input[type="range"] {
      width:100px; height:18px; margin:0; vertical-align:middle; cursor:pointer;
      accent-color:#ce93d8;
    }
    .mine-map-radius-value {
      min-width:3.2em; font:700 11px/1 'DM Sans',sans-serif; color:#e1bee7;
    }
    .mine-map-labels {
      flex-shrink:0; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
      color:#fff; border-radius:999px; padding:6px 12px; cursor:pointer;
      font:700 12px 'DM Sans',sans-serif; letter-spacing:.3px;
    }
    .mine-map-labels:hover { background:rgba(255,255,255,.22); }
    .mine-map-labels[aria-pressed="true"] { background:rgba(79,195,247,.35); border-color:#4FC3F7; }
    .mine-map-close {
      position:absolute; top:10px; right:12px; z-index:2;
      width:36px; height:36px; border:0; border-radius:999px;
      background:rgba(255,255,255,0.12); color:#fff;
      font:700 22px/1 'DM Sans',sans-serif; cursor:pointer;
    }
    .mine-map-close:hover { background:rgba(255,255,255,0.22); }
    .mine-map-body {
      position:relative; flex:1; min-height:0; height:auto; background:#c8e6c9;
    }
    .mine-map-canvas { position:absolute; inset:0; }
    .mine-map-tip, .mine-map-msg {
      position:absolute; left:12px; right:12px; bottom:12px; z-index:2;
      background:rgba(19,54,101,.92); color:#fff; border-radius:8px;
      padding:8px 12px; font-size:12px; font-weight:600; pointer-events:none;
      box-shadow:0 8px 20px rgba(6,10,16,.4);
    }
    .mine-map-msg {
      top:12px; bottom:auto; text-align:center;
      opacity:1; transition:opacity .4s ease;
    }
    .mine-map-msg.is-fading { opacity:0; }
    .mine-map-hover-tip {
      position:absolute; z-index:3; left:0; top:0; max-width:260px;
      display:flex; align-items:center; gap:8px;
      background:rgba(19,54,101,.94); color:#fff; border-radius:8px;
      padding:6px 10px; font-size:12px; font-weight:600; pointer-events:none;
      box-shadow:0 8px 20px rgba(6,10,16,.45); white-space:nowrap;
      transform:translate(-9999px,-9999px);
    }
    .mine-map-hover-tip[hidden] { display:none !important; }
    .mine-map-hover-tip img { width:18px; height:18px; object-fit:contain; flex-shrink:0; display:block; }
    .mine-map-hover-tip span { overflow:hidden; text-overflow:ellipsis; }
    
    .mine-map-labels.is-bulk-rename-active {
      background:rgba(79,195,247,.35); border-color:#4FC3F7;
    }
    .mine-map-select-layer {
      position:absolute; inset:0; z-index:8; cursor:crosshair;
      background:transparent;
    }
    .mine-map-select-layer[hidden] { display:none !important; }
    .mine-map-select-rect {
      position:absolute; pointer-events:none;
      border:2px solid #29B6F6;
      background:rgba(79,195,247,.28);
      box-sizing:border-box;
    }
    .mine-map-select-rect[hidden] { display:none !important; }
    .mine-map-bulk-rename {
      position:absolute; z-index:30; left:16px; right:16px; top:58px;
      max-height:calc(100% - 80px); display:flex; flex-direction:column;
      background:rgba(19,54,101,.97); color:#fff;
      border:1px solid rgba(255,255,255,.28); border-radius:12px;
      box-shadow:0 16px 40px rgba(6,10,16,.55); overflow:hidden;
    }
    .mine-map-bulk-rename[hidden] { display:none !important; }
    .mine-map-bulk-rename-x {
      position:absolute; top:8px; right:10px; z-index:2;
      width:32px; height:32px; border:0; border-radius:999px;
      background:rgba(255,255,255,0.12); color:#fff;
      font:700 20px/1 'DM Sans',sans-serif; cursor:pointer;
    }
    .mine-map-bulk-rename-x:hover { background:rgba(255,255,255,0.22); }
    .mine-map-bulk-rename-inner {
      display:flex; gap:0; min-height:0; flex:1; max-height:min(420px, 70vh);
      padding:14px 44px 14px 14px; box-sizing:border-box;
    }
    .mine-map-bulk-rename-list {
      flex:0 0 42%; min-width:0; overflow:auto; padding-right:10px;
      border-right:1px solid rgba(255,255,255,.18);
      display:flex; flex-direction:column; gap:6px;
    }
    .mine-map-bulk-rename-item {
      display:flex; align-items:center; gap:8px;
      font:600 13px/1.3 'DM Sans',sans-serif;
      padding:4px 2px;
    }
    .mine-map-bulk-rename-item img {
      width:20px; height:20px; object-fit:contain; flex-shrink:0; display:block;
    }
    .mine-map-bulk-rename-item span {
      flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }

    .mine-map-bulk-rename-item-remove {
      margin-left: auto;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font: 700 16px/1 "DM Sans", sans-serif;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mine-map-bulk-rename-item-remove:hover {
      background: rgba(244, 67, 54, 0.55);
    }
    .mine-map-bulk-rename-form {
      flex:1; min-width:0; padding-left:14px;
      display:flex; flex-direction:column; gap:12px; justify-content:flex-start;
    }
    .mine-map-bulk-rename-form label.bulk-name-label {
      display:flex; flex-direction:column; gap:6px;
      font:700 12px 'DM Sans',sans-serif; letter-spacing:.3px;
    }
    .mine-map-bulk-rename-form input[type="text"] {
      width:100%; box-sizing:border-box;
      border:1px solid rgba(255,255,255,.35); border-radius:8px;
      background:rgba(15,23,42,.45); color:#fff;
      padding:10px 12px; font:600 14px 'DM Sans',sans-serif;
    }
    .mine-map-bulk-rename-form label.bulk-seq-label {
      display:flex; align-items:flex-start; gap:8px;
      font:500 13px/1.35 'DM Sans',sans-serif; cursor:pointer;
    }
    .mine-map-bulk-rename-form label.bulk-seq-label input {
      margin-top:2px; flex-shrink:0; accent-color:#4FC3F7;
    }
    .mine-map-bulk-rename-apply-wrap {
      align-self:flex-start; margin-top:4px;
      display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    }
    .mine-map-bulk-rename-apply {
      border:1px solid rgba(255,255,255,.35); background:rgba(79,195,247,.35);
      color:#fff; border-radius:999px; padding:8px 18px; cursor:pointer;
      font:700 13px 'DM Sans',sans-serif; letter-spacing:.3px;
    }
    .mine-map-bulk-rename-apply:hover { background:rgba(79,195,247,.5); }
    .mine-map-bulk-rename-apply:disabled { opacity:.55; cursor:not-allowed; }
    .mine-map-bulk-rename-progress {
      font:600 13px/1.3 'DM Sans',sans-serif; color:rgba(255,255,255,.92);
      letter-spacing:.2px; min-height:1.3em;
    }

    /* Full-map page layout (not a popup) */
    #portal {
      display: none;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    .full-map-wrap {
      flex: 1;
      min-height: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }
    .full-map-wrap .mine-map-panel {
      flex: 1;
      min-height: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #eef1f4;
      color: #fff;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(6,10,16,.55);
      overflow: hidden;
      position: relative;
    }
    .full-map-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(13, 27, 42, 0.35);
    }
    .full-map-loading[hidden] { display: none !important; }
    .full-map-loading-card {
      background: rgba(19, 54, 101, 0.94);
      color: #fff;
      border-radius: 12px;
      padding: 16px 22px;
      font: 700 14px/1.4 'DM Sans', sans-serif;
      letter-spacing: 0.2px;
      box-shadow: 0 12px 28px rgba(6,10,16,.45);
      text-align: center;
      min-width: 220px;
    }
    .full-map-loading-card .count {
      font-size: 18px;
      letter-spacing: 0.4px;
      margin-top: 4px;
    }
    .mine-map-title { cursor: default; }
    .mine-map-title.is-editing { cursor: text; }

  </style>
</head>
<body class="auth-pending">
<div class="portalbackground" aria-hidden="true"></div>
<div class="backgroundoverlaycolor" aria-hidden="true"></div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="/images/terramine-logo-horizontal-small.png" alt="TerraMine"></div>
    <div class="login-sub">Sign in to view your mine map</div>
    <button class="btn-google" id="btn-google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="login-divider">or</div>
    <div class="input-group"><label class="input-label">Email</label><input class="input-field" type="email" id="input-email" placeholder="you@example.com" /></div>
    <div class="input-group"><label class="input-label">Password</label><input class="input-field" type="password" id="input-password" placeholder="••••••••" /></div>
    <div class="login-error" id="login-error"></div>
    <button class="btn-primary" id="btn-email-signin">Sign In</button>
    <div class="login-toggle">Forgot password? <a id="btn-reset">Send reset email</a></div>
  </div>
</div>

<div id="portal">
  <nav class="top-nav">
    <a class="nav-logo" href="/"><img src="/images/terramine-logo-horizontal-small.png" alt="TerraMine"></a>
    <div class="nav-links" id="portal-nav-links">
      <a href="/portal.html">Dashboard</a>
      <a href="/mines.html">Mines</a>
      <a href="/inventory.html">Inventory</a>
      <a href="/visitors.html">Visitors</a>
      <a href="/activity.html">Activity</a>
      <a href="/full-map.html" class="active">Map</a>
    </div>
    <div class="nav-right">
      <div class="nav-account">
        <a class="nav-account-link" href="/account.html" title="Account">
          <div class="nav-avatar" id="nav-avatar">—</div>
          <span class="nav-nickname" id="nav-nickname"></span>
        </a>
        <button type="button" class="nav-account-toggle" id="nav-account-toggle" aria-label="Account menu" aria-expanded="false">▾</button>
        <div class="nav-account-dropdown" id="nav-account-dropdown" hidden>
          <button type="button" class="nav-signout" id="btn-signout">Sign out</button>
        </div>
      </div>
      <button type="button" class="nav-menu-toggle" id="portal-nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="portal-nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-balances">
      <div class="nav-pill nav-pill-usd" data-tip="Current USD Earning / Balance">
        <span class="nav-pill-icon nav-pill-usd-icon" aria-hidden="true">$</span>
        <span class="nav-pill-value" id="sb-usd">—</span>
      </div>
      <div class="nav-pill nav-pill-tb" data-tip="TerraBucks Balance">
        <img class="nav-pill-icon" src="images/mine-icons/terrabucks-small.png" alt="" width="40" height="40" />
        <span class="nav-pill-value" id="sb-tb">—</span>
      </div>
    </div>
  </nav>

  <div class="full-map-wrap">
    <div class="mine-map-panel" aria-label="Full mine map">
      <div class="mine-map-head">
        <div class="mine-map-title" id="mine-map-title">Map</div>
        <button type="button" class="mine-map-labels" id="mine-map-bulk-rename-btn" data-tip="Draw a rectangle to select mines on the map, then rename them." aria-label="Draw a rectangle to select mines on the map, then rename them." aria-pressed="false">Bulk Rename</button>
        <button type="button" class="mine-map-labels" id="mine-map-buildings" aria-pressed="false" data-tip="Show building footprints and outlines." aria-label="Show building footprints and outlines.">Buildings off</button>
        <button type="button" class="mine-map-labels" id="mine-map-labels" aria-pressed="false" data-tip="Show map labels (streets, places, and building names)." aria-label="Show map labels (streets, places, and building names).">Labels off</button>
        <button type="button" class="mine-map-labels" id="mine-map-reach" aria-pressed="false" data-tip="Show the overall area ALL of my mines cover" aria-label="Show the overall area ALL of my mines cover">Reach off</button>
        <label class="mine-map-zoom">
          <span>Zoom</span>
          <input type="range" id="mine-map-zoom" min="10" max="21" step="1" value="17" aria-label="Map zoom">
        </label>
      </div>
      <div class="mine-map-body" id="mine-map-body">
        <div class="mine-map-canvas" id="mine-map-canvas"></div>
        <div class="mine-map-select-layer" id="mine-map-select-layer" hidden>
          <div class="mine-map-select-rect" id="mine-map-select-rect" hidden></div>
        </div>
        <div class="mine-map-tip" id="mine-map-tip" hidden></div>
        <div class="mine-map-hover-tip" id="mine-map-hover-tip" hidden></div>
        <div class="mine-map-msg" id="mine-map-msg" hidden></div>
        <div class="full-map-loading" id="full-map-loading" hidden>
          <div class="full-map-loading-card">
            <div>Loading property polygons…</div>
            <div class="count" id="full-map-loading-count">0 loaded / 0 remaining</div>
          </div>

      const lng = sw.lng() + fx * (ne.lng() - sw.lng());
      return new google.maps.LatLng(lat, lng);
    }
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(pxToLatLng(left, top));
    bounds.extend(pxToLatLng(right, bottom));
    return bounds;
  }
  function renderBulkRenameList() {
    const list = $('mine-map-bulk-rename-list');
    if (!list) return;
    list.innerHTML = '';
    for (let i = 0; i < bulkRenameSelected.length; i++) {
      const m = bulkRenameSelected[i];
      const type = typeKey(m || {});
      const row = document.createElement('div');
      row.className = 'mine-map-bulk-rename-item';
      const img = document.createElement('img');
      img.src = ICONS[type] || ICONS.rock;
      img.alt = '';
      const span = document.createElement('span');
      span.textContent = titleOf(m) || String(m.id || '');
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'mine-map-bulk-rename-item-remove';
      remove.setAttribute('aria-label', 'Remove from rename list');
      remove.textContent = '\u00d7';
      remove.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        const id = String(m && m.id != null ? m.id : '');
        bulkRenameSelected = bulkRenameSelected.filter(function (x) {
          return String(x && x.id != null ? x.id : '') !== id;
        });
        if (!bulkRenameSelected.length) {
          exitBulkRenameMode();
          showMineMapMsg('No mines left to rename.', true);
          return;
        }
        renderBulkRenameList();
      });
      row.appendChild(img);
      row.appendChild(span);
      row.appendChild(remove);
      list.appendChild(row);
    }
    const apply = $('mine-map-bulk-rename-apply');
    if (apply) apply.disabled = bulkRenameSelected.length === 0;
  }
  function openBulkRenameDialog(mines) {
    bulkRenameSelected = mines.slice();
    const dlg = $('mine-map-bulk-rename');
    if (!dlg) return;
    renderBulkRenameList();
    dlg.hidden = false;
    dlg.setAttribute('aria-hidden', 'false');
    const input = $('mine-map-bulk-rename-input');
    if (input) {
      input.value = '';
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 0);
    }
  }
  function finishBulkRenameSelection(bounds) {
    stopBulkRenameDrawLayer();
    if (!bounds) {
      exitBulkRenameMode();
      showMineMapMsg('No mines in selection.', true);
      return;
    }
    const drawn = getMineMapDrawnMines();
    const selected = [];
    for (let i = 0; i < drawn.length; i++) {
      const m = drawn[i];
      const c = mineMapSelectionCenter(m);
      if (!c) continue;
      try {
        if (bounds.contains(new google.maps.LatLng(c.lat, c.lng))) selected.push(m);
      } catch (e) {}
    }
    if (!selected.length) {
      exitBulkRenameMode();
      showMineMapMsg('No mines in selection.', true);
      return;
    }
    bulkRenameMode = true;
    updateBulkRenameBtn();
    openBulkRenameDialog(selected);
  }
  function startBulkRenameDrawMode() {
    if (!mineMapInstance) {
      showMineMapMsg('Map is not ready yet.', true);
      return;
    }
    hideBulkRenameDialog();
    bulkRenameMode = true;
    bulkRenameDragging = false;
    updateBulkRenameBtn();
    const layer = $('mine-map-select-layer');
    if (!layer) return;
    layer.hidden = false;
    clearBulkRenameSelectRect();
    showMineMapMsg('Draw a rectangle to select mines. Esc cancels.', true);
  }
  function toggleBulkRenameFromButton() {
    if (bulkRenameMode) {
      exitBulkRenameMode();
      showMineMapMsg('', true);
      return;
    }
    startBulkRenameDrawMode();
  }
  function flashShowcaseNote(text) {
    showMineMapMsg(text || '', true);
  }
  async function safeUpdatePropertyDetails(mineId, updates, removeFields) {
    const detailsRef = db.collection('propertyDetails').doc(String(mineId));
    const now = new Date().toISOString();
    const existing = await detailsRef.get();
    const payload = Object.assign({}, updates || {});
    if (removeFields && removeFields.length) {
      removeFields.forEach(k => { payload[k] = firebase.firestore.FieldValue.delete(); });
    }
    payload.updatedAt = now;
    if (!existing.exists) {
      if (removeFields && removeFields.length && (!updates || !Object.keys(updates).length)) return;
      await detailsRef.set(Object.assign({
        propertyId: String(mineId),
        productionLevel: 1,
        gameLevel: 1,
        gameXP: 0,
        gamesPlayed: 0,
        gamesWon: 0,
        dailyActivitiesRemaining: 1,
        doubleRewardAvailable: true,
        lastDailyReset: now,
        createdAt: now,
        lastUpdated: now
      }, payload));
    } else {
      payload.lastUpdated = now;
      await detailsRef.set(payload, { merge: true });
    }
  }
  async function applyBulkRename() {
    const input = $('mine-map-bulk-rename-input');
    const seq = $('mine-map-bulk-rename-seq');
    const applyBtn = $('mine-map-bulk-rename-apply');
    const base = input ? String(input.value || '').replace(/\s+/g, ' ').trim() : '';
    if (!base) {
      flashShowcaseNote('Enter a new name.');
      if (input) input.focus();
      return;
    }
    const mines = bulkRenameSelected.slice().sort((a, b) => {
      const na = String(titleOf(a) || '').localeCompare(String(titleOf(b) || ''), undefined, { sensitivity: 'base', numeric: true });
      if (na) return na;
      return String(a.id || '').localeCompare(String(b.id || ''), undefined, { numeric: true });
    });
    const useSeq = !!(seq && seq.checked);
    if (applyBtn) applyBtn.disabled = true;
    const progress = $('mine-map-bulk-rename-progress');
    const total = mines.length;
    if (progress) {
      progress.hidden = false;
      progress.textContent = '0 of ' + total + ' done';
    }
    let ok = 0, fail = 0;
    for (let i = 0; i < mines.length; i++) {
      const name = useSeq ? (base + ' ' + (i + 1)) : base;
      const id = mines[i].id;
      try {
        await safeUpdatePropertyDetails(id, { customName: name }, null);
        if (!mines[i]._details) mines[i]._details = {};
        mines[i]._details.customName = name;
        ok++;
      } catch (e) {
        console.warn('[full-map] bulk rename failed', id, e);
        fail++;
      }
      if (progress) progress.textContent = (i + 1) + ' of ' + total + ' done';
    }
    exitBulkRenameMode();
    if (fail) showMineMapMsg('Renamed ' + ok + ', failed ' + fail + '.', false);
    else showMineMapMsg('Renamed ' + ok + ' mine' + (ok === 1 ? '' : 's') + '.', false);
  }
  function bindBulkRenameLayerOnce() {
    if (bulkRenameLayerBound) return;
    bulkRenameLayerBound = true;
    const layer = $('mine-map-select-layer');
    const rect = $('mine-map-select-rect');
    if (!layer || !rect) return;
    layer.addEventListener('pointerdown', function (e) {
      if (!bulkRenameMode || e.button !== 0) return;
      e.preventDefault();
      bulkRenameDragging = true;
      const br = layer.getBoundingClientRect();
      bulkRenameStartX = e.clientX - br.left;
      bulkRenameStartY = e.clientY - br.top;
      rect.hidden = false;
      rect.style.left = bulkRenameStartX + 'px';
      rect.style.top = bulkRenameStartY + 'px';
      rect.style.width = '0px';
      rect.style.height = '0px';
      try { layer.setPointerCapture(e.pointerId); } catch (err) {}
    });
    layer.addEventListener('pointermove', function (e) {
      if (!bulkRenameDragging) return;
      const br = layer.getBoundingClientRect();
      const x = e.clientX - br.left;
      const y = e.clientY - br.top;
      const left = Math.min(bulkRenameStartX, x);
      const top = Math.min(bulkRenameStartY, y);
      rect.style.left = left + 'px';
      rect.style.top = top + 'px';
      rect.style.width = Math.abs(x - bulkRenameStartX) + 'px';
      rect.style.height = Math.abs(y - bulkRenameStartY) + 'px';
    });
    function endDrag(e) {
      if (!bulkRenameDragging) return;
      bulkRenameDragging = false;
      const br = layer.getBoundingClientRect();
      const x = e.clientX - br.left;
      const y = e.clientY - br.top;
      const bounds = latLngBoundsFromSelectPixels(layer, bulkRenameStartX, bulkRenameStartY, x, y);
      finishBulkRenameSelection(bounds);
    }
    layer.addEventListener('pointerup', endDrag);
    layer.addEventListener('pointercancel', function () {
      bulkRenameDragging = false;
      clearBulkRenameSelectRect();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (bulkRenameMode) {
          exitBulkRenameMode();
          showMineMapMsg('', true);
        }
      }
    });
  }

  let followTip = null;
  let followTipTimer = null;
  let followTipTarget = null;
  let followTipX = 0;
  let followTipY = 0;
  function dismissFollowTip() {
    if (followTipTimer) { clearTimeout(followTipTimer); followTipTimer = null; }
    followTipTarget = null;
    if (followTip) followTip.style.display = 'none';
  }
  function ensureFollowTip() {
    if (!followTip) {
      followTip = document.createElement('div');
      followTip.className = 'toolbar-follow-tip';
      followTip.setAttribute('role', 'tooltip');
    }
    if (followTip.parentNode !== document.body) document.body.appendChild(followTip);
    return followTip;
  }
  function placeFollowTip(x, y) {
    const tip = ensureFollowTip();
    const gap = 14, edge = 8;
    tip.style.visibility = 'hidden';
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + gap, top = y + gap;
    if (left + w > window.innerWidth - edge) left = x - gap - w;
    if (top + h > window.innerHeight - edge) top = y - gap - h;
    if (left < edge) left = edge;
    if (top < edge) top = edge;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.visibility = 'visible';
  }
  function bindFollowTip(btn) {
    if (!btn || btn.dataset.tipBound === '1') return;
    btn.dataset.tipBound = '1';
    btn.addEventListener('mouseenter', (e) => {
      if (followTipTimer) { clearTimeout(followTipTimer); followTipTimer = null; }
      followTipTarget = btn;
      followTipX = e.clientX;
      followTipY = e.clientY;
      const tip = ensureFollowTip();
      tip.textContent = (btn.getAttribute('data-tip') || '').trim();
      tip.style.display = 'none';
      followTipTimer = setTimeout(() => {
        followTipTimer = null;
        if (followTipTarget !== btn || !btn.isConnected) return;
        placeFollowTip(followTipX, followTipY);
      }, 1000);
    });
    btn.addEventListener('mousemove', (e) => {
      if (followTipTarget !== btn) return;
      followTipX = e.clientX;
      followTipY = e.clientY;
      if (followTip && followTip.style.display === 'block' && !followTipTimer) {
        placeFollowTip(followTipX, followTipY);
      }
    });
    btn.addEventListener('mouseleave', () => {
      if (followTipTarget === btn) dismissFollowTip();
    });
  }

  function bindMineMapOnce() {
    if (mineMapBound) return;
    mineMapBound = true;
    const zoomSlider = $('mine-map-zoom');
    if (zoomSlider) {
      syncMineMapZoomSlider(getSavedMineMapZoom());
      const onZoomInput = () => {
        const z = clampMineMapZoom(zoomSlider.value);
        saveMineMapZoom(z);
        if (mineMapInstance) applyMineMapZoom(mineMapInstance, z);
      };
      zoomSlider.addEventListener('input', onZoomInput);
      zoomSlider.addEventListener('change', onZoomInput);
    }
    const bulkRenameBtn = $('mine-map-bulk-rename-btn');
    if (bulkRenameBtn) {
      bulkRenameBtn.addEventListener('click', e => {
        e.preventDefault();
        toggleBulkRenameFromButton();
      });
      bindFollowTip(bulkRenameBtn);
    }
    bindBulkRenameLayerOnce();
    const bulkRenameX = $('mine-map-bulk-rename-x');
    if (bulkRenameX) bulkRenameX.addEventListener('click', e => { e.preventDefault(); exitBulkRenameMode(); });
    const bulkRenameApply = $('mine-map-bulk-rename-apply');
    if (bulkRenameApply) bulkRenameApply.addEventListener('click', e => { e.preventDefault(); applyBulkRename(); });
    const bulkRenameInput = $('mine-map-bulk-rename-input');
    if (bulkRenameInput) {
      bulkRenameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          applyBulkRename();
        }
      });
    }
    const buildingsBtn = $('mine-map-buildings');
    if (buildingsBtn) {
      buildingsBtn.addEventListener('click', e => {
        e.preventDefault();
        setMineMapBuildings(!mineMapBuildingsOn);
      });
      bindFollowTip(buildingsBtn);
    }
    const labelsBtn = $('mine-map-labels');
    if (labelsBtn) {
      labelsBtn.addEventListener('click', e => {
        e.preventDefault();
        setMineMapLabels(!mineMapLabelsOn);
      });
      bindFollowTip(labelsBtn);
    }
    const reachBtn = $('mine-map-reach');
    if (reachBtn) {
      reachBtn.addEventListener('click', e => {
        e.preventDefault();
        setMineMapReach(!mineMapReachOn);
      });
      bindFollowTip(reachBtn);
    }
    if (!mineMapResizeBound) {
      mineMapResizeBound = true;
      window.addEventListener('resize', () => {
        if (mineMapInstance) {
          try { google.maps.event.trigger(mineMapInstance, 'resize'); } catch (e) {}
        }
      });
    }
  }

  async function loadAllMinesOntoMap(uid) {
    bindMineMapOnce();
    syncMineMapZoomSlider(getSavedMineMapZoom());
    mineMapBuildingsOn = getSavedMineMapBuildings();
    updateMineMapBuildingsBtn();
    updateMineMapLabelsBtn();
    updateMineMapReachBtn();
    mineMapReachReady = false;
    clearMineMapReachLayer();
    showMineMapMsg('Loading map…', false);

    await loadGoogleMapsApi();
    const map = ensureMineMap();
    try { google.maps.event.trigger(map, 'resize'); } catch (e) {}

    const snap = await db.collection('properties').where('ownerId', '==', uid).get();
    const mines = snap.docs.map(d => ({ id: d.id, ...d.data(), _details: {} }));
    allMines = mines;
    const total = mines.length;
    newestMine = null;
    newestMineMs = null;
    didInitialCenter = false;
    clearMineMapAreaOverlays();

    if (!total) {
      updateLoadingOverlay(0, 0);
      mineMapReachReady = true;
      if (mineMapReachOn) drawMineMapReach();
      showMineMapMsg('You have no mines yet.', false);
      return;
    }

    updateLoadingOverlay(0, total);
    $('full-map-loading').hidden = false;

    let loaded = 0;
    for (let i = 0; i < mines.length; i += DETAILS_FETCH) {
      const slice = mines.slice(i, i + DETAILS_FETCH);
      const snaps = await Promise.all(
        slice.map(p => db.collection('propertyDetails').doc(p.id).get().catch(() => null))
      );
      snaps.forEach((s, j) => {
        slice[j]._details = (s && s.exists) ? (s.data() || {}) : {};
      });
      for (let j = 0; j < slice.length; j++) {
        const mine = slice[j];
        considerNewestMine(mine);
        drawMineIfNeeded(map, mine);
      }
      loaded = Math.min(i + DETAILS_FETCH, total);
      updateLoadingOverlay(loaded, total);

      if (!didInitialCenter && newestMine) {
        if (centerOnMine(newestMine)) didInitialCenter = true;
      }
      // Yield to UI between batches for large inventories
      await new Promise(r => setTimeout(r, 0));
    }

    // Fallback newest: any mine with location if none had createdAt
    if (!newestMine) {
      for (let i = 0; i < mines.length; i++) {
        if (findCorners(mines[i]) || mineMapCenterGps(mines[i])) {
          newestMine = mines[i];
          break;
        }
      }
    }
    if (newestMine) {
      centerOnMine(newestMine);
      const title = $('mine-map-title');
      if (title) title.textContent = 'Map · newest: ' + (titleOf(newestMine) || newestMine.id);
    }
    updateLoadingOverlay(total, total);
    const loading = $('full-map-loading');
    if (loading) loading.hidden = true;
    mineMapReachReady = true;
    if (mineMapReachOn) drawMineMapReach();
    showMineMapMsg(
      'Loaded ' + total.toLocaleString('en-US') + ' propert'
        + (total === 1 ? 'y' : 'ies') + '.',
      false
    );
  }

  async function loadHeader(user) {
    const uSnap = await db.collection('users').doc(user.uid).get();
    const ud = uSnap.data() || {};
    const nick = ud.nickname || user.displayName || (user.email && user.email.split('@')[0]) || 'Miner';
    $('nav-nickname').textContent = nick;
    $('sb-tb').textContent = fmtTBBalance(ud.tbBalance || 0);
    $('sb-usd').textContent = fmtUSDBalance(ud.usdEarnings || 0);
    const avatarUrl = ud.avatarUrl || user.photoURL || null;
    if (avatarUrl && String(avatarUrl).startsWith('https://')) {
      $('nav-avatar').innerHTML = '<img src="' + avatarUrl.replace(/"/g, '&quot;') + '" alt="">';
    } else {
      $('nav-avatar').textContent = initials(nick);
    }
  }

  async function loadPortal(user) {
    try {
      await loadHeader(user);
      await loadAllMinesOntoMap(user.uid);
    } catch (e) {
      console.error('[full-map]', e);
      showMineMapMsg('Could not load map. ' + (e && e.message ? e.message : ''), false);
      const loading = $('full-map-loading');
      if (loading) loading.hidden = true;
    }
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      try { sessionStorage.setItem('tmPortalAuthed', '1'); } catch (e) {}
      document.body.classList.remove('auth-pending');
      $('login-screen').style.display = 'none';
      $('portal').style.display = 'flex';
      loadPortal(user);
    } else {
      try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
      document.documentElement.classList.remove('tm-expect-auth');
      document.body.classList.remove('auth-pending');
      $('login-screen').style.display = 'flex';
      $('portal').style.display = 'none';
    }
  });
  $('btn-google-signin').addEventListener('click', async () => {
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-email-signin').addEventListener('click', async () => {
    const email = $('input-email').value.trim(), pass = $('input-password').value;
    $('login-error').textContent = '';
    if (!email || !pass) { $('login-error').textContent = 'Enter email and password.'; return; }
    $('btn-email-signin').disabled = true;
    try { await auth.signInWithEmailAndPassword(email, pass); }
    catch (e) {
      $('login-error').textContent = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
        ? 'Incorrect email or password.' : e.message;
    } finally { $('btn-email-signin').disabled = false; }
  });
  $('input-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btn-email-signin').click();
  });
  $('btn-reset').addEventListener('click', async () => {
    const email = $('input-email').value.trim();
    if (!email) { $('login-error').textContent = 'Enter your email first.'; return; }
    try {
      await auth.sendPasswordResetEmail(email);
      $('login-error').style.color = '#66BB6A';
      $('login-error').textContent = 'Reset email sent!';
    } catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-signout').addEventListener('click', () => {
    try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
    document.documentElement.classList.remove('tm-expect-auth');
    auth.signOut();
  });
  (function initAccountMenu() {
    var toggle = document.getElementById('nav-account-toggle');
    var dropdown = document.getElementById('nav-account-dropdown');
    var wrap = document.querySelector('.nav-account');
    if (!toggle || !dropdown) return;
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var willOpen = dropdown.hasAttribute('hidden');
      if (willOpen) dropdown.removeAttribute('hidden');
      else dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!wrap || wrap.contains(e.target)) return;
      dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();
</script>
