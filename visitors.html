<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
    <script>
  (function () {
    try {
      if (sessionStorage.getItem('tmPortalAuthed') === '1') {
        document.documentElement.classList.add('tm-expect-auth');
      }
    } catch (e) {}
  })();
  </script>
  <style>
    html.tm-expect-auth #login-screen { display: none !important; }
    html.tm-expect-auth #portal {
      display: flex !important;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    html.tm-expect-auth body.auth-pending #portal { visibility: visible; }
    html.tm-expect-auth body.auth-pending #login-screen { visibility: hidden; display: none !important; }
  </style>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Visitors — TerraMine</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #e8d5b7; --brown-dark: #5C3317; --brown: #8B4513; --brown-mid: #8B7355;
      --gold: #FFD700; --white: #ffffff; --off-white: #f5f5f5; --text-dark: #333333;
      --text-mid: #666666; --text-light: #999999; --red: #f44336; --navy: #0D1B2A;
      --navy2: #111F30; --cyan: #4FC3F7; --border: rgba(255,255,255,0.07);
      --navy3: #16263A;
      --muted: #556070;
      --gray: #8899AA;
      --surface: rgba(255,255,255,0.04);
    }
    html, body { height:100%; margin:0;   font-family: 'DM Sans', sans-serif; }
    body {
      position: relative;
      background-color: #0D1B2A; /* fallback while layers load */
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Full-viewport background layers (image + frost overlay) */
    .portalbackground,
    .backgroundoverlaycolor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .portalbackground {
      z-index: 0;
      background-image: url('/images/terratown-bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-size: cover;
    }
    .backgroundoverlaycolor {
      z-index: 1;
      background: rgba(238, 241, 244, 0.7); /* #eef1f4 @ 70% */
    }
    /* Portal chrome / content above the layers (top-nav keeps its own higher z-index later) */
    #login-screen,
    #portal,
    .layout,
    .main,
    .content {
      position: relative;
      z-index: 2;
    }

    body.auth-pending #login-screen, body.auth-pending #portal { visibility: hidden; }
        /* ═══════════════════════════════════════════
       TOP NAV (portal shell — no left sidebar)
    ═══════════════════════════════════════════ */
    .top-nav {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 5px 20px;
      height: 80px;
      box-sizing: border-box;
      background: rgba(13,27,42,0.97);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
      line-height: 0;
    }
    .nav-logo img { display:block; height:60px; width:auto; }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      font-size: 18px;
      font-weight: 500;
      color: #8899AA;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-links a.active {
      color: var(--cyan);
      background: rgba(79,195,247,0.12);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .nav-account {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-account-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 4px 6px 4px 4px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .nav-account-link:hover { background: rgba(255,255,255,0.06); }
    .nav-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--navy3, #16263A);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size:18px;
      font-weight: 700;
      color: var(--cyan);
      overflow: hidden;
      flex-shrink: 0;
    }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-nickname {
      font-size: 18px;
      color: #8899AA;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-account-toggle {
      background: none;
      border: none;
      color: #8899AA;
      cursor: pointer;
      padding: 6px 4px;
      font-size: 11px;
      line-height: 1;
      border-radius: 4px;
    }
    .nav-account-toggle:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-account-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 140px;
      background: #111F30;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 200;
    }
    .nav-account-dropdown[hidden] { display: none !important; }
    .nav-signout {
      display: block;
      width: 100%;
      text-align: left;
      font-size: 18px;
      color: #8899AA;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .nav-signout:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 10px 0 8px;
      background: #0D1B2A;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      white-space: nowrap;
    }
    .nav-pill-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .nav-pill-usd-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: rgba(245,158,11,0.18);
      color: #F59E0B;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }
    .nav-pill-value {
      font-size: 18px;
      font-weight: 700;
      color: #EEF1F4;
      font-variant-numeric: tabular-nums;
    }
    .nav-pill-usd .nav-pill-value { color: #FBBF24; }
    .nav-pill-tb .nav-pill-value { color: #4FC3F7; }

    .layout { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; width:100%; }
    .layout > .content {
      width: 100%;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .nav-nickname { display: none; }
      .nav-links a { padding: 6px 10px; font-size: 15px; }
    }
    @media (max-width: 700px) {
      .top-nav { padding: 0 12px; gap: 8px; }
      .nav-links { justify-content: flex-start; }
      .nav-pill { padding: 0 8px 0 6px; }
      .nav-pill-value { font-size: 15px; }
    }

    .main { flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; background:transparent; position:relative; -webkit-overflow-scrolling:touch; }
    #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:transparent; padding:24px; }
    .login-card { width:100%; max-width:380px; background:var(--navy2, #111F30); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:12px; padding:36px 32px; }
    .login-logo { margin:0 auto 10px; text-align:center; }
    .login-logo img { display:block; margin:0 auto; height:60px; width:auto; max-width:100%; }
    .login-sub { font-size:13px; color:var(--muted, #556070); margin-bottom:28px; text-align:center; }
    .input-group { margin-bottom:14px; }
    .input-label { font-size:11px; color:var(--gray, #8899AA); margin-bottom:5px; display:block; letter-spacing:0.5px; }
    .input-field { width:100%; background:var(--navy, #0D1B2A); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:6px; padding:10px 12px; font-size:14px; color:var(--white, #F0F4FF); font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.15s; }
    .input-field:focus { border-color:var(--cyan, #4FC3F7); }
    .input-field::placeholder { color:var(--muted, #556070); }
    .btn-primary { width:100%; padding:11px; background:var(--cyan, #4FC3F7); color:var(--navy, #0D1B2A); border:none; border-radius:6px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1.5px; cursor:pointer; margin-top:4px; transition:opacity 0.15s; }
    .btn-primary:hover { opacity:0.88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-google { width:100%; padding:10px; background:var(--surface, rgba(255,255,255,0.04)); color:var(--white, #F0F4FF); border:1px solid var(--border, rgba(255,255,255,0.07)); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.15s, background 0.15s; }
    .btn-google:hover { border-color:var(--gray, #8899AA); background:var(--navy3, #16263A); }
    .login-divider { display:flex; align-items:center; gap:12px; margin:20px 0; font-size:11px; color:var(--muted, #556070); }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:var(--border, rgba(255,255,255,0.07)); }
    .login-error { font-size:12px; color:var(--red, #EF5350); margin-top:8px; min-height:16px; }
    .login-toggle { text-align:center; font-size:12px; color:var(--muted, #556070); margin-top:16px; }
    .login-toggle a { color:var(--cyan, #4FC3F7); text-decoration:none; cursor:pointer; }

    /* Filter bar — match mines.html mine-toolbar */
    .mine-toolbar { position:sticky; top:0; z-index:40; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; background:#fff; border-bottom:1px solid #e3e7ee; box-shadow:0 2px 8px rgba(13,27,42,.08); }
    .tool-field { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#334155; }
    .tool-field select, .tool-search {
      font: 500 13px 'DM Sans', sans-serif; color:#0D1B2A; background:#fff;
      border:1px solid #d0d5dc; border-radius:999px; padding:7px 12px; outline:none;
    }
    .tool-field select:focus, .tool-search:focus { border-color:var(--cyan); }
    .sort-btn {
      font: 700 12px 'DM Sans', sans-serif; color:#243044; background:#fff;
      border:1px solid #d0d5dc; border-radius:999px; padding:7px 12px; cursor:pointer;
    }
    .sort-btn.active { border-color:#4FC3F7; background:#e8f7fe; }
    .sort-btn:disabled, .tool-field select:disabled, .tool-search:disabled, .type-filter-btn:disabled { opacity:.55; cursor:not-allowed; }
    .type-filter { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .type-filter-btn {
      width:34px; height:34px; padding:3px; box-sizing:border-box;
      display:flex; align-items:center; justify-content:center;
      border:2px solid #d0d5dc; border-radius:10px; background:#fff;
      cursor:pointer; transition:border-color .15s, background .15s;
    }
    .type-filter-btn img { width:24px; height:24px; object-fit:contain; display:block; pointer-events:none; }
    .type-filter-btn.active { border-color:#4FC3F7; background:#e8f7fe; }
    .type-filter-btn:focus-visible { outline:2px solid #4FC3F7; outline-offset:2px; }
    .tool-search { flex:1; min-width:160px; }
    .mine-count { margin-left:auto; font-size:12px; color:#64748b; font-weight:600; white-space:nowrap; }
    .visitors-note { font-size:11px; color:#64748b; font-weight:600; }
    .visitors-status { padding:8px 16px 0; font-size:13px; color:#64748b; min-height:0; }
    .visitors-board-wrap { padding:14px 16px 40px; background:transparent; }
    .visitors-grid {
      display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; align-content:start;
    }
    @media (max-width:1100px) { .visitors-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    @media (max-width:640px) { .visitors-grid { grid-template-columns:1fr; } }

    /* vo-card — ported from mines.html Mine Visitors overlay */
    .vo-card { background:#1a2330; border:1px solid rgba(255,255,255,.22); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
    .vo-card:hover { border-color:rgba(255,255,255,.45); }
    .vo-card-header { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#133665; border-bottom:1px solid rgba(255,255,255,.18); }
    .vo-avatar {
      width:72px; height:72px; border-radius:8px; background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:700; color:#c5ced8; flex-shrink:0; overflow:hidden;
    }
    .vo-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .vo-info { flex:1; min-width:0; }
    .vo-name { font-size:22px; font-weight:700; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .vo-time { font-size:17px; color:rgba(255,255,255,.9); margin-top:2px; line-height:1.15; }
    .vo-mine-meta { display:flex; align-items:center; gap:6px; flex-shrink:0; max-width:48%; }
    .vo-mine-badge { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:30px; font-size:12px; font-weight:700; background:rgba(0,0,0,.22); color:#fff; border:1px solid rgba(255,255,255,.28); min-width:0; cursor:pointer; }
    .vo-mine-badge:hover { background:rgba(0,0,0,.35); border-color:rgba(255,255,255,.45); }
    .vo-mine-badge span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
    .vo-mine-badge .vo-type-icon { pointer-events:none; }
    .vo-type-icon { width:24px; height:24px; flex-shrink:0; object-fit:contain; }
    .vo-pin { width:33px; height:33px; color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; text-decoration:none; border:0; background:transparent; padding:0; margin:0; cursor:pointer; font:inherit; }
    .vo-pin svg { width:33px; height:33px; display:block; pointer-events:none; }
    .vo-pin.is-missing { opacity:0.38; pointer-events:none; cursor:default; }
    .vo-card-body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; background:white; }
    .vo-photo { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; border:1px solid #e0d0c0; background:#f0e6d8; cursor:default; }
    .vo-photo-empty { width:100%; aspect-ratio:4/3; border-radius:8px; border:1px dashed #d2c0a8; background:#faf6f0; display:flex; align-items:center; justify-content:center; color:var(--text-light); font-size:12px; font-style:italic; }
    .vo-photo-wrap { position:relative; width:100%; }
    .vo-photo-wrap > .vo-photo { display:block; width:100%; }
    .vo-showcase-pin {
      position:absolute; top:8px; right:8px; z-index:3;
      width:34px; height:34px; padding:0; margin:0;
      border:1px solid #fff; border-radius:8px;
      background:transparent; color:#fff;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25);
      line-height:0;
    }
    .vo-showcase-pin:hover { background:rgba(255,255,255,.12); }
    .vo-showcase-pin:focus-visible { outline:2px solid #3d8bfd; outline-offset:2px; }
    .vo-showcase-pin.is-active {
      background:#2ea043;
      border-color:#fff;
      color:#fff;
    }
    .vo-showcase-pin.is-active:hover { background:#2ea043; }
    .vo-showcase-pin svg { width:18px; height:18px; display:block; pointer-events:none; }
    .vo-showcase-tip, .vo-mine-tip {
      position:fixed; z-index:600; pointer-events:none; display:none;
      background:#1b2430; color:#fff; border:1px solid rgba(255,255,255,.22);
      border-radius:8px; padding:8px 10px; box-shadow:0 12px 28px rgba(6,10,16,.55);
      font-size:13px; line-height:1.35; font-weight:500; text-align:left;
      max-width:min(280px, calc(100vw - 16px));
    }
    .vo-showcase-flash {
      position:fixed; z-index:350; pointer-events:none; display:none;
      left:50%; transform:translateX(-50%);
      background:#8B1E1E; color:#fff; border:1px solid rgba(255,255,255,.22);
      border-radius:8px; padding:8px 12px; box-shadow:0 12px 28px rgba(6,10,16,.55);
      font-size:13px; font-weight:600; max-width:min(420px, calc(100vw - 24px));
      text-align:center;
    }
    .vo-message { font-size:20px; color:var(--text-dark); font-style:italic; line-height:1.45; }
    .vo-message::before { content:'"'; }
    .vo-message::after { content:'"'; }
    .vo-no-message { font-size:12px; color:var(--text-light); font-style:italic; }

    .vo-owner-reply {
      margin-top: 10px;
      padding: 10px 12px 12px;
      background: #e3f2fd;
      border-left: 3px solid #42a5f5;
      border-radius: 0 8px 8px 0;
      text-align: left;
    }
    .vo-owner-reply-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1e88e5;
      margin-bottom: 6px;
    }
    .vo-owner-reply-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .vo-owner-reply-text {
      font-size: 14px;
      color: var(--text-dark);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .vo-empty, .vo-loading { text-align:center; padding:48px 16px; color:#64748b; font-size:14px; }
    .vo-loading .skeleton {
      height:14px; width:160px; margin:0 auto; border-radius:4px;
      background:linear-gradient(90deg,#d0d5dc 25%,#e8ebf0 50%,#d0d5dc 75%); background-size:200% 100%;
      animation:vo-shimmer 1.4s infinite;
    }
    @keyframes vo-shimmer { to { background-position:-200% 0; } }
    .vo-img-tip {
      position:fixed; z-index:320; pointer-events:none; display:none;
      background:#1b2430; color:#fff; border:1px solid rgba(255,255,255,.22);
      border-radius:8px; padding:6px; box-shadow:0 12px 28px rgba(6,10,16,.55);
      max-width:calc(100vw - 16px);
    }
    .vo-img-tip img {
      display:block; max-width:min(630px, 90vmin, calc(100vw - 24px));
      max-height:min(90vmin, calc(100vh - 24px));
      width:auto; height:auto; object-fit:contain; border-radius:4px;
      background:#0d1b2a;
    }
    .vo-detail-overlay {
      position:fixed; z-index:280;
      display:flex; align-items:center; justify-content:center;
      background:rgba(13,27,42,0.78);
      box-sizing:border-box; padding:12px;
    }
    .vo-detail-overlay[hidden] { display:none !important; }
    .vo-detail-panel {
      position:relative; width:min(440px, 100%); max-height:100%;
      overflow:auto; background:#eef1f4; color:#fff;
      border:1px solid rgba(255,255,255,.22); border-radius:14px;
      box-shadow:0 12px 28px rgba(6,10,16,.55);
    }
    .vo-detail-close {
      position:absolute; top:10px; right:12px; z-index:2;
      width:36px; height:36px; border:0; border-radius:999px;
      background:rgba(255,255,255,0.12); color:#fff;
      font:700 22px/1 'DM Sans',sans-serif; cursor:pointer;
    }
    .vo-detail-close:hover { background:rgba(255,255,255,0.22); }
    .vo-detail-panel .vo-card { border-radius:0; border:0; }
    .vo-detail-panel .vo-card-header { padding-right:52px; }
    .vo-detail-panel .vo-photo {
      aspect-ratio:auto; max-height:min(60vh, 520px); object-fit:contain;
      background:#0d1b2a; cursor:default;
    }
    .vo-detail-panel .vo-avatar { cursor:default; }

    /* ── Mine GPS minimap overlay ── */
    .mine-map-overlay {
      position:fixed !important; z-index:500;
      display:flex; flex-direction:column;
      background:rgba(13,27,42,0.78);
      box-sizing:border-box;
    }
    .mine-map-overlay[hidden] { display:none !important; }
    .mine-map-panel {
      position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
      margin:12px; background:#eef1f4; color:#fff;
      border:1px solid rgba(255,255,255,.22); border-radius:14px;

    const right = Math.max(x1, x2);

    if (right - left < 4 || bottom - top < 4) return null;

      'ownerReply', 'ownerReplyText', 'ownerReplyMessage', 'replyText', 'replyMessage',
      'reply', 'propertyOwnerReply', 'ownerResponse', 'responseText', 'answer'
    ];
    function fromVal(val) {
      if (typeof val === 'string' && val.trim()) return val.trim();
      if (val && typeof val === 'object') {
        for (const k of ['text', 'message', 'body', 'content', 'reply']) {
          if (typeof val[k] === 'string' && val[k].trim()) return val[k].trim();
        }
      }
      return '';
    }
    for (const k of prefer) {
      if (!(k in v)) continue;
      const t = fromVal(v[k]);
      if (t) return t;
    }
    for (const k of Object.keys(v)) {
      if (!/reply|response|answer/i.test(k)) continue;
      if (/moderation|admin|report|count|At$|By$|Id$/i.test(k)) continue;
      const t = fromVal(v[k]);
      if (t) return t;
    }
    return '';
  }
  function ownerReplyHtml(v) {
    const t = ownerReplyText(v);
    if (!t) return '';
    return '<div class="vo-owner-reply">'
      + '<div class="vo-owner-reply-label">'
      + '<svg class="vo-owner-reply-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>'
      + '<span>Your reply</span></div>'
      + '<div class="vo-owner-reply-text">' + escapeHtml(t) + '</div>'
      + '</div>';
  }

  function renderVisitCard(v, mine) {
    const name = visitorName(v);
    const safeName = escapeHtml(name);
    const init = initials(name);
    const uid = visitorUid(v);
    const avatar = visitorAvatarUrl(v);
    const avatarInner = avatar
      ? '<img src="' + escapeHtml(avatar) + '" alt="" loading="lazy" onerror="var p=this.parentNode;if(p)p.textContent=p.getAttribute(\'data-initials\')||\'?\';">'
      : escapeHtml(init);
    const avatarAttrs = (uid ? ' data-uid="' + escapeHtml(uid) + '"' : '')
      + (v.id ? ' data-checkin-id="' + escapeHtml(v.id) + '"' : '')
      + ' data-initials="' + escapeHtml(init) + '"';
    const type = typeKeyOf(mine, v);
    const mineName = mineTitle(mine, v);
    const iconSrc = ICONS[type] || ICONS.rock;
    const pinHtml = voMapPinHtml(mine, v && v.propertyId);
    const photo = visitorCheckInPhoto(v);
    const photoHtml = wrapVisitorPhotoHtml(mine, photo, v.id);
    const msg = (typeof v.message === 'string' && v.message.trim()) ? v.message.trim() : '';
    const msgHtml = msg
      ? '<div class="vo-message">' + escapeHtml(msg) + '</div>'
      : '<div class="vo-no-message">No message left</div>';
    const mineId = (mine && mine.id != null) ? String(mine.id)
      : (v && v.propertyId != null ? String(v.propertyId) : '');
    let mineBadgeAttrs = '';
    if (mineId) {
      mineBadgeAttrs = ' data-mine-id="' + escapeHtml(mineId) + '"'
        + ' data-mine-name="' + escapeHtml(mineName) + '"'
        + ' role="link" tabindex="0"';
    }
    return '<article class="vo-card">'
      + '<div class="vo-card-header">'
      + '<div class="vo-avatar"' + avatarAttrs + '>' + avatarInner + '</div>'
      + '<div class="vo-info"><div class="vo-name" title="' + safeName + '">' + safeName + '</div>'
      + '<div class="vo-time" title="' + escapeHtml(visitorFullDate(v.timestamp)) + '">' + escapeHtml(visitorTimeAgo(v.timestamp)) + '</div></div>'
      + '<div class="vo-mine-meta">'
      + '<div class="vo-mine-badge"' + mineBadgeAttrs + ' data-tip="' + escapeHtml(mineName) + ' — Open in My Mines" aria-label="' + escapeHtml(mineName) + ' — Open in My Mines">'
      + '<img class="vo-type-icon" src="' + escapeHtml(iconSrc) + '" alt="">'
      + '<span>' + escapeHtml(mineName) + '</span></div>'
      + pinHtml
      + '</div></div>'
      + '<div class="vo-card-body">' + photoHtml + msgHtml + ownerReplyHtml(v) + '</div>'
      + '</article>';
  }

  function filteredSortedVisits() {
    const q = (($('filter-search') || {}).value || '').trim().toLowerCase();
    let list = allVisits.slice();
    if (selectedTypes.size > 0) {
      list = list.filter(v => selectedTypes.has(typeKeyOf(mineMap[v.propertyId], v)));
    }
    if (q) {
      list = list.filter(v => {
        const name = visitorName(v).toLowerCase();
        const mine = mineTitle(mineMap[v.propertyId], v).toLowerCase();
        const msg = (v.message || '').toLowerCase();
        const reply = ownerReplyText(v).toLowerCase();
        return name.includes(q) || mine.includes(q) || msg.includes(q) || reply.includes(q);
      });
    }
    if (sortKey === 'replies') {
      list = list.filter(v => !!ownerReplyText(v));
    }
    const dir = sortDir;
    list.sort((a, b) => {
      const ma = mineMap[a.propertyId] || {};
      const mb = mineMap[b.propertyId] || {};
      if (sortKey === 'mine') {
        return cmpStr(mineTitle(ma, a), mineTitle(mb, b), dir);
      }
      if (sortKey === 'visitor') {
        return cmpStr(visitorName(a), visitorName(b), dir);
      }
      if (sortKey === 'replies') {
        return cmpStr(ownerReplyText(a), ownerReplyText(b), dir);
      }
      // date (default): dir>0 newest first
      const tA = visitorTsMillis(a.timestamp);
      const tB = visitorTsMillis(b.timestamp);
      return (tB - tA) * (dir > 0 ? 1 : -1);
    });
    return list;
  }

  function renderFromFilters() {
    updateSortButtons();
    const list = filteredSortedVisits();
    const countEl = $('match-count');
    if (countEl) countEl.textContent = list.length + ' match' + (list.length === 1 ? '' : 'es');
    const note = $('visitors-note');
    if (note) note.hidden = !visitsTruncated;
    const board = $('visitors-board');
    if (!list.length) {
      board.innerHTML = '<div class="vo-empty">No check-ins match your filters.</div>';
      return;
    }
    board.innerHTML = '<div class="visitors-grid">' + list.map(v => renderVisitCard(v, mineMap[v.propertyId] || null)).join('') + '</div>';
    ensureVisitorAvatars(list);
    bindVisitorPhotoTips();
    bindShowcasePinTips(board);
    bindShowcasePinClicksOnce();
    bindMineBadgeClicksOnce();
  }

  function buildMineMapEntry(m, details) {
    const d = details || {};
    const custom = (typeof d.customName === 'string' && d.customName.trim()) ? d.customName.trim() : '';
    // Keep full property doc on _raw (includes corners) for minimap lookup.
    const raw = Object.assign({}, m);
    delete raw._details;
    return {
      id: m.id,
      mineType: m.mineType || 'rock',
      customName: custom || null,
      _raw: raw,
      _details: d,
      _detailsLoaded: details != null
    };
  }

  function applyDetailsToMineMap(mineId, details) {
    const entry = mineMap[mineId];
    if (!entry) return;
    const d = details || {};
    entry._details = d;
    entry._detailsLoaded = true;
    const custom = (typeof d.customName === 'string' && d.customName.trim()) ? d.customName.trim() : '';
    entry.customName = custom || null;
  }

  async function fetchPropertyDetailsForIds(ids, onProgress) {
    const list = (ids || []).map(String).filter(Boolean);
    for (let i = 0; i < list.length; i += DETAILS_FETCH) {
      const slice = list.slice(i, i + DETAILS_FETCH);
      const snaps = await Promise.all(slice.map(id =>
        db.collection('propertyDetails').doc(id).get().catch(() => null)
      ));
      snaps.forEach((s, j) => {
        applyDetailsToMineMap(slice[j], (s && s.exists) ? (s.data() || {}) : {});
      });
      if (onProgress) onProgress(Math.min(i + DETAILS_FETCH, list.length), list.length);
    }
  }

  async function loadOwnedMinesSkeleton(uid) {
    const snap = await db.collection('properties').where('ownerId', '==', uid).get();
    const mines = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const map = {};
    mines.forEach(m => { map[m.id] = buildMineMapEntry(m, null); });
    mineMap = map;
    return mines;
  }

  function visitMineIdsNeedingDetails(visits) {
    const out = [];
    const seen = Object.create(null);
    (visits || []).forEach(v => {
      const id = v && v.propertyId != null ? String(v.propertyId) : '';
      if (!id || seen[id] || !mineMap[id] || mineMap[id]._detailsLoaded) return;
      seen[id] = 1;
      out.push(id);
    });
    return out;
  }

  async function ensureDetailsForVisits(visits, onProgress) {
    const ids = visitMineIdsNeedingDetails(visits);
    if (!ids.length) return;
    await fetchPropertyDetailsForIds(ids, onProgress);
  }

  /**
   * One page of checkIns (newest first). Pass startAfterDoc for the next page.
   * No total cap - caller keeps paging until hasMore is false.
   */
  async function loadVisitsPage(uid, startAfterDoc) {
    let q = db.collection('checkIns')
      .where('propertyOwnerId', '==', uid)
      .orderBy('timestamp', 'desc')
      .limit(VISIT_PAGE);
    if (startAfterDoc) q = q.startAfter(startAfterDoc);
    const snap = await q.get();
    const visits = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }));
    const lastDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
    const hasMore = snap.size >= VISIT_PAGE;
    return { visits, lastDoc, hasMore };
  }

  async function loadPortal(user) {
    const loadId = ++visitorsLoadId;
    setToolbar(false);
    setStatus('Loading\u2026');
    $('visitors-board').innerHTML = '<div class="vo-loading"><div class="skeleton"></div></div>';
    $('match-count').textContent = '';
    visitsTruncated = false;
    visitsLastDoc = null;
    allVisits = [];
    try {
      const uSnap = await db.collection('users').doc(user.uid).get();
      if (loadId !== visitorsLoadId) return;
      const ud = uSnap.data() || {};
      const nick = ud.nickname || user.displayName || user.email?.split('@')[0] || 'Miner';
      $('nav-nickname').textContent = nick;
      $('sb-tb').textContent = fmtTBBalance(ud.tbBalance || 0);
      $('sb-usd').textContent = fmtUSDBalance(ud.usdEarnings || 0);
      const avatarUrl = ud.avatarUrl || user.photoURL || '';
      if (typeof avatarUrl === 'string' && avatarUrl.startsWith('https://')) {
        $('nav-avatar').innerHTML = '<img src="' + escapeHtml(avatarUrl) + '" alt="' + escapeHtml(nick) + '">';
      } else {
        $('nav-avatar').textContent = initials(nick);
      }

      setStatus('Loading mines and visitors\u2026');
      const [mines, firstPage] = await Promise.all([
        loadOwnedMinesSkeleton(user.uid),
        loadVisitsPage(user.uid, null)
      ]);
      if (loadId !== visitorsLoadId) return;

      allVisits = firstPage.visits;
      visitsLastDoc = firstPage.lastDoc;
      visitsTruncated = firstPage.hasMore;

      if (allVisits.length) {
        setStatus('Loading names for visited mines\u2026');
        await ensureDetailsForVisits(allVisits, (done, total) => {
          if (loadId !== visitorsLoadId) return;
          setStatus('Loading visited mine details ' + done + ' / ' + total + '\u2026');
        });
        if (loadId !== visitorsLoadId) return;
      }

      loadedUid = user.uid;
      setToolbar(true);
      sortKey = 'date';
      sortDir = 1;
      renderFromFilters();

      const n0 = allVisits.length;
      if (!n0 && !firstPage.hasMore) {
        setStatus('No visitors yet \u2014 share your mine coordinates!');
      } else {
        setStatus(firstPage.hasMore
          ? ('Showing ' + n0 + ' check-ins \u2014 loading more\u2026')
          : '');
      }

      (async function continueProgressiveLoad() {
        // 1) Page remaining check-ins (no hard total cap)
        let cursor = firstPage.hasMore ? firstPage.lastDoc : null;
        while (cursor && loadId === visitorsLoadId) {
          const page = await loadVisitsPage(user.uid, cursor);
          if (loadId !== visitorsLoadId) return;
          if (page.visits.length) {
            allVisits = allVisits.concat(page.visits);
            await ensureDetailsForVisits(page.visits, null);
            if (loadId !== visitorsLoadId) return;
            renderFromFilters();
          }
          visitsLastDoc = page.lastDoc;
          visitsTruncated = page.hasMore;
          cursor = page.hasMore ? page.lastDoc : null;
          setStatus(cursor
            ? ('Showing ' + allVisits.length + ' check-ins \u2014 loading more\u2026')
            : ('Loaded ' + allVisits.length + ' check-ins \u2014 finishing mine details\u2026'));
        }
        if (loadId !== visitorsLoadId) return;
        visitsTruncated = false;
        renderFromFilters();

        // 2) Remaining owned-mine details (map / bulk rename)
        const remaining = mines.map(m => m.id).filter(id => mineMap[id] && !mineMap[id]._detailsLoaded);
        if (!remaining.length) {
          setStatus(allVisits.length ? '' : 'No visitors yet \u2014 share your mine coordinates!');
          return;
        }
        setStatus('Loaded ' + allVisits.length + ' check-ins \u2014 loading remaining mine details 0 / ' + remaining.length + '\u2026');
        for (let i = 0; i < remaining.length; i += DETAILS_FETCH) {
          if (loadId !== visitorsLoadId) return;
          const slice = remaining.slice(i, i + DETAILS_FETCH);
          await fetchPropertyDetailsForIds(slice, null);
          const loaded = Math.min(i + DETAILS_FETCH, remaining.length);
          setStatus('Loaded ' + allVisits.length + ' check-ins \u2014 loading remaining mine details ' + loaded + ' / ' + remaining.length + '\u2026');
          if (loaded === remaining.length || loaded % (DETAILS_FETCH * 5) === 0) {
            renderFromFilters();
          }
        }
        if (loadId !== visitorsLoadId) return;
        console.info('[visitors] complete checkIns', allVisits.length, 'mines', mines.length);
        renderFromFilters();
        setStatus(allVisits.length ? '' : 'No visitors yet \u2014 share your mine coordinates!');
      })().catch(e => {
        console.error('[visitors] progressive load failed', e);
        if (loadId === visitorsLoadId) {
          visitsTruncated = false;
          setStatus('Some visitors or mine details failed to load.');
          renderFromFilters();
        }
      });
    } catch (e) {
      console.error('Visitors load error:', e);
      setStatus('Could not load visitors. ' + (e && e.message ? e.message : ''));
      $('visitors-board').innerHTML = '<div class="vo-empty">Error loading visitors.</div>';
      setToolbar(true);
    }
  }

  
  function syncStickyFilterOffset() {
    const main = $('portal-main');
    const nav = document.querySelector('#portal-main .top-nav') || document.querySelector('.top-nav');
    const bar = document.querySelector('#portal-main .mine-toolbar');
    if (!main || !bar) return;
    let top = 0;
    if (nav) {
      const mr = main.getBoundingClientRect();
      const nr = nav.getBoundingClientRect();
      // How much of the nav still hangs into the main visible area
      top = Math.max(0, Math.min(nr.bottom, mr.bottom) - mr.top);
      // If nav is fully above the main clip, top stays 0
      if (nr.bottom <= mr.top) top = 0;
    }
    bar.style.top = Math.round(top) + 'px';
  }
  (function bindStickyFilterOffset() {
    const main = $('portal-main');
    if (!main || main.dataset.stickyFilterBound === '1') return;
    main.dataset.stickyFilterBound = '1';
    main.addEventListener('scroll', syncStickyFilterOffset, { passive: true });
    window.addEventListener('resize', syncStickyFilterOffset);
    syncStickyFilterOffset();
  })();

  auth.onAuthStateChanged(user => {
    if (!authResolved) {
      document.body.classList.remove('auth-pending');
      authResolved = true;
    }
    if (user) {
      try { sessionStorage.setItem('tmPortalAuthed', '1'); } catch (e) {}
      document.body.classList.remove('auth-pending');

      $('login-screen').style.display = 'none';
      $('portal').style.display = 'flex';
      loadPortal(user);
    } else {

      try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
      document.documentElement.classList.remove('tm-expect-auth');
      document.body.classList.remove('auth-pending');
      loadedUid = null;
      $('portal').style.display = 'none';
      $('login-screen').style.display = 'flex';
    }
  });

  $('btn-google-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-email-signin').addEventListener('click', async () => {
    $('login-error').textContent = '';
    const email = $('input-email').value.trim();
    const pass = $('input-password').value;
    try { await auth.signInWithEmailAndPassword(email, pass); }
    catch (e) {
      $('login-error').textContent = (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
        ? 'Incorrect email or password.' : e.message;
    }
  });
  $('btn-reset').addEventListener('click', async () => {
    const email = $('input-email').value.trim();
    if (!email) { $('login-error').textContent = 'Enter your email first.'; return; }
    try { await auth.sendPasswordResetEmail(email); $('login-error').style.color = '#66BB6A'; $('login-error').textContent = 'Reset email sent!'; }
    catch (e) { $('login-error').textContent = e.message; }
  });
  $('btn-signout').addEventListener('click', () => {
    try { sessionStorage.removeItem('tmPortalAuthed'); } catch (e) {}
    document.documentElement.classList.remove('tm-expect-auth');
    auth.signOut();
  });

  (function initAccountMenu() {
    var toggle = document.getElementById('nav-account-toggle');
    var dropdown = document.getElementById('nav-account-dropdown');
    var wrap = document.querySelector('.nav-account');
    if (!toggle || !dropdown) return;
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var willOpen = dropdown.hasAttribute('hidden');
      if (willOpen) dropdown.removeAttribute('hidden');
      else dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!wrap || wrap.contains(e.target)) return;
      dropdown.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();


  bindShowcasePinDelegationOnce();
  bindMineBadgeClicksOnce();
  bindVoMapPinOnce();
  bindMineMapOnce();
  updateTypeFilterButtons();
  document.querySelectorAll('.type-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.type;
      if (selectedTypes.has(t)) selectedTypes.delete(t);
      else selectedTypes.add(t);
      saveSelectedTypes();
      updateTypeFilterButtons();
      if (loadedUid) renderFromFilters();
    });
  });
  $('filter-search').addEventListener('input', () => { if (loadedUid) renderFromFilters(); });
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.sort;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = 1; }
      if (loadedUid) renderFromFilters();
    });
  });

  (function bindNavPillFollowTips() {
    var DELAY = 320;
    var tipEl = null, tipTimer = null, tipTarget = null, tipX = 0, tipY = 0;
    function ensureTip() {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.className = 'toolbar-follow-tip';
        tipEl.setAttribute('role', 'tooltip');
        document.body.appendChild(tipEl);
      }
      return tipEl;
    }
    function placeTip(x, y) {
      var tip = ensureTip();
      var gap = 14, edge = 8;
      tip.style.visibility = 'hidden';
      tip.style.display = 'block';
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = x + gap, top = y + gap;
      if (left + w > window.innerWidth - edge) left = x - gap - w;
      if (top + h > window.innerHeight - edge) top = y - gap - h;
      if (left < edge) left = edge;
      if (top < edge) top = edge;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.visibility = 'visible';
    }
    function hideTip() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipTarget = null;
      if (tipEl) tipEl.style.display = 'none';
    }
    function bindPill(el) {
      if (!el || el.dataset.navPillTipBound === '1') return;
      el.dataset.navPillTipBound = '1';
      el.addEventListener('mouseenter', function (e) {
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
        tipTarget = el;
        tipX = e.clientX; tipY = e.clientY;
        var tip = ensureTip();
        tip.textContent = (el.getAttribute('data-tip') || '').trim();
        tip.style.display = 'none';
        tipTimer = setTimeout(function () {
          tipTimer = null;
          if (tipTarget !== el || !el.isConnected) return;
          placeTip(tipX, tipY);
        }, DELAY);
      });
      el.addEventListener('mousemove', function (e) {
        if (tipTarget !== el) return;
        tipX = e.clientX; tipY = e.clientY;
        if (tipEl && tipEl.style.display === 'block' && !tipTimer) placeTip(tipX, tipY);
      });
      el.addEventListener('mouseleave', function () {
        if (tipTarget === el) hideTip();
      });
      el.addEventListener('blur', function () {
        if (tipTarget === el) hideTip();
      });
    }
    function ready(fn) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
      else fn();
    }
    ready(function () {
      bindPill(document.querySelector('.nav-pill-usd'));
      bindPill(document.querySelector('.nav-pill-tb'));
    });
  })();
